const { createElement: h, useState, useEffect, useRef, useCallback, useMemo } = React;

// ── helpers ──────────────────────────────────────────────────────────────────
function weekStart(d) {
  const x = new Date(d);
  const day = (x.getDay() + 6) % 7;
  x.setDate(x.getDate() - day);
  x.setHours(0, 0, 0, 0);
  return x;
}
function sum(list, key) { return list.reduce((s, a) => s + (a[key] || 0), 0); }
function fmtNum(v, dec) { return Number(v).toLocaleString('fr-FR', { minimumFractionDigits: dec, maximumFractionDigits: dec }); }
function fmtPace(min) {
  if (!isFinite(min) || min <= 0) return '—';
  const total = Math.round(min * 60);
  return Math.floor(total / 60) + "'" + String(total % 60).padStart(2, '0') + '"';
}
function fmtH(min) { const h = Math.floor(min / 60); return h + 'h' + String(Math.round(min % 60)).padStart(2, '0'); }
function fmtDur(min) { min = Math.round(min); return min >= 60 ? fmtH(min) : min + ' min'; }
function isoLocal(dt) { const z = new Date(dt); return z.getFullYear() + '-' + String(z.getMonth() + 1).padStart(2, '0') + '-' + String(z.getDate()).padStart(2, '0'); }
function btnStyle(active) {
  return {
    padding: '9px 14px', border: '2px solid ' + (active ? '#ec3013' : '#201e1d'),
    background: active ? '#ec3013' : 'transparent', color: active ? '#ffffff' : '#201e1d',
    fontFamily: 'inherit', fontSize: '12px', fontWeight: '600', letterSpacing: '0.08em',
    textTransform: 'uppercase', textAlign: 'left', cursor: 'pointer',
  };
}
function navStyle(active, sub) {
  return {
    display: 'flex', alignItems: 'center', gap: '10px', width: '100%',
    padding: sub ? '11px 24px 11px 38px' : '15px 24px',
    border: '0', borderBottom: sub ? '1px solid #d7d3d3' : '2px solid #201e1d',
    background: active ? '#ec3013' : 'transparent', color: active ? '#ffffff' : '#201e1d',
    fontFamily: 'inherit', fontSize: sub ? '12px' : '13px', fontWeight: '600',
    letterSpacing: '0.08em', textTransform: 'uppercase', textAlign: 'left', cursor: 'pointer',
  };
}
function deltaChip(pct, betterHigh) {
  if (pct === null || !isFinite(pct)) return { text: '—', style: { padding: '3px 8px', fontSize: '12px', fontWeight: '600', background: '#eae9e9', color: '#605d5d' }, arrow: '', arrowStyle: { fontSize: '13px', color: '#605d5d' } };
  const good = betterHigh ? pct > 0 : pct < 0;
  const flat = pct === 0;
  const bad = !good && !flat;
  const sign = pct > 0 ? '+' : '';
  return {
    text: flat ? '—' : sign + pct + '%',
    style: { padding: '3px 8px', fontSize: '12px', fontWeight: '600', letterSpacing: '0.04em', background: flat ? '#eae9e9' : good ? '#ffe0d9' : '#eae9e9', color: flat ? '#605d5d' : good ? '#ae1800' : '#605d5d' },
    arrow: good ? '▲' : bad ? '▼' : '',
    arrowStyle: { fontSize: '13px', lineHeight: '1', color: good ? '#ec3013' : bad ? '#605d5d' : 'transparent' },
  };
}

// ── activity mapping ─────────────────────────────────────────────────────────
function mapActivity(a) {
  const map = {
    Run: 'Course', VirtualRun: 'Course', TrailRun: 'Trail',
    Ride: 'Vélo', VirtualRide: 'Vélo', GravelRide: 'Vélo', MountainBikeRide: 'Vélo', EBikeRide: 'Vélo',
    Swim: 'Natation',
  };
  const sport = map[a.sport_type || a.type];
  if (!sport) return null;
  const dist = (a.distance || 0) / 1000;
  const time = Math.round((a.moving_time || a.elapsed_time || 0) / 60);
  if (!time) return null;
  return {
    id: a.id,
    date: new Date(a.start_date_local || a.start_date),
    name: a.name || null, sport, dist: Math.round(dist * 10) / 10, time,
    elev: Math.round(a.total_elevation_gain || 0),
    pace: dist > 0 ? time / dist : null,
    power: a.average_watts ? Math.round(a.average_watts) : null,
    maxPower: a.max_watts ? Math.round(a.max_watts) : null,
    secs: a.moving_time || a.elapsed_time || 0,
    hr: a.average_heartrate ? Math.round(a.average_heartrate) : null,
    maxHr: a.max_heartrate ? Math.round(a.max_heartrate) : null,
    cadence: a.average_cadence ? Math.round(a.average_cadence) : null,
    trainingLoad: a.suffer_score || Math.round(time * 0.85),
    planned: false,
  };
}

  'Triathlon M':  { fields: [{ k:'swim',label:'Natation (km)',v:1.5,step:0.1},{k:'bike',label:'Vélo (km)',v:40},{k:'bikeElev',label:'D+ vélo (m)',v:350,step:10},{k:'run',label:'Course (km)',v:10,step:0.1},{k:'runElev',label:'D+ course (m)',v:70,step:10}]},

  '10 km':        { fields: [{k:'run',label:'Distance (km)',v:10,step:0.1},{k:'runElev',label:'Dénivelé D+ (m)',v:50,step:10},{k:'runElevNeg',label:'Dénivelé D\u2212 (m)',v:50,step:10}]},
  'Trail court (moins de 25 km)': { fields: [{k:'run',label:'Distance (km)',v:21,step:0.1},{k:'runElev',label:'Dénivelé D+ (m)',v:1100,step:10},{k:'runElevNeg',label:'Dénivelé D\u2212 (m)',v:1100,step:10}]},
  'Trail long (25\u201350 km)':  { fields: [{k:'run',label:'Distance (km)',v:42,step:0.1},{k:'runElev',label:'Dénivelé D+ (m)',v:2400,step:10},{k:'runElevNeg',label:'Dénivelé D\u2212 (m)',v:2400,step:10}]},
  'Ultra-trail (plus de 80 km)': { fields: [{k:'run',label:'Distance (km)',v:105,step:1},{k:'runElev',label:'Dénivelé D+ (m)',v:6000,step:10},{k:'runElevNeg',label:'Dénivelé D\u2212 (m)',v:6000,step:10}]},
  'Cyclosportive':{ fields: [{k:'bike',label:'Distance (km)',v:140},{k:'bikeElev',label:'Dénivelé D+ (m)',v:2600,step:10}]},
  'Contre-la-montre vélo': { fields: [{k:'bike',label:'Distance (km)',v:40},{k:'bikeElev',label:'Dénivelé D+ (m)',v:250,step:10}]},
  'Natation eau libre': { fields: [{k:'swim',label:'Distance (km)',v:5,step:0.1},{k:'swimTemp',label:'Température (°C)',v:18}]},
};
function defaultValues(type) {
  const out = {};
  (RACE_CATALOG[type] || { fields: [] }).fields.forEach(f => { out[f.k] = f.v; });
  return out;
}

// ── Strava API ────────────────────────────────────────────────────────────────
const BASE = '/api';
const STRAVA_CLIENT_ID = '274766';
const STRAVA_REDIRECT = 'https://better-strava.vercel.app/';

async function resolveClientId() {
  if (STRAVA_CLIENT_ID) return STRAVA_CLIENT_ID;
  try { const cfg = await fetch(BASE + '/strava-config').then(r => r.json()); if (cfg && cfg.client_id) return String(cfg.client_id); } catch (e) {}
  return '';
}
function stravaApi(path, token) {
  return fetch(BASE + '/strava-api?path=' + encodeURIComponent(path), { headers: { authorization: 'Bearer ' + token } }).then(r => r.json());
}
async function freshToken(token) {
  const exp = Number(localStorage.getItem('strava_expires_at') || 0);
  const refresh = localStorage.getItem('strava_refresh_token');
  if (!refresh || !exp || exp * 1000 - Date.now() > 5 * 60000) return token;
  try {
    const res = await fetch(BASE + '/exchange-token?refresh_token=' + encodeURIComponent(refresh)).then(r => r.json());
    if (res && res.access_token) {
      localStorage.setItem('strava_token', res.access_token);
      if (res.refresh_token) localStorage.setItem('strava_refresh_token', res.refresh_token);
      if (res.expires_at) localStorage.setItem('strava_expires_at', String(res.expires_at));
      return res.access_token;
    }
  } catch (e) {}
  return token;
}

// ── crosshair plugin ─────────────────────────────────────────────────────────
const crosshairPlugin = {
  id: 'crosshair',
  afterEvent(chart, args) {
    const e = args.event;
    const ca = chart.chartArea;
    if (!ca) return;
    chart._cx = (e.type === 'mousemove' && e.x >= ca.left && e.x <= ca.right) ? e.x : null;
    if (e.type === 'mouseout') chart._cx = null;
  },
  afterDatasetsDraw(chart) {
    if (chart._cx == null || !chart.chartArea) return;
    const { ctx, chartArea } = chart;
    ctx.save(); ctx.beginPath();
    ctx.moveTo(chart._cx, chartArea.top); ctx.lineTo(chart._cx, chartArea.bottom);
    ctx.lineWidth = 1; ctx.strokeStyle = '#201e1d'; ctx.stroke(); ctx.restore();
  },
};
// ── aura de survol : met en surbrillance la portion de courbe cliquable ──────
// Options : options.plugins.clickAura = { srcByLabel } (map label -> tableau d'ids source).
// Au survol, on éclaire le segment contigu de la courbe la plus proche qui partage
// la même activité source (celle qui sera chargée dans « Séance 1 » au clic).
const clickAuraPlugin = {
  id: 'clickAura',
  afterEvent(chart, args) {
    const e = args.event;
    const ca = chart.chartArea;
    if (!ca) { return; }
    let x = null, y = null;
    if (e.type === 'mousemove' && e.x >= ca.left && e.x <= ca.right && e.y >= ca.top && e.y <= ca.bottom) {
      x = e.x; y = e.y;
    }
    if (x !== chart._auraX || y !== chart._auraY) { chart._auraX = x; chart._auraY = y; args.changed = true; }
  },
  afterDatasetsDraw(chart, args, opts) {
    const clk = opts && opts.srcByLabel;
    if (!clk || chart._auraX == null || !chart.chartArea) return;
    const mx = chart._auraX, my = chart._auraY;
    let best = null, bestDy = Infinity;
    chart.data.datasets.forEach((ds, di) => {
      const src = clk[ds.label];
      if (!src) return;
      const meta = chart.getDatasetMeta(di);
      if (!meta || meta.hidden || !meta.data || !meta.data.length) return;
      let ni = -1, nd = Infinity;
      for (let i = 0; i < meta.data.length; i++) {
        if (src[i] == null || meta.data[i].skip) continue;
        const d = Math.abs(meta.data[i].x - mx);
        if (d < nd) { nd = d; ni = i; }
      }
      if (ni < 0) return;
      const dy = Math.abs(meta.data[ni].y - my);
      if (dy < bestDy) { bestDy = dy; best = { ni, src, pts: meta.data, color: ds.borderColor }; }
    });
    if (!best || bestDy > 44) return;
    const sid = best.src[best.ni];
    let a = best.ni, b = best.ni;
    while (a > 0 && best.src[a - 1] === sid) a--;
    while (b < best.src.length - 1 && best.src[b + 1] === sid) b++;
    // Prolonger d'un pas de part et d'autre pour rejoindre les repères de changement.
    if (b < best.src.length - 1) b++;
    const { ctx } = chart;
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(best.pts[a].x, best.pts[a].y);
    for (let i = a + 1; i <= b; i++) ctx.lineTo(best.pts[i].x, best.pts[i].y);
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = best.color || '#7c4dbc';
    ctx.shadowColor = best.color || '#7c4dbc';
    ctx.shadowBlur = 8;
    ctx.globalAlpha = 0.28;
    ctx.stroke();
    ctx.restore();
    chart.canvas.style.cursor = 'pointer';
  },
};
// ── repères de mois sur l'axe des abscisses (charts hebdo/quotidiens) ────────
// Trait vertical fin + abréviation du mois à chaque changement de mois.
// Les bornes sont passées via options.plugins.monthMarkers.boundaries = [{idx,label}].
const monthMarkersPlugin = {
  id: 'monthMarkers',
  afterDatasetsDraw(chart) {
    const cfg = chart.options.plugins && chart.options.plugins.monthMarkers;
    if (!cfg || !cfg.boundaries || !cfg.boundaries.length) return;
    const x = chart.scales.x;
    if (!x) return;
    const { ctx, chartArea } = chart;
    ctx.save();
    ctx.font = '700 9px Archivo, system-ui, sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    cfg.boundaries.forEach(b => {
      const px = x.getPixelForValue(b.idx);
      if (!isFinite(px) || px < chartArea.left || px > chartArea.right) return;
      ctx.strokeStyle = 'rgba(32,30,29,0.16)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(px, chartArea.top);
      ctx.lineTo(px, chartArea.bottom);
      ctx.stroke();
      ctx.fillStyle = '#bab6b6';
      ctx.fillText(b.label.toUpperCase(), px + 3, chartArea.top + 2);
    });
    ctx.restore();
  },
};
// Bornes de mois pour une liste de timestamps (début de semaine ou jour).
function monthBoundaries(tsList) {
  const out = [];
  for (let i = 1; i < tsList.length; i++) {
    const d = new Date(tsList[i]), p = new Date(tsList[i - 1]);
    if (d.getMonth() !== p.getMonth() || d.getFullYear() !== p.getFullYear()) {
      out.push({ idx: i, label: d.toLocaleDateString('fr-FR', { month: 'short' }) });
    }
  }
  return out;
}
function chartDefaults() {
  Chart.defaults.font.family = 'Archivo, system-ui, sans-serif';
  Chart.defaults.font.size = 11;
  Chart.defaults.color = '#605d5d';
  // Infobulle : toujours ancrée EN HAUT du graphique (elle ne suit pas la courbe)
  let TT = null;
  try { TT = Chart.Tooltip || Chart.registry.plugins.get('tooltip'); } catch (e) {}
  if (TT && TT.positioners) {
    if (!TT.positioners.topEdge) {
      TT.positioners.topEdge = function (items, evtPos) {
        const ca = this.chart.chartArea;
        if (!ca) return evtPos || false;
        return { x: evtPos ? evtPos.x : (ca.left + ca.right) / 2, y: ca.top };
      };
    }
    Chart.defaults.plugins.tooltip.position = 'topEdge';
    Chart.defaults.plugins.tooltip.yAlign = 'top';
    Chart.defaults.plugins.tooltip.caretSize = 0;
    Chart.defaults.plugins.tooltip.caretPadding = 2;
  }
  Chart.defaults.plugins.tooltip.backgroundColor = 'rgba(32,30,29,0.88)';
  // Pas d'agrandissement des points au survol
  Chart.defaults.elements.point.hoverRadius = 0;
  Chart.defaults.elements.point.hoverBorderWidth = 0;
}

// Libellé court d'un mois situé `back` mois avant le mois en cours (0 = mois en cours).
function monthAgoLabel(back) {
  const now = new Date();
  const d = new Date(now.getFullYear(), now.getMonth() - back, 1);
  return d.toLocaleDateString('fr-FR', { month: 'short' }).replace('.', '');
}

// Boutons de période communs à toutes les pages.
const PERIOD_BTNS = [
  { label: '30 jours', value: 30 }, { label: '90 jours', value: 90 },
  { label: '6 mois', value: 180 }, { label: '12 mois', value: 365 },
];

// Bornes pour la bande décorative : période sélectionnée (selDays) + comparaison
// (cmpDays, même durée par défaut, juste avant). À 1 an on cale sur 12 mois pleins.
function stripBounds(selDays, cmpDays) {
  const c = cmpDays || selDays;
  if (selDays >= 365) {
    const d = new Date();
    const selStart = new Date(d.getFullYear(), d.getMonth() - 12, 1).getTime();
    const selEnd = new Date(d.getFullYear(), d.getMonth(), 1).getTime();
    return { selStart, selEnd, cmpStart: selStart - c * 86400000, cmpEnd: selStart, dropCurrent: true };
  }
  const selStart = Date.now() - selDays * 86400000;
  return { selStart, selEnd: Date.now(), cmpStart: selStart - c * 86400000, cmpEnd: selStart, dropCurrent: false };
}

// Bande décorative (affichage seul) : 12 mois, mois en cours à droite.
//  · chaque barre est remplie au prorata de la part du mois dans la période
//  · la barre du mois en cours est rognée à la portion écoulée et calée à droite
//  · à 1 an : 12 mois pleins, ni mois en cours ni barre vide
//  · cmpColor = couleur de la période de comparaison (orange clair ou gris)
//  · showCmp = false → on masque la comparaison
function PeriodStrip({ selStart, selEnd, cmpStart, cmpEnd, cmpColor = '#f9a882', dropCurrent = false, showCmp = true }) {
  const now = new Date();
  const useCmp = showCmp && cmpStart != null;
  const cols = Array.from({ length: 12 }, (_, i) => {
    const back = dropCurrent ? 12 - i : 11 - i;
    const isCur = !dropCurrent && back === 0;
    const ms = new Date(now.getFullYear(), now.getMonth() - back, 1).getTime();
    const meFull = new Date(now.getFullYear(), now.getMonth() - back + 1, 1).getTime();
    const me = isCur ? Date.now() : meFull;
    const L = Math.max(1, me - ms);
    const clamp = v => Math.max(0, Math.min(1, v));
    const os = clamp((selStart - ms) / L), oe = clamp((selEnd - ms) / L);
    const cs = useCmp ? clamp((cmpStart - ms) / L) : 0;
    const ce = useCmp ? clamp((cmpEnd - ms) / L) : 0;
    return {
      i, back, grow: isCur ? (me - ms) / (meFull - ms) : 1,
      seg: [
        ce > cs ? { l: cs, w: ce - cs, c: cmpColor } : null,
        oe > os ? { l: os, w: oe - os, c: '#ec3013' } : null,
      ].filter(Boolean),
    };
  });
  const slot = g => ({ flexGrow: g, flexShrink: 1, flexBasis: 0, minWidth: '2px' });
  return h('div', { style: { display: 'flex', flexDirection: 'column', gap: '3px' } },
    h('div', { style: { display: 'flex', gap: '2px', width: '264px', alignItems: 'stretch' } },
      cols.map(col => h('div', { key: col.i, title: monthAgoLabel(col.back),
        style: { ...slot(col.grow), height: '16px', background: '#eae9e9', position: 'relative', overflow: 'hidden' } },
        col.seg.map((s, si) => h('span', { key: si, style: { position: 'absolute', top: 0, bottom: 0, left: (s.l * 100) + '%', width: (s.w * 100) + '%', background: s.c } }))
      ))
    ),
    h('div', { style: { display: 'flex', gap: '2px', width: '264px' } },
      cols.map(col => h('span', { key: col.i, style: { ...slot(col.grow), textAlign: 'center', fontSize: '8px', fontWeight: '700', color: '#bab6b6', textTransform: 'uppercase', overflow: 'hidden' } }, monthAgoLabel(col.back).charAt(0)))
    )
  );
}

// 4 boutons de période à choix unique (VO2 max / Efficacité / Condition physique),
// même style que les boutons on/off de Puissance / FC.
function PeriodBtns({ value, onChange, curves }) {
  return h('div', { style: { display: 'flex', gap: '6px', flexWrap: 'wrap' } },
    curves.map(p => {
      const on = value === p.d;
      return h('button', { key: p.d, type: 'button', onClick: () => onChange(p.d),
        style: {
          padding: '5px 10px', border: '2px solid ' + (on ? '#ec3013' : '#d7d3d3'),
          background: on ? '#ec3013' : 'transparent', color: on ? '#ffffff' : '#605d5d',
          fontFamily: 'inherit', fontSize: '11px', fontWeight: '700', letterSpacing: '0.06em',
          textTransform: 'uppercase', cursor: 'pointer',
        },
      }, p.label);
    })
  );
}

// 4 boutons de période on/off (Puissance / Fréquence cardiaque). Chaque bouton
// allumé = une courbe de cette couleur sur le graphique.

// ── zone minutes ─────────────────────────────────────────────────────────────
function zoneMinutes(list, fcMax) {
  const max = Number(fcMax) || 190;
  const defs = [
    { label: 'Z1 · récup', hi: 0.6, color: '#ffe0d9', min: 0 },
    { label: 'Z2 · endurance', hi: 0.7, color: '#ffb3a3', min: 0 },
    { label: 'Z3 · tempo', hi: 0.8, color: '#f97a60', min: 0 },
    { label: 'Z4 · seuil', hi: 0.9, color: '#ec3013', min: 0 },
    { label: 'Z5 · VMA', hi: 1.2, color: '#ae1800', min: 0 },
  ];
  list.forEach(a => {
    if (!a.hr) return;
    const ratio = a.hr / max;
    const z = defs.find(d => ratio <= d.hi) || defs[4];
    z.min += a.time;
  });
  return defs;
}

// ── Estimation de puissance vélo (modèle physique) ───────────────────────────
const CRR = 0.008;
const CDA = 0.35;
const RHO = 1.225;
const ETA = 0.97;
const G   = 9.81;

function estimatePower(v_kmh, slope_pct, totalMassKg) {
  if (!v_kmh || v_kmh <= 0 || !totalMassKg || totalMassKg <= 0) return null;
  const v = v_kmh / 3.6;
  const grade = (slope_pct || 0) / 100;
  const P_roll  = CRR * totalMassKg * G * v;
  const P_aero  = 0.5 * CDA * RHO * v * v * v;
  const P_grav  = totalMassKg * G * grade * v;
  return Math.max(0, Math.round((P_roll + P_aero + P_grav) / ETA));
}

// ── Construction du stream de puissance avec lissage altimétrique ────────────
// Lissage altitude sur ±15 s (fenêtre 30 s) avant calcul de pente,
// identique à la méthode Strava/Garmin pour le gradient affiché.
// Sans lissage, le bruit GPS (~1-3 m) sur 1 seconde génère des pics de pente
// artificiels (ex. 0% / 25% / 0% au lieu d'une côte régulière à 6%).
function buildPowArr(vel, alt, dist, totalMassKg) {
  if (!vel || !vel.length || !totalMassKg) return null;
  const n = vel.length;
  const pow = new Float32Array(n);

  // Étape 1 : lisser l'altitude avec une moyenne glissante ±15 s
  const HALF = 15;
  let smoothAlt = null;
  if (alt && alt.length === n) {
    smoothAlt = new Float32Array(n);
    let sum = 0;
    // Initialiser la fenêtre sur les premiers HALF points
    for (let k = 0; k < Math.min(HALF, n); k++) sum += alt[k];
    let lo = 0, hi = Math.min(HALF, n - 1), cnt = hi - lo + 1;
    for (let i = 0; i < n; i++) {
      smoothAlt[i] = sum / cnt;
      // Faire glisser la fenêtre
      const nextHi = Math.min(i + HALF + 1, n - 1);
      const nextLo = Math.max(0, i - HALF + 1);
      if (nextHi > hi) { sum += alt[nextHi]; hi = nextHi; cnt++; }
      if (nextLo > lo) { sum -= alt[lo]; lo = nextLo; cnt--; }
    }
  }

  // Étape 2 : calculer la puissance seconde par seconde avec la pente lissée
  for (let i = 0; i < n; i++) {
    const v_kmh = vel[i] * 3.6;
    let slope = 0;
    if (smoothAlt && i > 0) {
      const dAlt  = smoothAlt[i] - smoothAlt[i - 1];
      const dDist = dist ? Math.max(0.1, dist[i] - dist[i - 1]) : Math.max(0.1, vel[i]);
      slope = Math.max(-30, Math.min(30, (dAlt / dDist) * 100));
    }
    const p = estimatePower(v_kmh, slope, totalMassKg);
    pow[i] = p !== null ? p : 0;
  }
  return pow;
}

// ── TSS / NP / IF (méthode TrainingPeaks + HRSS Elevate) ─────────────────────
function calcNP(powArr) {
  if (!powArr || powArr.length < 30) return null;
  const n = powArr.length;
  const roll30 = new Float32Array(n);
  let win = 0;
  for (let i = 0; i < 30; i++) win += powArr[i];
  for (let i = 30; i < n; i++) {
    roll30[i] = win / 30;
    win += powArr[i] - powArr[i - 30];
  }
  let sum4 = 0, count4 = 0;
  for (let i = 30; i < n; i++) { sum4 += Math.pow(roll30[i], 4); count4++; }
  if (!count4) return null;
  return Math.round(Math.pow(sum4 / count4, 0.25));
}

// ── HRSS — Heart Rate Stress Score (Elevate / intervals.icu) ─────────────────
// 1h a la LTHR = 100 points (normalisation identique a intervals.icu)
// Stream HR prioritaire; fallback sur FC moyenne si pas de stream.
function calcHRSS(durSec, avgHr, hrStream, hrMax, hrRest, lthr) {
  const fcMax  = hrMax  || 190;
  const fcRest = hrRest || 50;
  // LTHR par defaut : 88% de la reserve FC si non renseigne
  const fcLTHR = lthr || Math.round(fcRest + (fcMax - fcRest) * 0.88);
  const reserve = fcMax - fcRest;
  if (reserve <= 0) return null;

  const lthrFrac = Math.min(1, (fcLTHR - fcRest) / reserve);
  const yLTHR    = lthrFrac * 0.64 * Math.exp(1.92 * lthrFrac);
  const trimpRef = 60 * yLTHR;
  if (trimpRef <= 0) return null;

  let trimp = 0;
  let durMin = durSec / 60;

  if (hrStream && hrStream.length >= 30) {
    for (let i = 0; i < hrStream.length; i++) {
      const hr = hrStream[i];
      if (!hr || hr < 50) continue;
      const hrFrac = Math.min(1.2, (hr - fcRest) / reserve);
      if (hrFrac <= 0) continue;
      trimp += (1 / 60) * hrFrac * 0.64 * Math.exp(1.92 * hrFrac);
    }
    durMin = hrStream.filter(h => h && h > 50).length / 60;
  } else if (avgHr && avgHr > 50) {
    const hrFrac = Math.min(1.2, (avgHr - fcRest) / reserve);
    if (hrFrac <= 0) return null;
    trimp = (durSec / 60) * hrFrac * 0.64 * Math.exp(1.92 * hrFrac);
  } else {
    return null;
  }

  const hrss = Math.round((trimp / trimpRef) * 100);
  const ifHR = durMin > 0
    ? Math.round(Math.sqrt((trimp / durMin) / yLTHR) * 100) / 100
    : 0;
  return { hrss, trimp: Math.round(trimp * 10) / 10, ifHR, lthrUsed: fcLTHR };
}

// ── calcCharge — règle unique ─────────────────────────────────────────────────
// TSS  : si l'activité a des données de puissance natives Strava (act.power) + FTP
// HRSS : sinon, si FC disponible (stream ou moyenne)
// null : si ni puissance ni FC
// On s'y tient partout — calendrier, détail, PMC.
function calcTSS(act, streams, ftpOrPace, hrMaxBpm, hrRestBpm, lthrBpm) {
  const durSec = act.secs || act.time * 60;
  if (!durSec || durSec < 120) return null;

  // ── Vélo avec puissance Strava native ────────────────────────────────────
  // "Puissance native" = act.power vient de Strava (capteur réel), pas estimé.
  // On n'utilise PAS le stream pow estimé (buildPowArr) pour le TSS.
  if (act.sport === 'Vélo' && act.power && act.power > 0) {
    const ftpW = ftpOrPace && ftpOrPace > 50 ? ftpOrPace : null;
    if (ftpW) {
      const np    = streams?.pow && streams.pow.length >= 30 ? calcNP(streams.pow) : act.power;
      const ifVal = Math.round((np / ftpW) * 100) / 100;
      const tss   = Math.round((durSec * np * ifVal) / (ftpW * 3600) * 100);
      const hrRes = calcHRSS(durSec, act.avgHr || act.hr, streams?.hr || null, hrMaxBpm, hrRestBpm, lthrBpm);
      return { charge: tss, method: 'TSS', np, ifVal, hrss: hrRes?.hrss ?? null, ifHR: hrRes?.ifHR ?? null };
    }
  }

  // ── HRSS pour tous les sports (y compris vélo sans capteur) ──────────────
  const hrStream = streams?.hr || null;
  const hrRes = calcHRSS(durSec, act.avgHr || act.hr, hrStream, hrMaxBpm, hrRestBpm, lthrBpm);
  if (hrRes) {
    return { charge: hrRes.hrss, method: 'HRSS', np: null, ifVal: hrRes.ifHR, hrss: hrRes.hrss, ifHR: hrRes.ifHR, lthrUsed: hrRes.lthrUsed };
  }

  // ── Pas de données suffisantes ────────────────────────────────────────────
  return null;
}
// Alias pour le PMC (qui utilise .tss)
function _tssVal(td) { return td?.charge ?? null; }

function tssColor(tss) {
  if (!tss) return '#bab6b6';
  if (tss < 50)  return '#605d5d';   // léger
  if (tss < 100) return '#f97a60';   // modéré
  if (tss < 150) return '#ec3013';   // dur
  return '#ae1800';                   // très dur
}

// ── EF / VI / Découplage aérobie ─────────────────────────────────────────────

// EF = NP (ou vitesse norm.) / FC moyenne
// Vélo : EF = NP / avgHr  → W/bpm
// Course : EF = vitesse_moy(m/min) / avgHr  → (m/min)/bpm
function calcEF(sport, np, avgVelMs, avgHr) {
  if (!avgHr || avgHr < 50) return null;
  if (sport === 'Vélo') {
    if (!np) return null;
    return Math.round((np / avgHr) * 100) / 100; // W/bpm
  } else {
    if (!avgVelMs || avgVelMs <= 0) return null;
    const mPerMin = avgVelMs * 60;
    return Math.round((mPerMin / avgHr) * 100) / 100; // (m/min)/bpm
  }
}

// VI = NP / puissance_moyenne (vélo uniquement, doit être proche de 1.0)
function calcVI(np, avgPow) {
  if (!np || !avgPow || avgPow <= 0) return null;
  return Math.round((np / avgPow) * 100) / 100;
}

// ── Efficiency Factor agrégé (période ou séance) ─────────────────────────────
function avgStream(arr) {
  if (!arr || !arr.length) return null;
  let s = 0, c = 0;
  for (let i = 0; i < arr.length; i++) { const v = arr[i]; if (v > 0) { s += v; c++; } }
  return c ? s / c : null;
}
function actEF(sport, s) {
  if (!s || s === 'error' || !s.hr) return null;
  const hr = avgStream(s.hr);
  if (!hr) return null;
  if (sport === 'Vélo') {
    if (!s.pow) return null;
    const np = calcNP(s.pow) || avgStream(s.pow);
    return calcEF('Vélo', np, null, hr);
  }
  if (!s.vel) return null;
  return calcEF('Course', null, avgStream(s.vel), hr);
}
function periodEF(sport, list, actStreams, t0, t1) {
  const pool = list.filter(a => a.sport === sport && a.date.getTime() >= t0 && a.date.getTime() < t1);
  const efs = [];
  for (const a of pool) {
    const ef = actEF(sport, actStreams[a.id]);
    if (ef) efs.push(ef);
  }
  if (!efs.length) return null;
  return Math.round((efs.reduce((x, y) => x + y, 0) / efs.length) * 100) / 100;
}
// EF d'une activité : streams si disponibles, sinon retombe sur les moyennes de la
// séance (puissance moyenne / FC moy pour le vélo, vitesse moy / FC moy pour la course).
function activityEF(act, s) {
  const isBike = act.sport === 'Vélo';
  const fromStream = actEF(isBike ? 'Vélo' : 'Course', s);
  if (fromStream != null) return fromStream;
  const hr = act.avgHr || act.hr;
  if (!hr) return null;
  if (isBike) {
    if (!act.power) return null;
    return calcEF('Vélo', act.power, null, hr);
  }
  if (!act.dist || !act.time) return null;
  return calcEF('Course', null, (act.dist * 1000) / (act.time * 60), hr);
}

// ── Répartition du temps par zone de FC (sur le stream seconde par seconde) ──
function hrZoneBreakdown(hrArr, fcMax) {
  const max = Number(fcMax) || 190;
  const bounds = [0.6, 0.7, 0.8, 0.9, 1.2];
  const labels = ['Z1 récup', 'Z2 endurance', 'Z3 tempo', 'Z4 seuil', 'Z5 VMA/PMA'];
  if (!hrArr || !hrArr.length) return [];
  const cnt = [0, 0, 0, 0, 0];
  let tot = 0;
  for (let i = 0; i < hrArr.length; i++) {
    const v = hrArr[i];
    if (!v || v < 40) continue;
    const r = v / max;
    let z = bounds.findIndex(b => r <= b);
    if (z < 0) z = 4;
    cnt[z]++; tot++;
  }
  if (!tot) return [];
  return labels.map((label, i) => ({ label, pct: Math.round((cnt[i] / tot) * 100), min: Math.round(cnt[i] / 60) }));
}

// ── Détection des efforts / répétitions dans un stream (intervalles) ─────────
// Repère les blocs nettement au-dessus de l'intensité de fond, puis les regroupe
// par durée et intensité voisines → « 3 × ~10 min à … ».
function detectEfforts(sport, s) {
  const raw = sport === 'Vélo' ? (s && s.pow) : (s && s.vel);
  const hr = s && s.hr;
  if (!raw || raw.length < 360) return { efforts: [], groups: [] };
  const N = raw.length;
  const win = 15;
  const sm = new Float64Array(N);
  let acc = 0;
  for (let i = 0; i < N; i++) {
    acc += raw[i];
    if (i >= win) acc -= raw[i - win];
    sm[i] = acc / Math.min(i + 1, win);
  }
  const sorted = Array.from(sm).filter(v => v > 0).sort((a, b) => a - b);
  if (!sorted.length) return { efforts: [], groups: [] };
  const base = sorted[Math.floor(sorted.length * 0.45)] || 1;
  const thr = base * (sport === 'Vélo' ? 1.18 : 1.12);
  const efforts = [];
  let start = -1;
  for (let i = 0; i <= N; i++) {
    const on = i < N && sm[i] >= thr;
    if (on && start < 0) start = i;
    if ((!on || i === N) && start >= 0) {
      const dur = i - start;
      if (dur >= 55) {
        let sv = 0, sh = 0, ch = 0;
        for (let k = start; k < i; k++) { sv += raw[k]; if (hr && hr[k] > 0) { sh += hr[k]; ch++; } }
        efforts.push({ startMin: Math.round(start / 60), durMin: Math.round((dur / 60) * 10) / 10, value: sv / dur, hr: ch ? Math.round(sh / ch) : null });
      }
      start = -1;
    }
  }
  const groups = [];
  efforts.forEach(e => {
    const g = groups.find(g => Math.abs(g.durMin - e.durMin) / g.durMin < 0.3 && Math.abs(g.value - e.value) / g.value < 0.1);
    if (g) {
      const n = g.n + 1;
      g.durMin = Math.round(((g.durMin * g.n + e.durMin) / n) * 10) / 10;
      g.value = (g.value * g.n + e.value) / n;
      if (e.hr) g.hr = Math.round(((g.hr || e.hr) * g.n + e.hr) / n);
      g.n = n;
    } else {
      groups.push({ n: 1, durMin: e.durMin, value: e.value, hr: e.hr });
    }
  });
  return { efforts: efforts.slice(0, 16), groups };
}

// ── VO2max estimé — méthode sous-maximale allure + FC (façon Firstbeat/Garmin/Polar) ──
// Principe : sur un effort aérobie sous-maximal et stable, le coût en oxygène de la
// course (formule ACSM) et la fraction de réserve cardiaque utilisée (%FCR) sont
// supposés proportionnels à la fraction de VO2max réserve utilisée. On extrapole donc
// le VO2 de l'allure jusqu'à 100 % de la FC de réserve pour obtenir le VO2max.
//   VO2 course (ml/kg/min) ≈ 0.2·v(m/min) + 0.9·v·pente + 3.5      (ACSM, terrain + D+)
//   %FCR = (FC − FCrepos) / (FCmax − FCrepos)
//   VO2max ≈ 3.5 + (VO2course − 3.5) / %FCR
function runVo2Submax(vMinPerMin, gradePct) {
  const grade = Math.max(-0.05, Math.min(0.15, gradePct || 0));
  return 0.2 * vMinPerMin + 0.9 * vMinPerMin * grade + 3.5;
}
function estimateVo2maxFromRun(act, hrMax, hrRest) {
  if (!hrMax || !hrRest || hrMax <= hrRest) return null;
  if (act.sport !== 'Course' && act.sport !== 'Trail') return null;
  const hr = act.avgHr || act.hr;
  if (!hr || !act.dist || !act.time || act.time < 9) return null;
  const hrr = (hr - hrRest) / (hrMax - hrRest);
  // Effort exploitable seulement dans une plage sous-maximale (endurance → seuil) :
  // trop bas = pas assez fiable, trop haut = plus vraiment sous-maximal.
  if (hrr < 0.5 || hrr > 0.95) return null;
  const vMin = (act.dist * 1000) / act.time; // m/min
  if (vMin < 100 || vMin > 350) return null; // filtre allures aberrantes (marche / sprint isolé)
  const grade = act.elev && act.dist ? act.elev / (act.dist * 1000) : 0;
  const vo2sub = runVo2Submax(vMin, grade);
  const vo2max = 3.5 + (vo2sub - 3.5) / hrr;
  if (vo2max < 25 || vo2max > 85) return null;
  return Math.round(vo2max * 10) / 10;
}
// VO2max estimé depuis une sortie VÉLO — même principe (sous-maximal + %FCR),
// coût en O2 du pédalage par la formule ACSM : VO2 = 10.8·W/kg + 7.
function estimateVo2maxFromRide(act, streamPow, hrMax, hrRest, weightKg) {
  if (!hrMax || !hrRest || hrMax <= hrRest || !weightKg) return null;
  if (act.sport !== 'Vélo') return null;
  const hr = act.avgHr || act.hr;
  if (!hr || !act.time || act.time < 9) return null;
  let watts = act.power || null;
  if (!watts && streamPow && streamPow.length) {
    let s = 0, c = 0;
    for (let i = 0; i < streamPow.length; i++) { const v = streamPow[i]; if (v > 0) { s += v; c++; } }
    watts = c ? s / c : null;
  }
  if (!watts || watts < 50 || watts > 400) return null;
  const hrr = (hr - hrRest) / (hrMax - hrRest);
  if (hrr < 0.5 || hrr > 0.95) return null;
  const vo2sub = 10.8 * (watts / weightKg) + 7;
  const vo2max = 3.5 + (vo2sub - 3.5) / hrr;
  if (vo2max < 25 || vo2max > 90) return null;
  return Math.round(vo2max * 10) / 10;
}
// Catégorie indicative (non clinique) — homme/femme, tous âges confondus.
function vo2maxCategory(vo2, gender) {
  if (vo2 == null) return null;
  const isF = gender === 'Femme';
  const bounds = isF ? [28, 34, 41, 48] : [35, 42, 49, 56];
  const labels = ['Faible', 'Moyen', 'Bon', 'Très bon', 'Excellent'];
  let i = 0; while (i < bounds.length && vo2 >= bounds[i]) i++;
  return labels[i];
}

// Pw:Hr (vélo) et Pa:Hr (course) — découplage aérobie sur les streams
// Calcul sur 1ère vs 2ème moitié (méthode TrainingPeaks)
// Pw:Hr = (EF_2nde / EF_1ère - 1) × 100  en %
function calcDecoupling(sport, powOrVelArr, hrArr) {
  if (!hrArr || hrArr.length < 60) return null;
  const metric = powOrVelArr;
  if (!metric || metric.length < 60) return null;
  const n = metric.length;

  // Lissage 10s sur les deux séries pour éliminer arrêts/GPS dropouts
  const smooth = (arr, win) => {
    const out = new Float32Array(arr.length);
    let sum = 0;
    for (let i = 0; i < win && i < arr.length; i++) sum += arr[i];
    for (let i = 0; i < arr.length; i++) {
      out[i] = sum / Math.min(win, arr.length);
      if (i + 1 < arr.length) {
        sum += arr[i + 1];
        if (i - win + 1 >= 0) sum -= arr[i - win + 1];
      }
    }
    return out;
  };
  const WIN = 10;
  const smoothM  = smooth(metric, WIN);
  const smoothHr = smooth(hrArr,  WIN);

  const mid = Math.floor(n / 2);

  // Calculer EF sur chaque moitié (sur données lissées)
  const efHalf = (from, to) => {
    let sumM = 0, sumHr = 0, cnt = 0;
    for (let i = from; i < to; i++) {
      const v = smoothM[i], hr = smoothHr[i];
      if (!v || !hr || hr < 50) continue;
      if (sport !== 'Vélo' && (v < 0.5 || v > 8.33)) continue; // filtre pauses (< ~2 km/h)
      sumM += sport === 'Vélo' ? v : v * 60; // W ou m/min
      sumHr += hr;
      cnt++;
    }
    if (!cnt || sumHr / cnt < 50) return null;
    return (sumM / cnt) / (sumHr / cnt);
  };

  const ef1 = efHalf(0, mid);
  const ef2 = efHalf(mid, n);
  if (!ef1 || !ef2 || ef1 === 0) return null;
  return Math.round((ef2 / ef1 - 1) * 10000) / 100; // en %
}


function bikeActsEstimatedPower(acts, totalMassKg) {
  const rides = acts.filter(a => a.sport === 'Vélo' && a.dist && a.time);
  if (!rides.length || !totalMassKg) return null;
  const pList = rides.map(a => {
    const v = a.dist / (a.time / 60);
    const slope = a.elev && a.dist ? (a.elev / (a.dist * 1000)) * 100 : 0;
    return estimatePower(v, slope, totalMassKg);
  }).filter(v => v !== null);
  if (!pList.length) return null;
  return Math.round(pList.reduce((s, v) => s + v, 0) / pList.length);
}

// ── Calculateur de temps projeté ────────────────────────────────────────────
// %FCR (fréquence cardiaque de réserve) qu'un coureur entraîné peut tenir selon
// la durée de l'effort. %FCR ≈ %VO2R ≈ %vitesse en aérobie, d'où le modèle.
function targetHRRforDuration(min) {

function projectRaceTime(activities, raceType, raceDist, raceElev, raceElevNeg, profile) {
  const runSports = ['Course', 'Trail'];
  const bikeSports = ['Vélo'];
  const swimSports = ['Natation'];

  let refSport = runSports;
  if (raceType === 'Cyclosportive' || raceType === 'Contre-la-montre vélo') refSport = bikeSports;
  if (raceType === 'Natation eau libre') refSport = swimSports;

  const candidates = activities.filter(a =>
    refSport.includes(a.sport) && a.dist >= 1 && a.time > 0 && a.pace

  if (!candidates.length || !raceDist) return null;

  const raceElevFactor = raceElev && raceDist ? 1 + (raceElev / (raceDist * 1000)) * 4.5 : 1;
  const raceElevNegFactor = raceElevNeg && raceDist ? Math.max(0.85, 1 - (raceElevNeg / (raceDist * 1000)) * 1.5) : 1;
  const raceEqDist = raceDist * raceElevFactor * raceElevNegFactor;

  // ── Modèle FC de réserve (course uniquement, profil FC renseigné) ──────────
  const fcMax  = Number(profile && profile.fcMax)  || null;
  const fcRest = Number(profile && profile.fcRest) || null;
  if (refSport === runSports && fcMax && fcRest && fcMax > fcRest + 20) {
    const elevF = a => (a.elev && a.dist ? 1 + (a.elev / (a.dist * 1000)) * 4.5 : 1);
    const nowMs = Date.now();
    const raceElevPerKm = raceElev / Math.max(raceDist, 1);
    const scored = candidates
      .filter(a => a.hr && a.hr > fcRest + 5 && a.hr < fcMax + 5 && a.dist >= Math.min(raceDist * 0.35, 8))
      .map(a => {
        const hrr = (a.hr - fcRest) / (fcMax - fcRest);
        const vFlat = 1 / (a.pace / elevF(a));                       // km/min à plat
        const distSim = Math.exp(-Math.pow(Math.log(a.dist / raceDist), 2) / (2 * 0.45 * 0.45));
        const elevSim = Math.exp(-Math.pow((a.elev / Math.max(a.dist, 1) - raceElevPerKm) / 15, 2));
        const rec = Math.exp(-((nowMs - a.date.getTime()) / 86400000) / 150);
        const w = distSim * (0.4 + 0.6 * elevSim) * (0.25 + 0.75 * rec);
        return { a, hrr, vFlat, w };
      })
      .filter(s => s.hrr > 0.45 && s.hrr < 1.1 && isFinite(s.vFlat) && s.vFlat > 0 && s.w > 0.02);

    if (scored.length >= 2) {

      const vRef = scored.reduce((s, x) => s + x.w * x.vFlat, 0) / sw;   // vitesse plate moyenne pondérée
      const hrrRef = scored.reduce((s, x) => s + x.w * x.hrr, 0) / sw;   // %FCR moyen pondéré

      let tHRR = 0;
      for (let it = 0; it < 6; it++) {
        tHRR = targetHRRforDuration(durMin);
        const ratio = Math.min(tHRR / hrrRef, 1.4);                     // garde-fou physiologique
        const vRace = vRef * ratio;
        if (!(vRace > 0)) { durMin = 0; break; }
        durMin = raceEqDist / vRace;
      }
      if (durMin > 0 && isFinite(durMin)) {
        const ref = scored.reduce((p, c) => (c.w > p.w ? c : p), scored[0]).a;
        return {
          minutes: Math.round(durMin),
          method: 'hrr',
          targetHRR: Math.round(tHRR * 100),
          refHRR: Math.round(hrrRef * 100),
          nRef: scored.length,
          refId: ref.id,
          refName: ref.name || ref.sport,
          refDist: ref.dist,
          refPace: ref.pace,
          refDate: ref.date,
        };
      }
    }
  }

  // ── Repli : Riegel + Minetti sur la sortie la plus performante ────────────
  const minDist = Math.min(raceDist * 0.6, 10);
  const usable = candidates.filter(a => a.dist >= minDist);
  const pool = usable.length ? usable : candidates;

  function bestAvgWindow(arr, dur) {
    if (!arr || arr.length < dur) return null;
    let sum = 0;
    for (let i = 0; i < dur; i++) sum += arr[i];
    let best = sum;
    for (let i = dur; i < arr.length; i++) {
      sum += arr[i] - arr[i - dur];
      if (sum > best) best = sum;
    }
    return Math.round(best / dur);
  }

  function powerCurveByDate(d0, d1) {
    const start = new Date(d0).getTime(), end = new Date(d1).getTime() + 86400000;

    return POWER_DURATIONS.map(({ s: dur }) => {
      let bestW = null, bestId = null;
      for (const a of rides) {
        const s = actStreams[a.id];
        if (s && s.pow && s.pow.length >= dur) {
          const v = bestAvgWindow(s.pow, dur);
          if (v !== null && (bestW === null || v > bestW)) { bestW = v; bestId = a.id; }
        }
      }
      return bestW !== null ? { w: bestW, j: Math.round(bestW * dur), srcId: bestId } : null;
    });

  const MAX_PACE = 30;

  function bestPaceWindow(distArr, velArr, targetDist) {
    if (!distArr || !velArr || distArr.length < 2) return null;
    const total = distArr[distArr.length - 1];
    if (total < targetDist) return null;
    let best = null; let j = 0;
    for (let i = 0; i < distArr.length; i++) {
      while (j < distArr.length - 1 && distArr[j] - distArr[i] < targetDist) j++;
      const coveredDist = distArr[j] - distArr[i];
      if (coveredDist >= targetDist) {
        const secs = j - i;
        if (secs > 0) { const t = secs * (targetDist / coveredDist); if (best === null || t < best) best = t; }
      }
    }
    if (best === null) return null;
    const pace = (best / targetDist / 60) * 1000;
    if (pace > MAX_PACE || pace <= 0) return null;
    return Math.round(pace * 100) / 100;
  }

  // Meilleure vitesse moyenne sur une distance cible (vélo) — symétrique de bestPaceWindow
  // Retourne la vitesse en km/h
  function bestSpeedWindow(distArr, targetDist) {
    if (!distArr || distArr.length < 2) return null;
    const total = distArr[distArr.length - 1];
    if (total < targetDist) return null;
    let best = null; let j = 0;
    for (let i = 0; i < distArr.length; i++) {
      while (j < distArr.length - 1 && distArr[j] - distArr[i] < targetDist) j++;
      const coveredDist = distArr[j] - distArr[i];
      if (coveredDist >= targetDist) {
        const secs = j - i;
        if (secs > 0) {
          const t = secs * (targetDist / coveredDist);
          const v = (targetDist / t) * 3.6;
          if (best === null || v > best) best = v;
        }
      }
    }
    return best !== null ? Math.round(best * 10) / 10 : null;
  }

  function paceCurveByDate(d0, d1) {
    const start = new Date(d0).getTime(), end = new Date(d1).getTime() + 86400000;
    const runs = data.filter(a => (a.sport === 'Course' || a.sport === 'Trail') && a.date.getTime() >= start && a.date.getTime() < end);
    return PACE_DISTANCES.map(({ d: km }) => {
      const targetM = km * 1000; let best = null;
      for (const a of runs) {
        const ps = actStreams[a.id];
        if (ps && ps.dist && ps.vel) {
          const v = bestPaceWindow(ps.dist, ps.vel, targetM);
          if (v !== null && v <= MAX_PACE) best = best === null ? v : Math.min(best, v);
        } else if (a.dist >= km && a.pace && a.pace <= MAX_PACE) {
          best = best === null ? a.pace : Math.min(best, a.pace);
        }
      }
      return best !== null ? Math.round(best * 100) / 100 : null;
    });

  // ── Courbe FC → performance, bpm par bpm, sur plusieurs périodes ─────────
  function hrCurvePerBpm(sp, days) {
    // Filtre les activités représentatives : streams HR chargés, >= 5 min de données HR
    const isBike = sp === 'Vélo';
    const cutoff = Date.now() - days * 86400000;
    const acts = data.filter(a => {
      if (a.sport !== sp) return false;
      if (a.date.getTime() < cutoff) return false;
      const s = actStreams[a.id];
      if (!s || s === 'error') return false;
      if (!s.hr || s.hr.length < 300) return false; // min 5 min
      if (isBike && !s.pow) return false;
      if (!isBike && !s.vel) return false;
      return true;
    });
    if (!acts.length) return null;

    // Accumulateurs bpm 40→195
    const N = 196;
    const sumV = new Float64Array(N);
    const cnt  = new Int32Array(N);

    for (const a of acts) {
      const s = actStreams[a.id];
      const metric = isBike ? s.pow : s.vel;
      for (let i = 0; i < s.hr.length; i++) {
        const bpm = Math.round(s.hr[i]);
        if (bpm < 40 || bpm >= N) continue;
        const v = metric[i];
        if (isBike) {
          if (v > 0) { sumV[bpm] += v; cnt[bpm]++; }
        } else {
          // garde-fou : 0.3 m/s (1 km/h) à 8.33 m/s (30 km/h)
          if (v >= 0.3 && v <= 8.33) { sumV[bpm] += v; cnt[bpm]++; }
        }
      }
    }

    // Convertir en allure/puissance, puis lisser ±3 bpm
    const raw = new Array(N).fill(null);
    for (let b = 40; b < N; b++) {
      if (cnt[b] < 10) continue; // moins de 10 s = pas fiable
      const avg = sumV[b] / cnt[b];
      if (isBike) {
        raw[b] = Math.round(avg);
      } else {
        const pace = avg > 0.5 ? (1000 / 60 / avg) : null;
        raw[b] = pace ? Math.round(pace * 100) / 100 : null;
      }
    }

    // Lissage ±3 bpm
    const smoothed = new Array(N).fill(null);
    const WIN = 3;
    for (let b = 40; b < N; b++) {
      let s2 = 0, c2 = 0;
      for (let k = b - WIN; k <= b + WIN; k++) {
        if (k >= 40 && k < N && raw[k] !== null) { s2 += raw[k]; c2++; }
      }
      if (c2 > 0) smoothed[b] = isBike ? Math.round(s2/c2) : Math.round(s2/c2*100)/100;
    }

    // Trouver la plage bpm utile (premier et dernier non-null)
    let lo = 40, hi = N - 1;
    while (lo < N && smoothed[lo] === null) lo++;
    while (hi > 40 && smoothed[hi] === null) hi--;

    const labels = [];
    const vals   = [];
    for (let b = lo; b <= hi; b++) {
      labels.push(String(b));
      vals.push(smoothed[b]);
    }
    return { labels, vals, lo, hi };
  }

  // ── Régression linéaire (moindres carrés) ────────────────────────────────────
  // Retourne { slope, intercept, r2 } sur les points [(x0,y0), ...]
  function linReg(points) {
    const n = points.length;
    if (n < 2) return null;
    let sx = 0, sy = 0, sxy = 0, sx2 = 0, sy2 = 0;
    for (const [x, y] of points) { sx += x; sy += y; sxy += x * y; sx2 += x * x; sy2 += y * y; }
    const denom = n * sx2 - sx * sx;
    if (Math.abs(denom) < 1e-9) return null;
    const slope = (n * sxy - sx * sy) / denom;
    const intercept = (sy - slope * sx) / n;
    const ssTot = sy2 - sy * sy / n;
    const ssRes = points.reduce((s, [x, y]) => s + Math.pow(y - (slope * x + intercept), 2), 0);
    const r2 = ssTot > 0 ? Math.max(0, 1 - ssRes / ssTot) : 0;
    return { slope, intercept, r2 };
  }

  // ── FTP estimée — modèle Puissance Critique 2 paramètres (CP model) ──────────
  // Modèle : W_lim(t) = W' + CP × t   (W_lim = puissance_max × durée = travail total)
  // Régression linéaire sur (t, W_lim) → pente = CP, ordonnée = W'
  // Durées cibles : 3 min, 5 min, 10 min, 20 min, 30 min, 60 min (si streams dispo)
  // Minimum 2 durées distinctes, durée min = 3 min pour éviter biais anaérobie
  // Fallback : meilleur effort 20 min stream × 0.95, ou vitesse moy. activité × 0.95
  const cpModel = (() => {
    // Durées cibles en secondes — on cherche best avg power sur chaque durée
    const CP_DURS = [180, 300, 600, 1200, 1800, 3600];
    const MIN_DUR = 180; // 3 min minimum pour limiter l'influence anaérobie

    // Collecter les meilleurs efforts par durée sur tout l'historique vélo
    const rides = data.filter(a => a.sport === 'Vélo');
    const bestByDur = {}; // { dur_s: best_watts }

    for (const a of rides) {
      const s = actStreams[a.id];
      if (!s || s === 'error' || !s.pow) continue;
      for (const dur of CP_DURS) {
        if (s.pow.length < dur) continue;
        const w = bestAvgWindow(s.pow, dur);
        if (w && w > 0) bestByDur[dur] = bestByDur[dur] ? Math.max(bestByDur[dur], w) : w;
      }
    }

    const points = Object.entries(bestByDur)
      .map(([t, w]) => [Number(t), w * Number(t)]) // (durée_s, W_lim = watts × s)
      .filter(([t]) => t >= MIN_DUR)
      .sort((a, b) => a[0] - b[0]);

    if (points.length >= 2) {
      const reg = linReg(points);
      if (reg && reg.slope > 50 && reg.slope < 700 && reg.intercept > 0) {
        // slope = CP en watts, intercept = W' en joules
        const cp = Math.round(reg.slope);
        const wPrime = Math.round(reg.intercept);
        const nPts = points.length;
        // Confiance : r² et nombre de points
        const conf = nPts >= 4 && reg.r2 >= 0.98 ? 'haute'
                   : nPts >= 3 && reg.r2 >= 0.95 ? 'bonne'
                   : nPts >= 2 && reg.r2 >= 0.85 ? 'faible'
                   : null;
        if (conf) return { cp, wPrime, r2: Math.round(reg.r2 * 1000) / 1000, nPts, conf, method: 'cp_model' };
      }
    }

    // Fallback 1 : meilleur effort 20 min depuis streams × 0.95
    if (bestByDur[1200]) return { cp: Math.round(bestByDur[1200] * 0.95), wPrime: null, r2: null, nPts: 1, conf: null, method: 'best20' };

    // Fallback 2 : vitesse moyenne activité (ancienne méthode, sans bonus artificiel)
    const totalMassFtp = (Number(profile.weight)||0) + (Number(profile.bikeMass)||0);
    if (totalMassFtp) {
      const candidates = data.filter(a => a.sport==='Vélo' && a.dist && a.time && a.secs >= 1200)
        .map(a => {
          const v = a.dist / (a.time / 60);
          const slope = a.elev && a.dist ? (a.elev / (a.dist * 1000)) * 100 : 0;
          return estimatePower(v, slope, totalMassFtp);
        }).filter(Boolean);
      if (candidates.length) return { cp: Math.round(Math.max(...candidates) * 0.95), wPrime: null, r2: null, nPts: 0, conf: null, method: 'avg_speed' };
    }
    return null;
  })();
  const ftpEstimated = cpModel ? cpModel.cp : null;

  // ── Allure seuil estimée — modèle Vitesse Critique 2 paramètres (CV model) ───
  // Modèle : D(t) = D' + CV × t   (symétrique du CP, avec vitesse au lieu de puissance)
  // CV = vitesse critique ≈ allure seuil, D' = réserve de distance anaérobie (m)
  // Régression linéaire sur (t_s, dist_m) → pente = CV en m/s → convertie en min/km
  // Distances cibles : 1 km, 2 km, 3 km, 5 km, 8 km, 10 km
  // Minimum 2 distances distinctes, distance min = 1 km
  const cvModel = (() => {
    const CV_DISTS = [1000, 2000, 3000, 5000, 8000, 10000]; // m
    const MIN_DIST = 1000; // 1 km minimum

    const runs = data.filter(a => (a.sport === 'Course' || a.sport === 'Trail'));
    const bestByDist = {}; // { dist_m: best_time_s (le plus court = le plus rapide) }

    for (const a of runs) {
      const s = actStreams[a.id];
      if (!s || s === 'error' || !s.dist || !s.vel) continue;
      for (const targetM of CV_DISTS) {
        const pace = bestPaceWindow(s.dist, s.vel, targetM); // min/km
        if (!pace || pace > MAX_PACE) continue;
        const timeS = pace * (targetM / 1000) * 60; // durée en secondes pour couvrir targetM
        if (!bestByDist[targetM] || timeS < bestByDist[targetM]) bestByDist[targetM] = timeS;
      }
    }

    const points = Object.entries(bestByDist)
      .map(([d, t]) => [Number(t), Number(d)]) // (temps_s, distance_m) pour régression D = CV×t + D'
      .filter(([, d]) => d >= MIN_DIST)
      .sort((a, b) => a[0] - b[0]);

    if (points.length >= 2) {
      const reg = linReg(points);
      if (reg && reg.slope > 1.5 && reg.slope < 8.0) {
        // slope = CV en m/s, intercept = D' en mètres
        const cvMs = reg.slope; // m/s
        const cvPace = 1000 / cvMs / 60; // min/km
        const dPrime = Math.round(reg.intercept); // mètres
        const nPts = points.length;
        const conf = nPts >= 4 && reg.r2 >= 0.98 ? 'haute'
                   : nPts >= 3 && reg.r2 >= 0.95 ? 'bonne'
                   : nPts >= 2 && reg.r2 >= 0.85 ? 'faible'
                   : null;
        if (conf) return { cv: Math.round(cvPace * 100) / 100, dPrime, r2: Math.round(reg.r2 * 1000) / 1000, nPts, conf, method: 'cv_model' };
      }
    }

    // Fallback : meilleure allure sur 5 km depuis streams (proxy seuil)
    if (bestByDist[5000]) {
      const pace = bestByDist[5000] / 5 / 60; // min/km
      return { cv: Math.round(pace * 0.95 * 100) / 100, dPrime: null, r2: null, nPts: 1, conf: null, method: 'best5k' };
    }

    // Fallback Riegel sur allure moyenne activité
    const fallbackRuns = runs.filter(a => a.dist && a.time && a.secs >= 1200 && a.pace);
    const candidates = fallbackRuns.map(a => {

    return { cv: Math.round(Math.min(...candidates) * 0.95 * 100) / 100, dPrime: null, r2: null, nPts: 0, conf: null, method: 'riegel' };
  })();
  const thresholdPaceEstimated = cvModel ? cvModel.cv : null;

  const smallStat={marginTop:'6px',fontSize:'14px',fontWeight:'600',color:'#605d5d',overflowWrap:'anywhere'};

  // ── PMC — Calcul CTL / ATL / TSB sur tout l'historique ──────────────────────
  // Formules EWMA identiques à intervals.icu / TrainingPeaks :
  //   CTL_j = CTL_{j-1} × e^(-1/42) + TSS_j × (1 − e^(-1/42))
  //   ATL_j = ATL_{j-1} × e^(-1/7)  + TSS_j × (1 − e^(-1/7))
  //   TSB_j = CTL_{j-1} − ATL_{j-1}   (valeurs de la veille, convention TP)
  const pmcSeries = useMemo(() => {
    if (!data.length) return [];
    const ftpV  = Number(profile.ftp)  || ftpEstimated  || null;
    const tpV   = Number(profile.thresholdPace) || thresholdPaceEstimated || null;
    const fcMax = Number(profile.fcMax) || null;
    const fcRest= Number(profile.fcRest)|| null;

    // Construire un dictionnaire TSS par jour (YYYY-MM-DD)
    const tssPerDay = {};
    for (const a of data) {
      const key = a.date.toISOString().slice(0, 10);
      const ftp = a.sport === 'Vélo' ? ftpV : (a.sport === 'Course' || a.sport === 'Trail') ? tpV : null;
      const s   = actStreams[a.id];
      const sOk = s && s !== 'error';
      const td  = calcTSS(a, sOk ? s : null, ftp, fcMax, fcRest, Number(profile.lthr)||null);
      const tss = td?.charge ?? null;
      if (tss && tss > 0) tssPerDay[key] = (tssPerDay[key] || 0) + tss;
    }

    // Trouver la plage de dates (du plus ancien jusqu'à aujourd'hui inclus)
    const sorted = data.map(a => a.date.toISOString().slice(0, 10)).sort();
    if (!sorted.length) return [];
    const startDate = new Date(sorted[0]);
    const todayKey  = new Date().toISOString().slice(0, 10);

    // Constantes de décroissance
    const kCTL = Math.exp(-1 / 42);
    const kATL = Math.exp(-1 / 7);
    const wCTL = 1 - kCTL;
    const wATL = 1 - kATL;

    let ctl = 0, atl = 0;
    const series = [];
    const cur = new Date(startDate);

    while (true) {
      const key = cur.toISOString().slice(0, 10);
      if (key > todayKey) break;
      const tss = tssPerDay[key] || 0;
      // TSB = différence entre CTL et ATL de la VEILLE (avant application du TSS du jour)
      const tsb = Math.round((ctl - atl) * 10) / 10;
      ctl = ctl * kCTL + tss * wCTL;
      atl = atl * kATL + tss * wATL;
      series.push({
        date: key,
        ctl:  Math.round(ctl * 10) / 10,
        atl:  Math.round(atl * 10) / 10,
        tsb,
        tss,
      });
      cur.setDate(cur.getDate() + 1);
    }
    return series;
  }, [data, actStreams, profile.ftp, profile.thresholdPace, profile.fcMax, profile.fcRest, profile.lthr, ftpEstimated, thresholdPaceEstimated]);

  // Stats actuelles (dernier jour de la série)
  const pmcToday = pmcSeries.length ? pmcSeries[pmcSeries.length - 1] : null;
  const pmcRampRate = pmcSeries.length >= 8
    ? Math.round((pmcToday.ctl - pmcSeries[pmcSeries.length - 8].ctl) * 10) / 10
    : null;

  // La période (boutons) se termine toujours « aujourd'hui » → les chiffres de la
  // bande du haut sont ceux du dernier jour de la série.
  const pmcRef = pmcToday;
  const pmcRefRamp = pmcRampRate;

  const fitStats = pmcToday ? [
    { label: 'Condition physique', value: String(pmcToday.ctl), valueStyle: { ...smallStat, fontSize: '26px', fontWeight: '800', letterSpacing: '-0.02em', color: '#ec3013' }, sub: 'CTL · charge chronique 42 j' },
    { label: 'Fatigue',            value: String(pmcToday.atl), valueStyle: { ...smallStat, fontSize: '26px', fontWeight: '800', letterSpacing: '-0.02em', color: '#201e1d' }, sub: 'ATL · charge aiguë 7 j' },
    { label: 'Forme',              value: (pmcToday.tsb > 0 ? '+' : '') + String(pmcToday.tsb), valueStyle: { ...smallStat, fontSize: '26px', fontWeight: '800', letterSpacing: '-0.02em', color: pmcToday.tsb >= 0 ? '#22c55e' : pmcToday.tsb >= -10 ? '#f97316' : '#ec3013' }, sub: 'TSB = CTL − ATL (J−1)' },
    { label: 'Progression sem.',   value: pmcRampRate !== null ? (pmcRampRate > 0 ? '+' : '') + String(pmcRampRate) : '—', valueStyle: { ...smallStat, fontSize: '26px', fontWeight: '800', letterSpacing: '-0.02em', color: pmcRampRate !== null && Math.abs(pmcRampRate) > 7 ? '#ec3013' : '#201e1d' }, sub: 'Ramp rate · idéal ±5 / sem.' },
  ] : ['Condition physique','Fatigue','Forme','Progression sem.'].map(l => ({ label: l, value: 'Donnée manquante', valueStyle: smallStat, sub: '' }));

  useEffect(() => {
    if (tab!=='athlete'||athleteSection!=='Condition physique') return;
    chartDefaults();

    const winEnd = Date.now();
    const winStart = winEnd - fitRange * 86400000;
    const showFuture = true; // la période se termine toujours aujourd'hui
    // Générer les 7 jours futurs (TSS=0, CTL/ATL continuent de décroître)
    const lastPmc = pmcSeries.length ? pmcSeries[pmcSeries.length-1] : null;
    const kCTLf = Math.exp(-1/42), kATLf = Math.exp(-1/7);
    const futurePts = lastPmc ? Array.from({length:7},(_,j)=>{
      const d = new Date(); d.setDate(d.getDate()+j+1);
      const prev = j===0 ? lastPmc : null; // on recalcule au fil
      return { date: d.toISOString().slice(0,10), _future: true };
    }).reduce((acc, pt, j) => {
      const prev = j===0 ? lastPmc : acc[j-1];
      const ctl = prev.ctl * kCTLf;
      const atl = prev.atl * kATLf;
      const tsb = Math.round((prev.ctl - prev.atl)*10)/10;
      acc.push({...pt, ctl:Math.round(ctl*10)/10, atl:Math.round(atl*10)/10, tsb, tss:0});
      return acc;
    }, []) : [];
    const pastPts = pmcSeries.filter(p => {
      const t = new Date(p.date + 'T00:00:00').getTime();
      return t >= winStart && t < winEnd;
    });
    const visible = [...pastPts, ...(showFuture ? futurePts : [])];
    const step = Math.max(1, Math.ceil(visible.length / 600));
    // On garde toujours : le 1er point, le dernier, et le point d'aujourd'hui
    // (dernier point réel, à la frontière avec la projection).
    const todayIdxRaw = pastPts.length - 1;
    const thin = visible.filter((_, i) => i % step === 0 || i === visible.length - 1 || i === todayIdxRaw);
    const labels  = thin.map(p => p.date);
    const ctlData = thin.map(p => p.ctl);
    const atlData = thin.map(p => p.atl);
    const tsbData = thin.map(p => p.tsb);

    // Echelles Y fixes sur toute la carriere (independant de la fenêtre affichée)
    const allCTL = pmcSeries.map(p => p.ctl);
    const allATL = pmcSeries.map(p => p.atl);
    const allTSB = pmcSeries.map(p => p.tsb);
    const yMax1  = Math.ceil(Math.max(10, ...allCTL, ...allATL) / 10) * 10 + 10;
    // Echelle TSB sur les valeurs extremes reelles de toute la carriere
    const rawTsbMin = Math.min(...allTSB);
    const rawTsbMax = Math.max(...allTSB);
    const tsbPad = Math.max(5, Math.ceil(Math.abs(rawTsbMax - rawTsbMin) * 0.08));
    // On garde toujours de la marge au-delà de ±20 pour voir les zones
    // Transition (> +20) et Surentraînement (< -30).
    const tsbMin = Math.min(-35, Math.floor((rawTsbMin - tsbPad) / 5) * 5);
    const tsbMax = Math.max( 30, Math.ceil( (rawTsbMax + tsbPad) / 5) * 5);

    // Zones TSB (forme) — fond translucide + couleur pleine pour le trait
    const TSB_ZONES = [
      { min: 20,        max: Infinity, bg:'rgba(234,179,8,0.18)',  line:'#ca8a04', label:'Transition' },
      { min: 5,         max: 20,       bg:'rgba(59,130,246,0.18)', line:'#3b82f6', label:'Frais' },
      { min: -10,       max: 5,        bg:'rgba(150,145,145,0.16)',line:'#969191', label:'Zone grise' },
      { min: -30,       max: -10,      bg:'rgba(34,197,94,0.18)',  line:'#22c55e', label:'Optimal' },
      { min: -Infinity, max: -30,      bg:'rgba(236,48,19,0.18)',  line:'#ec3013', label:'Surentraînement' },
    ];
    const tsbZoneLine = v => {
      for (const z of TSB_ZONES) if (v >= z.min && v < z.max) return z.line;
      return '#969191';
    };

    // Activites par date — cercles vides en HAUT du graphique 1
    const actByDate = {};
    for (const a of data) {
      const key = a.date.toISOString().slice(0,10);
      if (!actByDate[key]) actByDate[key] = [];
      actByDate[key].push(a);
    }
    const actAtIdx = thin.map(p => actByDate[p.date] || null);

    // Plugin : dessine les cercles d'activite en haut du graphique (pas sur la courbe)
    const actPlugin = {
      id: 'activityDots',
      afterDatasetsDraw(chart) {
        const { ctx, chartArea } = chart;
        if (!chartArea) return;
        ctx.save();
        const R = 3.5;
        const Y = chartArea.top + 7; // rangee fixe en haut
        for (let i = 0; i < thin.length; i++) {
          if (!actAtIdx[i]) continue;
          const meta = chart.getDatasetMeta(1); // dataset CTL
          const pt   = meta.data[i];
          if (!pt) continue;
          ctx.beginPath();
          ctx.arc(pt.x, Y, R, 0, Math.PI * 2);
          ctx.strokeStyle = '#ec3013';
          ctx.lineWidth   = 1.5;
          ctx.fillStyle   = 'transparent';
          ctx.fill();
          ctx.stroke();
        }
        ctx.restore();
      }
    };

    // Plugin zones de fond TSB
    const zonePlugin = {
      id: 'tsbZones',
      beforeDatasetsDraw(chart) {
        const { ctx, chartArea, scales } = chart;
        if (!chartArea || !scales.y) return;
        ctx.save();
        ctx.beginPath(); ctx.rect(chartArea.left, chartArea.top, chartArea.width, chartArea.height); ctx.clip();
        for (const z of TSB_ZONES) {
          const zt = z.max === Infinity ? tsbMax : z.max;
          const zb = z.min === -Infinity ? tsbMin : z.min;
          const yT = Math.max(chartArea.top,    scales.y.getPixelForValue(zt));
          const yB = Math.min(chartArea.bottom, scales.y.getPixelForValue(zb));
          if (yB <= yT) continue;
          ctx.fillStyle = z.bg;
          ctx.fillRect(chartArea.left, yT, chartArea.width, yB - yT);
        }
        // Traits de démarcation aux frontières (pas à 0)
        for (const boundary of [20, 5, -10, -30]) {
          const py = scales.y.getPixelForValue(boundary);
          if (py < chartArea.top || py > chartArea.bottom) continue;
          ctx.beginPath(); ctx.moveTo(chartArea.left, py); ctx.lineTo(chartArea.right, py);
          ctx.strokeStyle = 'rgba(32,30,29,0.22)'; ctx.lineWidth = 1; ctx.setLineDash([3,4]); ctx.stroke(); ctx.setLineDash([]);
        }
        ctx.restore();
      }
    };

    // Plugin segments colorés TSB — courbe LISSÉE (Catmull-Rom) où chaque petit
    // tronçon échantillonné prend la couleur de sa zone (proche de la valeur
    // réelle interpolée à cet endroit de la courbe).
    const catmullRom = (p0, p1, p2, p3, t) => {
      const t2 = t*t, t3 = t2*t;
      return {
        x: 0.5*((2*p1.x) + (-p0.x+p2.x)*t + (2*p0.x-5*p1.x+4*p2.x-p3.x)*t2 + (-p0.x+3*p1.x-3*p2.x+p3.x)*t3),
        y: 0.5*((2*p1.y) + (-p0.y+p2.y)*t + (2*p0.y-5*p1.y+4*p2.y-p3.y)*t2 + (-p0.y+3*p1.y-3*p2.y+p3.y)*t3),
      };
    };
    const segmentColorPlugin = {
      id: 'tsbSegmentColor',
      beforeDatasetDraw(chart, args) {
        if (args.index !== 0) return;
        const meta = chart.getDatasetMeta(0);
        if (!meta.data.length) return;
        const { ctx, chartArea } = chart;
        if (!chartArea) return;
        ctx.save();
        ctx.beginPath(); ctx.rect(chartArea.left, chartArea.top, chartArea.width, chartArea.height); ctx.clip();
        ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        const n = meta.data.length;
        const STEPS = 12;
        for (let i = 0; i < n - 1; i++) {
          const v1 = tsbData[i], v2 = tsbData[i+1];
          if (v1 == null || v2 == null) continue;
          const q0 = i > 0 ? meta.data[i-1] : meta.data[i];
          const q1 = meta.data[i];
          const q2 = meta.data[i+1];
          const q3 = i+2 < n ? meta.data[i+2] : meta.data[i+1];
          let prev = q1;
          for (let s = 1; s <= STEPS; s++) {
            const t = s / STEPS;
            const pt = catmullRom(q0, q1, q2, q3, t);
            const v = v1 + (v2 - v1) * t;
            ctx.beginPath(); ctx.moveTo(prev.x, prev.y); ctx.lineTo(pt.x, pt.y);
            ctx.strokeStyle = tsbZoneLine(v); ctx.stroke();
            prev = pt;
          }
        }
        ctx.restore();
        return false;
      }
    };

    // Position fractionnaire de l'instant présent sur l'axe (interpolée entre les
    // deux jours qui l'encadrent) — le trait tombe donc exactement sur "maintenant",
    // pas sur le point de données le plus proche.
    const _nowMs = Date.now();
    const _labelMs = thin.map(p => new Date(p.date + 'T00:00:00').getTime());
    let todayPos = null;
    for (let i = 0; i < _labelMs.length - 1; i++) {
      if (_nowMs >= _labelMs[i] && _nowMs < _labelMs[i + 1]) {
        todayPos = i + (_nowMs - _labelMs[i]) / (_labelMs[i + 1] - _labelMs[i]);
        break;
      }
    }
    // Si "maintenant" tombe hors de la fenêtre affichée (période passée), pas de trait.

    // Plugin : trait vertical fin sur l'instant présent
    const todayLinePlugin = {
      id: 'todayLine',
      afterDatasetsDraw(chart) {
        if (todayPos === null || !chart.scales.x) return;
        const sx = chart.scales.x;
        const i0 = Math.floor(todayPos), i1 = Math.min(i0 + 1, thin.length - 1);
        const x0 = sx.getPixelForValue(i0), x1 = sx.getPixelForValue(i1);
        const px = x0 + (x1 - x0) * (todayPos - i0);
        if (!isFinite(px)) return;
        const { ctx, chartArea } = chart;
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(px, chartArea.top); ctx.lineTo(px, chartArea.bottom);
        ctx.lineWidth = 1.5; ctx.strokeStyle = '#201e1d'; ctx.stroke();
        ctx.restore();
      }
    };

    // Repères de mois pour l'axe des abscisses du graphique du bas
    const pmcMonthMk = monthBoundaries(labels.map(d => new Date(d).getTime()));

    // Graphique 1 : CTL + ATL — cercles en haut via plugin, PAS d'axe X
    upsert('fitness', fitRef, {
      type:'line', plugins:[crosshairPlugin, actPlugin, todayLinePlugin],
      data:{ labels, datasets:[
        { label:'Fatigue', data: atlData, borderColor:'#bab6b6', borderWidth:1.5,
          borderDash:[4,3], backgroundColor:'transparent', fill:false,
          tension:0.3, pointRadius:0, yAxisID:'y' },
        { label:'Condition physique', data: ctlData, borderColor:'#ec3013', borderWidth:1.5,
          backgroundColor:'rgba(236,48,19,0.07)', fill:true, tension:0.3,
          pointRadius:0, yAxisID:'y' },
      ]},
      options:{
        responsive:true, maintainAspectRatio:false, animation:{duration:0},
        layout:{ padding:{ top:16, left:0, right:10 } },
        interaction:{ mode:'index', intersect:false },
        plugins:{
          legend:{ display:false },
          tooltip:{
            enabled:true, animation:false,
            callbacks:{
              title: items => items[0]?.label || '',
              label: item => {
                if (item.dataset.label.startsWith('Fatigue'))   return '  Fatigue : '+item.raw;
                if (item.dataset.label.startsWith('Condition')) return '  Condition physique : '+item.raw;
                return '';
              },
              afterBody: items => {
                const idx = items[0]?.dataIndex;
                if (idx==null) return [];
                const acts = actAtIdx[idx];
                if (!acts || !acts.length) return [];
                const ftpV = Number(profile.ftp)||ftpEstimated||null;
                const tpV  = Number(profile.thresholdPace)||thresholdPaceEstimated||null;
                return acts.flatMap(a => {
                  const s   = actStreams[a.id];
                  const sOk = s && s!=='error';
                  const td  = calcTSS(a, sOk?s:null, a.sport==='V\u00e9lo'?ftpV:tpV, Number(profile.fcMax)||null, Number(profile.fcRest)||null, Number(profile.lthr)||null);
                  const tssV = td?.charge ?? null;
                  const dist = a.dist ? fmtNum(a.dist,1)+' km' : '\u2014';
                  const time = a.time ? (Math.floor(a.time/60)+'h'+String(a.time%60).padStart(2,'0')) : '\u2014';
                  const hr   = a.avgHr ? a.avgHr+' bpm' : '\u2014';
                  return [
                    '  \u2500\u2500 '+a.name,
                    '  '+a.sport+' \u00b7 '+dist+' \u00b7 '+time+(hr!=='\u2014'?' \u00b7 '+hr:'')+(tssV?' \u00b7 '+Math.round(tssV)+' TSS':''),
                  ];
                });
              }
            },
            backgroundColor:'rgba(32,30,29,0.88)', titleColor:'#fff', bodyColor:'#d7d3d3', padding:12, cornerRadius:0,
          },
        },
        scales:{
          // Axe X entièrement masqué (display:false) sur graphique 1 — pas de hauteur
          // réservée pour l'axe, pour coller directement au graphique 2 en dessous.
          x:{ display:false },
          y:{ position:'left', min:0, max:yMax1, grid:{color:'rgba(32,30,29,0.07)',drawTicks:false}, border:{display:false},
              afterFit:s=>{ s.width=40; },
              ticks:{font:{size:10},color:'#bab6b6',maxTicksLimit:5} },
        },
      },
    });

    // Graphique 2 : TSB (forme) — bandes de zone + trait coloré + axe X (jours + mois)
    upsert('fitness2', fitRef2, {
      type:'line', plugins:[zonePlugin, segmentColorPlugin, monthMarkersPlugin, todayLinePlugin, crosshairPlugin],
      data:{ labels, datasets:[
        { label:'Forme (TSB)', data: tsbData,
          borderColor:'rgba(0,0,0,0)', borderWidth:3, backgroundColor:'transparent',
          fill:false, tension:0.3, pointRadius:0, yAxisID:'y' },
      ]},
      options:{
        responsive:true, maintainAspectRatio:false, animation:{duration:0},
        layout:{ padding:{ left:0, right:10 } },
        interaction:{ mode:'index', intersect:false },
        plugins:{
          monthMarkers:{ boundaries: pmcMonthMk },
          legend:{ display:false },
          tooltip:{
            enabled:true, animation:false,
            filter: item => item.datasetIndex===0,
            callbacks:{
              title: items => items[0]?.label||'',
              label: item => {
                const v = item.raw; const sign = v>0?'+':'';
                const zone = TSB_ZONES.find(z=>v>=z.min&&v<z.max);
                return '  Forme (TSB) : '+sign+v+' \u2014 '+(zone?.label||'');
              },
            },
            backgroundColor:'rgba(32,30,29,0.88)', titleColor:'#fff', bodyColor:'#d7d3d3', padding:12, cornerRadius:0,
          },
        },
        scales:{
          x:{ grid:{color:'rgba(32,30,29,0.10)',drawTicks:false}, border:{display:false},
              ticks:{
                maxRotation:0, font:{size:10}, color:'#bab6b6',
                autoSkip:true, autoSkipPadding:22,
                callback(val) {
                  const lbl = this.getLabelForValue(val);
                  if (!lbl) return null;
                  return new Date(lbl).getDate();
                }
              }
            },
          y:{ position:'left', min:tsbMin, max:tsbMax, grid:{display:false}, border:{display:false},
              afterFit:s=>{ s.width=40; },
              ticks:{font:{size:10},color:'#bab6b6',maxTicksLimit:5,callback:v=>(v>0?'+':'')+v} },
        },
      },
    });


    return () => { destroyChart('fitness'); destroyChart('fitness2'); };
  }, [tab, athleteSection, pmcSeries, fitRange]);

  useEffect(() => {
    if (tab!=='athlete'||athleteSection!=='Puissance') return;
    chartDefaults();
    const isVeloPow = powSport === 'Vélo';
    const isTrail   = powSport === 'Trail';
    const nowMs = Date.now();
    const d2s = t => new Date(t).toISOString().slice(0,10);

    if (isVeloPow) {
      // ── Courbe de Puissance (Vélo) ─────────────────────────────────────
      const ftpVal = Number(profile.ftp) || ftpEstimated || null;
      const hasRealPower = data.some(a => a.sport==='Vélo' && a.power);
      const hasEstPower  = data.filter(a=>a.sport==='Vélo').some(a=>actStreams[a.id] && actStreams[a.id]!=='error' && actStreams[a.id].pow);
      const estSuffix = !hasRealPower && hasEstPower ? ' (est.)' : '';
      // Le graphique de puissance démarre à 1 min
      const P0 = POWER_DURATIONS.findIndex(d => d.s >= 60);
      const PD = POWER_DURATIONS.slice(P0);
      const labels = PD.map(d => d.l);
      // Une courbe par période sélectionnée (30 j / 3 m / 6 m / 1 an)
      const jByLabel = {}, srcByLabel = {};
      let wmaxA = null;
      const datasets = [];
      powSel.forEach((p, idx) => {
        const cur = powerCurveByDate(d2s(nowMs - p.d * 86400000), d2s(nowMs)).slice(P0);
        const w = cur.map(v => v ? v.w : null);
        const src = cur.map(v => v ? v.srcId : null);
        jByLabel[p.label + estSuffix] = cur.map(v => v ? v.j : null);
        srcByLabel[p.label + estSuffix] = src;
        const wmax = w.filter(Boolean).length ? Math.max(...w.filter(Boolean)) : null;
        if (wmax && (wmaxA === null || wmax > wmaxA)) wmaxA = wmax;
        // Repère : point visible uniquement là où l'activité à l'origine du meilleur effort change
        const ptR = src.map((id, i) => (id != null && i > 0 && src[i-1] != null && id !== src[i-1]) ? 2.5 : 0);
        datasets.push({ label: p.label + estSuffix, data: w, borderColor: p.color,
          borderWidth: idx === 0 ? 2.5 : 2, backgroundColor: 'transparent', fill: false, tension: 0.2,
          pointRadius: ptR, pointHoverRadius: ptR, pointBackgroundColor: p.color, pointBorderColor: '#201e1d', pointBorderWidth: 1,
          spanGaps: true, yAxisID: 'yW' });
      });
      if (ftpVal) datasets.push({ label:'FTP · '+ftpVal+' W', data:labels.map(()=>ftpVal), borderColor:'#201e1d', borderWidth:1.5, borderDash:[2,4], backgroundColor:'transparent', fill:false, tension:0, pointRadius:0, yAxisID:'yW' });
      if (showCurveSel) {
        [[selActId1,'#7c4dbc','Séance 1'],[selActId2,'#2196f3','Séance 2']].forEach(([sid,col,defLbl]) => {
          if (!sid) return;
          const s = actStreams[sid];
          if (s && s.pow && s.pow.length) {
            const act = data.find(a => String(a.id) === String(sid));
            const lbl = act ? act.date.toLocaleDateString('fr-FR',{day:'2-digit',month:'short'})+' '+fmtNum(act.dist,1)+'km' : defLbl;
            const actPowCurve = PD.map(({s:dur}) => bestAvgWindow(s.pow, dur));
            datasets.push({ label:lbl, data:actPowCurve, borderColor:col, borderWidth:1.5, borderDash:[], backgroundColor:'transparent', fill:false, tension:0.2, pointRadius:0, pointBackgroundColor:col, pointBorderColor:'#f3f2f2', pointBorderWidth:1, spanGaps:true, yAxisID:'yW' });
          }
        });
      }
      upsert('power', powerRef, {
        type:'line', plugins:[crosshairPlugin, clickAuraPlugin],
        data:{ labels, datasets },
        options:{ responsive:true, maintainAspectRatio:false, animation:{duration:240},
          interaction:{mode:'index',intersect:false,axis:'x'}, hover:{animationDuration:0},
          onHover:(e,els,chart)=>{ chart.canvas.style.cursor = els.length ? 'pointer' : 'default'; },
          onClick:(e,els,chart)=>{
            if (!els.length) return;
            const cy = e && e.y;
            let bestId = null, bestDy = Infinity;
            els.forEach(el => {
              const arr = srcByLabel[chart.data.datasets[el.datasetIndex].label];
              const id = arr && arr[el.index];
              if (id == null) return;
              const dy = (cy != null && el.element) ? Math.abs(el.element.y - cy) : 0;
              if (dy < bestDy) { bestDy = dy; bestId = id; }
            });
            if (bestId) { setSelActId1(String(bestId)); setShowCurveSel(true); }
          },
          plugins:{
            clickAura:{ srcByLabel },
            legend:{display:true,position:'top',align:'end',labels:{boxWidth:24,boxHeight:3,padding:20,usePointStyle:true,font:{size:13,weight:'600'}}},
            tooltip:{enabled:true,animation:false,backgroundColor:'rgba(32,30,29,0.88)',cornerRadius:0,padding:12,displayColors:true,
              filter: item => !item.dataset.label.startsWith('FTP'),
              callbacks:{

        title:'Semaine '+wkNum,span,tag:isCurrent?'En cours':isFuture?'À venir':'',
