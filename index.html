        blockNote:isFuture?(pAgg.n+' séance'+(pAgg.n>1?'s':'')+' prévue'+(pAgg.n>1?'s':'')):(cur.n+' séance'+(cur.n>1?'s':'')),
        stats:isFuture
          ? [futStat('Temps',pAgg.min?fmtH(pAgg.min):''),futStat('Distance',pAgg.km?fmtNum(Math.round(pAgg.km),0)+' km':''),futStat('Séances',String(pAgg.n)),futStat('D+','—')]
          : (isCurrent&&coachPlan)
            ? (()=>{ const pa=plannedAgg(s); const tg=coachPlan&&coachPlan.targets||{};
                const tKm=tg.kmSemaine!=null?tg.kmSemaine:(pa.km||null), tMin=tg.heuresSemaine!=null?Math.round(tg.heuresSemaine*60):(pa.min||null), tN=tg.nbSeances!=null?tg.nbSeances:(pa.n||null);
                return [
                  tgtStat('Temps',cur.min?fmtH(cur.min):'0',tMin?fmtH(tMin):null),
                  tgtStat('Distance',cur.km?fmtNum(Math.round(cur.km),0)+' km':'0 km',tKm?fmtNum(Math.round(tKm),0)+' km':null),
                  tgtStat('D+',cur.elev?'+'+fmtNum(Math.round(cur.elev),0)+' m':'0 m',null),
                  tgtStat('Séances',String(cur.n),tN!=null?String(tN):null),
                ]; })()
            : [mkStat('Temps',cur.min?fmtH(cur.min):'',pct(cur.min,prev.min),prev.min?fmtH(prev.min):'0'),mkStat('Distance',cur.km?fmtNum(Math.round(cur.km),0)+' km':'',pct(cur.km,prev.km),prev.km?fmtNum(Math.round(prev.km),0)+' km':'0'),mkStat('D+',cur.elev?'+'+fmtNum(Math.round(cur.elev),0)+' m':'',pct(cur.elev,prev.elev),prev.elev?'+'+fmtNum(Math.round(prev.elev),0)+' m':'0'),mkStat('Séances',String(cur.n),pct(cur.n,prev.n),String(prev.n))],
        days:daysList,
      };
    }).reverse();
  }

  const sportCounts={};
  data.forEach(a=>{sportCounts[a.sport]=(sportCounts[a.sport]||0)+a.time;});
  const sortedSports=Object.keys(sportCounts).sort((a,b)=>sportCounts[b]-sportCounts[a]);
  const topSports=sortedSports.slice(0,3); const otherSports=sortedSports.slice(3);

  function SportSelector() {
    const btnBase={padding:'9px 14px',border:'2px solid #201e1d',fontFamily:'inherit',fontSize:'12px',fontWeight:'600',letterSpacing:'0.08em',textTransform:'uppercase',textAlign:'left',cursor:'pointer'};
    const activeSt={...btnBase,background:'#ec3013',borderColor:'#ec3013',color:'#ffffff'};
    const inactiveSt={...btnBase,background:'transparent',color:'#201e1d'};
    return h('div',{style:{display:'flex',flexWrap:'wrap',gap:'8px',position:'relative',alignItems:'flex-start'}},
      h('button',{type:'button',onClick:()=>{setSport('Tous');setDropdownOpen(false);},style:sport==='Tous'?activeSt:inactiveSt,onMouseEnter:e=>{if(sport!=='Tous')e.currentTarget.style.background='#ffe0d9';},onMouseLeave:e=>{if(sport!=='Tous')e.currentTarget.style.background='transparent';}},'Tous'),
      topSports.map(sp=>h('button',{key:sp,type:'button',onClick:()=>{setSport(sp);setDropdownOpen(false);},style:sport===sp?activeSt:inactiveSt,onMouseEnter:e=>{if(sport!==sp)e.currentTarget.style.background='#ffe0d9';},onMouseLeave:e=>{if(sport!==sp)e.currentTarget.style.background='transparent';}},sp)),
      otherSports.length>0&&h('div',{style:{position:'relative'}},
        h('button',{type:'button',onClick:()=>setDropdownOpen(o=>!o),style:otherSports.includes(sport)?activeSt:inactiveSt,onMouseEnter:e=>{if(!otherSports.includes(sport))e.currentTarget.style.background='#ffe0d9';},onMouseLeave:e=>{if(!otherSports.includes(sport))e.currentTarget.style.background='transparent';}},otherSports.includes(sport)?sport:'Autre \u25be'),
        dropdownOpen&&h('div',{style:{position:'absolute',top:'calc(100% + 4px)',left:0,zIndex:100,display:'flex',flexDirection:'column',border:'2px solid #201e1d',background:'#f3f2f2',minWidth:'140px'}},
          otherSports.map(sp=>h('button',{key:sp,type:'button',onClick:()=>{setSport(sp);setDropdownOpen(false);},style:{padding:'10px 14px',border:'0',borderBottom:'1px solid #d7d3d3',background:sport===sp?'#ec3013':'transparent',color:sport===sp?'#ffffff':'#201e1d',fontFamily:'inherit',fontSize:'12px',fontWeight:'600',letterSpacing:'0.08em',textTransform:'uppercase',textAlign:'left',cursor:'pointer'},onMouseEnter:e=>{if(sport!==sp)e.currentTarget.style.background='#ffe0d9';},onMouseLeave:e=>{if(sport!==sp)e.currentTarget.style.background=sport===sp?'#ec3013':'transparent';}},sp))
        )
      )
    );
  }

  const mkOptions=(list,current,setter)=>list.map(o=>({label:o.label,active:current===o.value,onClick:()=>setter(o.value)}));
  const now=Date.now();
  const cur90=data.filter(a=>a.date.getTime()>=now-90*86400000);
  const prev90=data.filter(a=>a.date.getTime()>=now-455*86400000&&a.date.getTime()<now-365*86400000);
  const raceDateObj=race.date?new Date(race.date+'T12:00:00'):null;
  const daysToRace=raceDateObj?Math.round((raceDateObj.getTime()-now)/86400000):null;
  const weeksLeft=Math.max(0,Math.round(((raceDateObj?raceDateObj.getTime():now)-now)/(7*86400000)));
  const plan=24; const weeksDone=Math.max(0,plan-weeksLeft);
  const load90=sum(cur90,'time')/60, loadPrev=sum(prev90,'time')/60;
  const ready=Math.max(0,Math.min(99,Math.round(52+(weeksDone/plan)*34+(loadPrev>0?Math.min(12,((load90-loadPrev)/loadPrev)*30):0))));

  const projResult = (() => {
    const spec = RACE_CATALOG[race.type];
    if (!spec || !data.length) return null;
    const f = race.values;
    const dist = f.run || f.bike || f.swim || 0;
    if (!dist) return null;
    const isTriathlon = race.type.toLowerCase().includes('triathlon') || race.type === 'Ironman' || race.type === 'Triathlon 70.3';
    if (isTriathlon) {
      const runRes  = f.run  ? projectRaceTime(data, 'Marathon', f.run,  f.runElev||0,  f.runElevNeg||0, profile)  : null;
      const bikeRes = f.bike ? projectRaceTime(data, 'Cyclosportive', f.bike, f.bikeElev||0, 0, profile) : null;
      const swimRes = f.swim ? projectRaceTime(data, 'Natation eau libre', f.swim, 0, 0, profile) : null;
      const total = (runRes?.minutes||0) + (bikeRes?.minutes||0) + (swimRes?.minutes||0);
      const transitions = 5 + (f.bike ? 3 : 0);
      if (!total) return null;
      return { minutes: total + transitions, segTotal: total, transitions, segments: { run: runRes, bike: bikeRes, swim: swimRes } };
    }
    return projectRaceTime(data, race.type, dist, f.runElev||f.bikeElev||0, f.runElevNeg||0, profile);
  })();

  function fmtProjected(min) {
    if (!min) return 'Donnée manquante';
    const h = Math.floor(min / 60); const m = Math.round(min % 60);
    return h > 0 ? h+'h'+String(m).padStart(2,'0') : m+' min';
  }
  const projDisplay = projResult ? fmtProjected(projResult.minutes) : 'Donnée manquante';
  const projRefDateStr = projResult && projResult.refDate ? projResult.refDate.toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'2-digit'}) : '';
  const projNote = projResult
    ? (projResult.segments ? 'Triathlon estimé segment par segment'
       : projResult.method === 'hrr'
         ? 'FC de réserve · ' + projResult.nRef + ' sorties similaires · cible ' + projResult.targetHRR + ' % FCR · réf ' + (projResult.refName||'sortie') + ' (' + projResult.refHRR + ' % FCR' + (projRefDateStr ? ', ' + projRefDateStr : '') + ')'
         : 'Riegel · d\'après ' + (projResult.refName||'sortie') + ' · ' + fmtNum(projResult.refDist,1) + ' km · ' + fmtPace(projResult.refPace) + '/km' + (projRefDateStr ? ' · ' + projRefDateStr : ''))
    : (data.length ? 'Pas assez de données' : 'à calculer');
  const projMethodLabel = projResult ? (projResult.method === 'hrr' ? 'FC de réserve' : 'Riegel + Minetti') : '—';
  const projRefClick = projResult && projResult.refId != null ? () => openActivity(projResult.refId) : null;

  // ── Coach : état ────────────────────────────────────────────────────────────
  const COACH_LIMIT = 100;
  const [coachBusy, setCoachBusy] = useState(false);
  const [coachPhase, setCoachPhase] = useState(0); // 0 idle · 1 analyse · 2 création du programme
  const [coachErr, setCoachErr] = useState('');
  const [coachQuota, setCoachQuota] = useState(null);
  const [coachPlan, setCoachPlan] = useState(() => {
    try { const s = localStorage.getItem('bs_coach_plan'); if (s) return JSON.parse(s); } catch (e) {}
    return null;
  });
  // Analyses coach par activité, indexées par id d'activité.
  const [coachActAnalyses, setCoachActAnalyses] = useState(() => {
    try { const s = localStorage.getItem('bs_coach_actan'); if (s) return JSON.parse(s); } catch (e) {}
    return {};
  });
  useEffect(() => { try { localStorage.setItem('bs_coach_actan', JSON.stringify(coachActAnalyses)); } catch (e) {} }, [coachActAnalyses]);
  const [coachOpenSess, setCoachOpenSess] = useState(null); // clé de la séance projetée dépliée
  const coachAutoRef = useRef(false);
  useEffect(() => { try { localStorage.removeItem('bs_coach_chat'); localStorage.removeItem('bs_coach_avail'); localStorage.removeItem('bs_coach_lastseance'); } catch (e) {} }, []);
  useEffect(() => { try { localStorage.setItem('bs_coach_plan', coachPlan ? JSON.stringify(coachPlan) : ''); } catch (e) {} }, [coachPlan]);

  function coachProfileId() {
    try {
      const aid = localStorage.getItem('bs_athlete_id');
      if (aid) return 'a' + aid;
      let x = localStorage.getItem('bs_coach_id');
      if (!x) { x = 'c' + Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem('bs_coach_id', x); }
      return x;
    } catch (e) { return 'anon'; }
  }
  function coachLocalQuota() {
    const today = isoLocal(new Date());
    let q = {};
    try { q = JSON.parse(localStorage.getItem('bs_coach_lq') || '{}'); } catch (e) {}
    if (q.date !== today) q = { date: today, count: 0 };
    return q;
  }
  const coachLeft = coachQuota
    ? Math.max(0, coachQuota.limit - coachQuota.used)
    : Math.max(0, COACH_LIMIT - coachLocalQuota().count);

  function coachPrimarySport() {
    const rt = race.type || '';
    if (rt.indexOf('Cyclo') >= 0 || rt.indexOf('montre vélo') >= 0) return 'Vélo';
    if (rt.indexOf('Natation') >= 0) return 'Natation';
    if (rt.toLowerCase().indexOf('trail') >= 0) return 'Trail';
    if (rt.indexOf('Triathlon') >= 0 || rt === 'Ironman') return 'Triathlon';
    return 'Course';
  }

  // Résumé détaillé d'une séance (W/kg, FC moy, % de temps par zone de FC, EF,
  // découplage, VO2max estimé, intervalles détectés) pour l'analyse par le coach.
  function summarizeSession(act) {
    const s = actStreams[act.id];
    const sok = s && s !== 'error';
    const isBike = act.sport === 'Vélo';
    const fcMax = Number(profile.fcMax) || null;
    const fcRest = Number(profile.fcRest) || null;
    const weight = Number(profile.weight) || null;
    const hrArr = sok ? s.hr : null;
    const out = {
      date: isoLocal(act.date), sport: act.sport, nom: act.name || null,
      km: Math.round(act.dist * 10) / 10, dureeMin: act.time, dplus: act.elev,
      fcMoy: hrArr && hrArr.length ? Math.round(avgStream(hrArr)) : (act.hr || null),
      fcMax: hrArr && hrArr.length ? Math.round(Math.max.apply(null, Array.from(hrArr))) : (act.maxHr || null),
    };
    if (hrArr && fcMax) {
      const zb = hrZoneBreakdown(hrArr, fcMax);
      if (zb.length) out.tempsParZoneFC = zb.reduce((o, z) => (o[z.label] = z.pct + ' %', o), {});
    }
    if (isBike) {
      const np = sok && s.pow ? (calcNP(s.pow) || avgStream(s.pow)) : (act.power || null);
      const avgP = sok && s.pow ? avgStream(s.pow) : (act.power || null);
      if (avgP) { out.wMoy = Math.round(avgP); if (weight) out.wkgMoy = Math.round((avgP / weight) * 100) / 100; }
      if (np) { out.np = Math.round(np); if (weight) out.wkgNP = Math.round((np / weight) * 100) / 100; }
      out.facteurEfficaciteWparBpm = actEF('Vélo', sok ? s : null);
      out.decouplagePwHrPct = sok && s.pow && s.hr ? calcDecoupling('Vélo', s.pow, s.hr) : null;
    } else {
      out.allureMoyMinKm = act.pace ? Math.round(act.pace * 100) / 100 : null;
      if (act.cadence) out.pasParMinute = Math.round(act.cadence * 2);
      out.facteurEfficaciteMparMinParBpm = actEF('Course', sok ? s : null);
      out.decouplagePaHrPct = sok && s.vel && s.hr ? calcDecoupling('Course', s.vel, s.hr) : null;
      if (fcMax && fcRest) { const v = estimateVo2maxFromRun(act, fcMax, fcRest); if (v) out.vo2maxEstime = v; }
    }
    const det = detectEfforts(act.sport, sok ? s : null);
    if (det.groups.length) {
      out.intervallesDetectes = det.groups.map(g => {
        if (isBike) return { repetitions: g.n, dureeMin: g.durMin, wMoy: Math.round(g.value), wkg: weight ? Math.round((g.value / weight) * 100) / 100 : null, fcMoy: g.hr };
        const paceMinKm = (1000 / g.value) / 60;
        return { repetitions: g.n, dureeMin: g.durMin, allureMinKm: Math.round(paceMinKm * 100) / 100, fcMoy: g.hr };
      });
    } else if (det.efforts.length) {
      out.intervallesDetectes = 'blocs irréguliers (' + det.efforts.length + ')';
    }
    return out;
  }

  function buildCoachContext() {
    const last = pmcToday;
    const ramp = pmcSeries.length >= 8 ? Math.round((last.ctl - pmcSeries[pmcSeries.length - 8].ctl) * 10) / 10 : null;
    const nowMs = Date.now();
    const wsMs = weekStart(new Date()).getTime();
    const win = data.filter(a => nowMs - a.date.getTime() < 28 * 86400000 && !a.planned);
    const rec = win.sort((a, b) => b.date - a.date).slice(0, 18)
      .map(a => ({ date: isoLocal(a.date), sport: a.sport, km: Math.round(a.dist * 10) / 10, min: a.time, dplus: a.elev, fcMoy: a.hr || null }));
    const doneThisWeek = data
      .filter(a => !a.planned && a.date.getTime() >= wsMs && a.date.getTime() <= nowMs)
      .sort((a, b) => a.date - b.date)
      .map(a => summarizeSession(a));
    // Comparaison volume / charge : semaine en cours (à date) vs 4 semaines précédentes.
    const weekAgg = (t0, t1) => {
      const list = data.filter(a => !a.planned && a.date.getTime() >= t0 && a.date.getTime() < t1);
      const tss = pmcSeries.filter(p => { const t = new Date(p.date + 'T12:00:00').getTime(); return t >= t0 && t < t1; }).reduce((s, p) => s + (p.tss || 0), 0);
      return { nbSeances: list.length, km: Math.round(list.reduce((s, a) => s + a.dist, 0) * 10) / 10, minutes: list.reduce((s, a) => s + a.time, 0), dplus: list.reduce((s, a) => s + a.elev, 0), chargeTSS: Math.round(tss) };
    };
    const semaineEnCoursADate = weekAgg(wsMs, nowMs);
    const semainePrecedente = weekAgg(wsMs - 7 * 86400000, wsMs);
    const sem2 = weekAgg(wsMs - 14 * 86400000, wsMs - 7 * 86400000);
    const sem3 = weekAgg(wsMs - 21 * 86400000, wsMs - 14 * 86400000);
    const chargeMoy3SemPrecedentes = Math.round((semainePrecedente.chargeTSS + sem2.chargeTSS + sem3.chargeTSS) / 3);
    const zones = {};
    if (profile.thresholdPace) zones.allureSeuilMinKm = Number(profile.thresholdPace);
    if (profile.fcMax) zones.fcMax = Number(profile.fcMax);
    if (profile.fcRest) zones.fcRepos = Number(profile.fcRest);
    if (profile.lthr) zones.lthr = Number(profile.lthr);
    if (profile.ftp) zones.ftpVelo = Number(profile.ftp);
    return {
      date: isoLocal(new Date()),
      jourSemaineActuel: ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'][new Date().getDay()],
      semaineDebut: isoLocal(new Date(wsMs)),
      semaineSuivanteDebut: isoLocal(new Date(wsMs + 7 * 86400000)),
      objectif: {
        type: race.type, date: race.date || null,
        semainesRestantes: race.date ? weeksLeft : null,
        tempsProjeteMin: projResult ? projResult.minutes : null,
        methodeProjection: projResult ? projResult.method : null,
      },
      forme: last ? { ctl: last.ctl, atl: last.atl, tsb: last.tsb, rampeCtl7j: ramp } : null,
      chargeMoyenneSeancesParSemaine: Math.round((win.length / 4) * 10) / 10,
      volumeMoyenMinParSemaine: Math.round(win.reduce((s, a) => s + a.time, 0) / 4),
      comparaisonSemaines: {
        semaineEnCoursADate,
        semainePrecedente,
        chargeMoy3SemPrecedentes,
      },
      sportPrincipal: coachPrimarySport(),
      zones,
      seancesDejaRealiseesCetteSemaine: doneThisWeek,
      programmeActuel: coachPlan ? coachPlan.sessions : null,
      sortiesRecentes: rec,
    };
  }

  async function coachFullAnalysis() {
    if (coachBusy) return;
    if (coachLeft <= 0) { setCoachErr('Limite quotidienne atteinte (' + COACH_LIMIT + ' analyses par jour).'); return; }
    if (!data.length) { setCoachErr('Importe d\'abord tes activités Strava.'); return; }
    setCoachErr('');
    setCoachBusy(true);
    setCoachPhase(1);
    const toProg = setTimeout(() => setCoachPhase(2), 6000);
    try { const q = coachLocalQuota(); q.count++; localStorage.setItem('bs_coach_lq', JSON.stringify(q)); } catch (e) {}
    try {
      const r = await fetch('/api/coach', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          profileId: coachProfileId(),
          messages: [{ role: 'user', content: 'Analyse mon profil et crée le programme des DEUX prochaines semaines (semaine en cours + semaine suivante). Adapte les séances à venir de la semaine en cours en fonction de "seancesDejaRealiseesCetteSemaine" (garde ces séances passées telles quelles, marquées "done":true). Fournis "plan" avec "targets" et toutes les séances, chacune avec "focus" (ce qui est travaillé).' }],
          context: buildCoachContext(),
          plan: coachPlan,
        }),
      });
      const raw = await r.text();
      let j = {};
      try { j = raw ? JSON.parse(raw) : {}; } catch (e) {
        setCoachErr(r.status === 504
          ? 'Le coach a mis trop de temps à répondre (Gemini surchargé). Réessaie dans un instant.'
          : 'Réponse serveur invalide (' + r.status + ').');
        clearTimeout(toProg); setCoachPhase(0); setCoachBusy(false); return;
      }
      if (j.quota) setCoachQuota(j.quota);
      if (!r.ok) { setCoachErr(j.error || 'Erreur serveur (' + r.status + ')'); clearTimeout(toProg); setCoachPhase(0); setCoachBusy(false); return; }
      if (j.plan && Array.isArray(j.plan.sessions) && j.plan.sessions.length) {
        setCoachPlan({
          source: 'llm',
          weekStartISO: isoLocal(weekStart(new Date())),
          weekNextISO: isoLocal(new Date(weekStart(new Date()).getTime() + 7 * 86400000)),
          generatedAt: new Date().toISOString(),
          rationale: j.plan.rationale || '',
          summary: j.reply || '',
          targets: j.plan.targets || null,
          sessions: j.plan.sessions,
        });
      } else {
        setCoachErr('Le coach n\'a pas renvoyé de programme. Réessaie.');
      }
    } catch (e) {
      setCoachErr('Réseau indisponible : ' + e.message);
    }
    clearTimeout(toProg);
    setCoachPhase(0);
    setCoachBusy(false);
  }

  async function coachAnalyzeActivity(act) {
    if (!act || coachBusy) return;
    if (coachLeft <= 0) { setCoachActAnalyses(m => ({ ...m, [act.id]: { err: 'Limite quotidienne atteinte (' + COACH_LIMIT + '/jour).' } })); return; }
    setCoachActAnalyses(m => ({ ...m, [act.id]: { loading: true } }));
    setCoachBusy(true);
    try { const q = coachLocalQuota(); q.count++; localStorage.setItem('bs_coach_lq', JSON.stringify(q)); } catch (e) {}
    try {
      const r = await fetch('/api/coach', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          profileId: coachProfileId(),
          messages: [{ role: 'user', content: 'Analyse UNIQUEMENT la séance "seanceAAnalyser" du contexte : ce qui a été travaillé, la qualité de l\'exécution, la fatigue induite, ce qu\'il faut retenir. Passe en revue CHAQUE donnée présente (W/kg, FC moyenne, répartition du temps par zone de FC, facteur d\'efficacité, découplage, intervalles détectés, VO2max, pas par minute) en l\'EXPLIQUANT : jamais un chiffre nu, toujours [ce que c\'est] → [ta valeur] → [ce que ça signifie]. Ne renvoie PAS de "plan" (mets-le à null). Ignore la structure en 4 sections.' }],
          context: { ...buildCoachContext(), seanceAAnalyser: summarizeSession(act) },
          plan: null,
        }),
      });
      const raw = await r.text();
      let j = {};
      try { j = raw ? JSON.parse(raw) : {}; } catch (e) {
        setCoachActAnalyses(m => ({ ...m, [act.id]: { err: r.status === 504 ? 'Le coach a mis trop de temps à répondre. Réessaie.' : 'Réponse serveur invalide (' + r.status + ').' } }));
        setCoachBusy(false); return;
      }
      if (j.quota) setCoachQuota(j.quota);
      if (!r.ok) { setCoachActAnalyses(m => ({ ...m, [act.id]: { err: j.error || 'Erreur serveur (' + r.status + ')' } })); setCoachBusy(false); return; }
      setCoachActAnalyses(m => ({ ...m, [act.id]: { texte: j.reply || 'Analyse indisponible.', generatedAt: new Date().toISOString() } }));
    } catch (e) {
      setCoachActAnalyses(m => ({ ...m, [act.id]: { err: 'Réseau indisponible : ' + e.message } }));
    }
    setCoachBusy(false);
  }

  // Analyse + programme automatiques dès que les activités sont importées (une fois).
  useEffect(() => {
    if (coachAutoRef.current) return;
    if (!data.length || !pmcToday || coachPlan || coachBusy) return;
    if (coachLeft <= 0) return;
    coachAutoRef.current = true;
    const t = setTimeout(() => coachFullAnalysis(), 400);
    return () => clearTimeout(t);
  }, [data.length, pmcToday, coachPlan]);

  // Le calendrier montre les semaines à venir au-dessus : on cale la vue sur la
  // semaine en cours à l'ouverture de l'onglet Programme (scroll vers le haut = à venir).

    {label:'Allure moy.',unit:'/100m',get:l=>{const d=sum(l,'dist'),t=sum(l,'time');return d?t/d/10:0;}, pace:true, swimWide:false},
  ] : [
    {label:'Distance',unit:'km',get:l=>sum(l,'dist'),pace:false},
    {label:'Temps',unit:'h',get:l=>sum(l,'time')/60,pace:false},

      ? {label:'Puissance moy.',unit:'W',get:l=>{
          const totalMassKpi=(Number(profile.weight)||0)+(Number(profile.bikeMass)||0);
          if(totalMassKpi>0){ const rides=l.filter(a=>a.sport==='Vélo'&&a.dist&&a.time); const pList=rides.map(a=>{const v=a.dist/(a.time/60);const slope=a.elev&&a.dist?(a.elev/(a.dist*1000))*100:0;return estimatePower(v,slope,totalMassKpi);}).filter(v=>v!==null); return pList.length?pList.reduce((s,v)=>s+v,0)/pList.length:0; }
          const p2=l.filter(a=>a.power);return p2.length?sum(p2,'power')/p2.length:0;
        },pace:false}
      : sport==='Tous'
        ? {label:'BPM moyen',unit:'bpm',get:l=>{const h2=l.filter(a=>a.hr);return h2.length?h2.reduce((s,a)=>s+a.hr,0)/h2.length:0;},pace:false}
        : {label:'Allure moy.',unit:'/km',get:l=>{const d=sum(l,'dist'),t=sum(l,'time');return d?t/d:0;},pace:true},
  ];
  const kpis=kpiDef.map((k,i)=>{
    const nCols = kpiDef.length;
    const c=k.get(curW), pv=k.get(prevW);

    if (pv>0) {
      if (k.unit==='bpm') prevTxt=fmtNum(Math.round(pv),0);

      else prevTxt=fmtNum(Math.round(pv),0);
    }
    return{ label:k.label, unit:txt==='Donnée manquante'?'':k.unit, value:txt, delta:chip.text, deltaStyle:chip.style, arrow:chip.arrow, arrowStyle:chip.arrowStyle, prevTxt, prevUnit: pv>0 ? k.unit : '', valueStyle:{fontSize:'30px',fontWeight:'800',letterSpacing:'-0.03em',lineHeight:'0.95'}, cellStyle:{minWidth:0,padding:'24px 24px 28px',borderRight:i<nCols-1?'2px solid #201e1d':undefined}, def: k, };
  });
  const p=profile;
  const bmi=p.height>0&&p.weight>0?Math.round((p.weight/Math.pow(p.height/100,2))*10)/10:null;
  const wkg=p.weight>0&&p.ftp>0?Math.round((p.ftp/p.weight)*100)/100:null;
  const spec=RACE_CATALOG[race.type];
  const stravaStatus=status==='loading'?'Import des activités…':status==='ready'?data.length+' activités importées':status==='empty'?'Aucune activité trouvée sur ce compte.':status==='error'?'Erreur : '+error:'Non connecté — aucune donnée.';
  const stravaBtnLabel=status==='ready'?'Déconnecter':status==='loading'?'Chargement…':'Connecter Strava';
  const noData=!data.length;

  const athleteSections=['Condition physique','Puissance','Fréquence cardiaque','VO2 max','Efficacité'];

  // Graphique d'une séance projetée : abscisse = temps (min) ou distance (km),
  // ordonnée = zone d'intensité cible (1..5), tracé en marches.
  function PlannedSessionChart({ session }) {
    const cv = useRef(null);
    const inst = useRef(null);
    const steps = (session.steps || []).filter(b => b && (b.durationMin || b.distanceKm));
    const useKm = steps.length > 0 && steps.every(b => b.distanceKm != null && !b.durationMin);
    useEffect(() => {
      if (!cv.current || !steps.length) return;
      chartDefaults();
      let cum = 0;
      const pts = [];
      const segColors = [];
      steps.forEach(b => {
        const len = useKm ? b.distanceKm : b.durationMin;
        pts.push({ x: cum, y: b.zone });
        cum += len;
        pts.push({ x: cum, y: b.zone });
        segColors.push((COACH_ZONES[b.zone] || {}).color || '#605d5d');
      });
      inst.current = new Chart(cv.current, {
        type: 'line',
        data: { datasets: [{
          data: pts, borderWidth: 4, pointRadius: 0, tension: 0, borderColor: '#605d5d',
          segment: { borderColor: ctx => segColors[Math.floor(ctx.p0DataIndex / 2)] || '#605d5d' },
          fill: false,
        }] },
        options: {
          responsive: true, maintainAspectRatio: false, animation: { duration: 200 },
          plugins: { legend: { display: false },
            tooltip: { enabled: true, backgroundColor: 'rgba(32,30,29,0.9)', displayColors: false,
              callbacks: {
                title: items => { let c = 0; for (const b of steps) { const l = useKm ? b.distanceKm : b.durationMin; if (items[0].parsed.x <= c + l + 0.001) return (b.label || COACH_ZONES[b.zone].label); c += l; } return ''; },
                label: it => COACH_ZONES[Math.round(it.parsed.y)] ? COACH_ZONES[Math.round(it.parsed.y)].label : '',
              } } },
          scales: {
            x: { type: 'linear', min: 0, grid: { display: false }, title: { display: true, text: useKm ? 'Distance (km)' : 'Durée (min)', color: '#605d5d' } },
            y: { min: 0.5, max: 5.5, grid: { color: 'rgba(32,30,29,0.1)', drawTicks: false }, border: { display: false },
              ticks: { stepSize: 1, callback: v => (COACH_ZONES[Math.round(v)] ? COACH_ZONES[Math.round(v)].label : '') },
              title: { display: true, text: 'Zone d\'intensité', color: '#605d5d' } },
          },
        },
      });
      return () => { if (inst.current) { inst.current.destroy(); inst.current = null; } };
    }, [session]);
    if (!steps.length) return h('p', { style: { margin: '8px 0 0', fontSize: '12px', color: '#605d5d' } }, session.description || 'Déroulé détaillé non fourni pour cette séance.');
    return h('div', { style: { height: '150px', marginTop: '8px' } }, h('canvas', { ref: cv }));
  }

  function RowDetail({ act, id }) {
    const canvasRef = useRef(null);
    const st = rowStreams[id];
    const isLoading = st === 'loading';
    const isError = st && typeof st === 'object' && st.error;
    const hasData = st && typeof st === 'object' && !st.error;
    const isBike = act.sport === 'Vélo';
    const isSwim = act.sport === 'Natation';
    const [serieVis, setSerieVis] = useState({ fc:false, alt:true, vel:true, pow:false });
    function toggleSerie(k) { setSerieVis(v => ({ ...v, [k]: !v[k] })); }
    const totalMass = (Number(profile.weight)||0) + (Number(profile.bikeMass)||0);
    const velArr  = hasData && st.velocity_smooth && st.velocity_smooth.data ? st.velocity_smooth.data : [];
    const altArr  = hasData && st.altitude   && st.altitude.data   ? st.altitude.data   : [];
    const hrArr   = hasData && st.heartrate  && st.heartrate.data  ? st.heartrate.data  : [];
    const distArr = hasData && st.distance   && st.distance.data   ? st.distance.data   : [];
    const estPowArr = (isBike && totalMass > 0 && velArr.length)
      ? Array.from(buildPowArr(velArr, altArr.length ? altArr : null, distArr.length ? distArr : null, totalMass))
      : [];
    const avgEstPow = estPowArr.length ? Math.round(estPowArr.filter(v=>v!==null&&v>0).reduce((s,v)=>s+v,0) / estPowArr.filter(v=>v!==null&&v>0).length) : null;
    const maxEstPow = estPowArr.length ? Math.max(...estPowArr.filter(v=>v!==null)) : null;
    const wPerKg = avgEstPow && profile.weight ? Math.round((avgEstPow / Number(profile.weight)) * 100) / 100 : null;
    const avgHr = hrArr.length ? Math.round(hrArr.reduce((s,v)=>s+v,0)/hrArr.length) : null;
    const maxHr = hrArr.length ? Math.max(...hrArr) : null;
    const elevGain = altArr.length ? Math.round(altArr.reduce((s,v,i)=>i>0&&v>altArr[i-1]?s+(v-altArr[i-1]):s,0)) : null;
    useEffect(() => {
      if (!hasData || !canvasRef.current) return;
      const enriched = { ...st };
      if (estPowArr.length) enriched._estPow = { data: estPowArr };
      // Debug : vérifier les vraies données reçues de Strava
      if (window._debugStreams) {
        const vd = st.velocity_smooth?.data || [];
        const hd = st.heartrate?.data || [];
        const dd = st.distance?.data || [];
        const N2 = Math.max(1, Math.floor(vd.length / 800));
        // Trouver le pic FC et son contexte
        const hrMax = hd.length ? Math.max(...hd) : 0;
        const hrMaxIdx = hd.indexOf(hrMax);
        const hrWindow = hd.slice(Math.max(0,hrMaxIdx-5), hrMaxIdx+6);
        const hrSmoothed10 = (() => {
          if (!hd.length) return [];
          const win = 10, half = 5, out = [];
          let sum = 0, cnt = 0;
          for (let i=0;i<Math.min(win,hd.length);i++){sum+=hd[i];cnt++;}
          for (let i=0;i<hd.length;i++){
            out.push(cnt?Math.round(sum/cnt):null);
            if(i-half>=0)sum-=hd[i-half],cnt--;
            if(i+half+1<hd.length)sum+=hd[i+half+1],cnt++;
          }
          return out;
        })();
        const hrAtPeakAfterSmooth = hrSmoothed10[hrMaxIdx];
        // Distance au pic FC
        const distAtPeak = dd[hrMaxIdx] ? (dd[hrMaxIdx]/1000).toFixed(2)+' km' : 'N/A';
        // Vitesse filtrée (sans aberrations > 8.33 m/s)
        const velFiltered = vd.filter(v=>v<=8.33&&v>0.3);
        console.log('[BetterStrava] Streams activité', id, {
          points: vd.length,
          thin_N: N2 + ' (1 point sur '+N2+')',
          hr_max_brut: hrMax + ' bpm @ index '+hrMaxIdx+' ('+distAtPeak+')',
          hr_au_pic_apres_lissage_10s: hrAtPeakAfterSmooth + ' bpm',
          hr_avg: hd.length ? Math.round(hd.reduce((a,b)=>a+b,0)/hd.length) + ' bpm' : 'N/A',
          hr_window_brute_au_pic: hrWindow.join(', '),
          vel_max_brut: vd.length ? Math.max(...vd).toFixed(2)+' m/s (aberration GPS probable si >8.33)' : 'N/A',
          vel_max_filtre: velFiltered.length ? Math.max(...velFiltered).toFixed(2)+' m/s → '+(1000/60/Math.max(...velFiltered)).toFixed(2)+' min/km' : 'N/A',
          dist_total: dd.length ? (dd[dd.length-1]/1000).toFixed(2)+' km' : 'N/A',
        });
      }
      drawRowChart(id, act, enriched, canvasRef.current, serieVis);
      return () => { if (rowChartInsts.current[id]) { rowChartInsts.current[id].destroy(); delete rowChartInsts.current[id]; } };
    }, [hasData, totalMass, serieVis]);
    let detailKpis;
    if (isBike) {
      detailKpis = [

        { label:'FC max', value: maxHr!==null?String(maxHr):act.maxHr?String(act.maxHr):'Donnée manquante', unit: maxHr!==null||act.maxHr?'bpm':'' },
        { label:'D+', value: elevGain!==null?'+'+fmtNum(elevGain,0):'Donnée manquante', unit: elevGain!==null?'m':'' },
        { label:'Vitesse', value: act.dist&&act.time?fmtNum(act.dist/(act.time/60),1):'Donnée manquante', unit: act.dist&&act.time?'km/h':'' },
        { label:'W moy.', value: avgEstPow!==null?String(avgEstPow):(act.power?String(act.power):'Donnée manquante'), unit: avgEstPow!==null?'W':'' },
        { label:'W/kg', value: wPerKg!==null?String(wPerKg):(wkg?String(wkg):'Donnée manquante'), unit: wPerKg!==null||wkg?'W/kg':'' },
        ...(() => {
          const ftpV = Number(profile.ftp)||ftpEstimated||null;
          const s = actStreams[act.id];
          const sOk = s && s !== 'error';
          const tssData = calcTSS(act, sOk?s:null, ftpV, Number(profile.fcMax)||null, Number(profile.fcRest)||null, Number(profile.lthr)||null);
          // NP : puissance native Strava si dispo, sinon stream estimé (pour VI/EF)
          const npNative = tssData?.np ?? null;
          const npEst    = sOk&&s.pow&&s.pow.length>=30 ? calcNP(s.pow) : null;
          const np       = npNative ?? npEst;
          const chargeVal   = tssData?.charge ?? null;
          const chargeLabel = tssData?.method ?? null;
          const ifVal  = tssData?.ifVal ?? null;
          const ifLabel = tssData?.method==='TSS' ? 'IF' : 'IF HR';
          // Delta PMC pour cette activite
          const actDateKey = act.date.toISOString().slice(0,10);
          const pmcIdx  = pmcSeries.findIndex(p => p.date === actDateKey);
          const pmcPrev = pmcIdx > 0 ? pmcSeries[pmcIdx-1] : null;
          const pmcCur  = pmcIdx >= 0 ? pmcSeries[pmcIdx] : null;
          const dCTL = pmcPrev&&pmcCur ? Math.round((pmcCur.ctl - pmcPrev.ctl)*10)/10 : null;
          const dATL = pmcPrev&&pmcCur ? Math.round((pmcCur.atl - pmcPrev.atl)*10)/10 : null;
          const dTSB = pmcPrev&&pmcCur ? Math.round((pmcCur.tsb - pmcPrev.tsb)*10)/10 : null;
          const dSign = v => v==null ? '—' : (v>=0?'+':'')+v;
          const pmcCells = (dCTL!=null||dATL!=null) ? [
            { label:'+ Cond. physique', value:dSign(dCTL), unit:'', color:'#22c55e',

            { label:'+ Fatigue', value:dSign(dATL), unit:'', color:'#f97316',

            { label:'- Forme', value:dSign(dTSB), unit:'', color:'#969191',
              tooltip:{ main:'Variation de TSB (forme) apportée par cette séance.', calc:'TSB du jour − TSB de la veille.' }},
          ] : [];
          const avgPowArr  = sOk&&s.pow ? s.pow : null;
          const avgPowMean = avgPowArr ? Math.round(avgPowArr.reduce((a,b)=>a+b,0)/avgPowArr.length) : (act.power||null);
          const vi      = calcVI(np, avgPowMean);
          const ef      = calcEF('Vélo', np, null, avgHr||(act.hr||null));
          const decoupl = sOk&&s.pow&&s.hr ? calcDecoupling('Vélo', s.pow, s.hr) : null;
          return [
            chargeVal!==null&&{ label:'Charge', value: String(chargeVal), unit:'', color: tssColor(chargeVal), bold: true,
              tooltip:{ main: tssData?.method==='TSS'?'TSS : puissance mesurée. 1h FTP = 100.':'HRSS : charge cardiaque. 1h LTHR = 100.', calc: tssData?.method==='TSS'?'(Durée × NP × IF) / (FTP × 3600) × 100.':'TRIMP normalisé s/s.' }},
            { label:'NP', value: np?np+' W':'—', unit:'', color: np?'#201e1d':'#bab6b6',
              tooltip:{ main:'Puissance normalisée.', calc:'Fenêtre 30 s, puissance 4, racine quatrième.' }},
            { label:'VI', value: vi?String(vi):'—', unit:'', color: vi&&vi<1.05?'#22c55e':vi&&vi<1.1?'#f97a60':'#ec3013',
              tooltip:{ main:'Variabilité. Proche 1.0 = effort lisse.', calc:'NP / puissance moy.' }},
            { label:'EF', value: ef?String(ef):'—', unit: ef?'W/bpm':'', color: '#201e1d',

            { label:'Pw:Hr', value: decoupl!==null?decoupl+'%':'—', unit:'', color: decoupl!==null&&Math.abs(decoupl)<5?'#22c55e':'#ec3013',
              tooltip:{ main:'Découplage aérobie. < 5 % = stable.', calc:'EF 2ème / EF 1ère - 1 × 100.' }},
            ...pmcCells,
          ].filter(Boolean);
        })(),
      ];
    } else if (isSwim) {
      detailKpis = [
        { label:'FC moyenne',  value: avgHr!==null?String(avgHr):(act.hr?String(act.hr):'Donnée manquante'), unit: avgHr!==null||act.hr?'bpm':'' },
        { label:'FC max',      value: maxHr!==null?String(maxHr):act.maxHr?String(act.maxHr):'Donnée manquante', unit: maxHr!==null||act.maxHr?'bpm':'' },
        { label:'Allure moy.', value: act.pace?fmtPace(act.pace/10):'Donnée manquante', unit: act.pace?'/100m':'' },

          const dTSB = pmcPrev&&pmcCur ? Math.round((pmcCur.tsb - pmcPrev.tsb)*10)/10 : null;
          const dSign = v => v==null ? '\u2014' : (v>=0?'+':'')+v;
          const pmcCells = (dCTL!=null||dATL!=null) ? [
            { label:'+ Cond. physique', value:dSign(dCTL), unit:'', color:'#22c55e',

              tooltip:{ main:'Variation de TSB (forme) apport\u00e9e par cette s\u00e9ance.', calc:'TSB du jour \u2212 TSB de la veille.' }},

          const avgVelMs = sOk&&s.vel ? s.vel.reduce((a,b)=>a+b,0)/s.vel.length : (act.dist&&act.time?(act.dist*1000)/(act.time*60):null);
          const ef      = calcEF('Course', null, avgVelMs, avgHr||(act.hr||null));
          const decoupl = sOk&&s.vel&&s.hr ? calcDecoupling('Course', s.vel, s.hr) : null;
          return [
            chargeVal!==null&&{ label:'Charge', value: String(chargeVal), unit:'', color: tssColor(chargeVal), bold: true,
              tooltip:{ main:'HRSS : charge cardiaque. 1h LTHR = 100.', calc:'TRIMP normalisé s/s.' }},

            { label:'Pa:Hr', value: decoupl!==null?decoupl+'%':'—', unit:'', color: decoupl!==null&&Math.abs(decoupl)<5?'#22c55e':'#ec3013',

    } else {
      detailKpis = [

              const fmt = v => { if (!v) return '—'; if (isVelo) return fmtSpeed(v)||'—'; if (isSwim) return fmtSwim(v)||'—'; return (fmtPR(v)||'—')+' /km'; };

                    onMouseEnter:e=>{ if(per.id) e.currentTarget.style.background='#fdf1ee'; },
                    onMouseLeave:e=>{ e.currentTarget.style.background='transparent'; },
                    style:{display:'grid',gridTemplateColumns:'1fr 1fr 1fr 1fr',gap:'0',padding:'5px 0',borderBottom:'1px solid #d7d3d3',alignItems:'baseline',cursor:per.id?'pointer':'default'}
                  },
                    // Col 1 : distance + badge PR
                    h('div',{style:{display:'flex',alignItems:'center',gap:'4px'}},
                      h('span',{style:{fontSize:'11px',fontWeight:'700',letterSpacing:'0.06em',textTransform:'uppercase',color:'#605d5d'}},def.l),
                      isAtBest&&h('span',{style:{fontSize:'8px',fontWeight:'800',color:'#ec3013',letterSpacing:'0.08em',padding:'0 3px',border:'1px solid #ec3013',lineHeight:'14px'}},'PR')
                    ),
                    // Col 2 : période (orange)
                    h('span',{style:{fontSize:'13px',fontWeight:'800',letterSpacing:'-0.02em',color:per.val?(isAtBest?'#ec3013':'#ec3013'):'#bab6b6'}},
                      per.val ? fmt(per.val) : '—'
                    ),
                    // Col 3 : record all-time (noir)
                    h('span',{style:{fontSize:'13px',fontWeight:'800',letterSpacing:'-0.02em',color:all.val?'#201e1d':'#bab6b6'}},
                      all.val ? fmt(all.val) : '—'
                    ),
                    // Col 4 : delta
                    chip
                      ? h('div',{style:{display:'flex',alignItems:'center',gap:'3px'}},
                          chip.arrow&&h('span',{style:{...chip.arrowStyle,fontSize:'11px'}},chip.arrow),
                          h('span',{style:{...chip.style,padding:'1px 5px',fontSize:'10px'}},chip.text)
                        )
                      : h('span',{style:{fontSize:'11px',color:'#bab6b6'}},per.val&&all.val&&dPct===0?'=':'—')
                  );
                })
              );
            })()
          ),
          !isTousLayout && h('div',{style:{gridColumn:'2',gridRow:'2',minWidth:0,padding:'20px 24px 24px'}},
            h('div',{style:{display:'flex',flexWrap:'wrap',alignItems:'baseline',justifyContent:'space-between',gap:'4px',marginBottom:'10px'}},
              h('h2',{style:{margin:0,fontSize:'14px',fontWeight:'800',letterSpacing:'-0.01em'}},'Zones cardiaques'),
              h('span',{style:{fontSize:'10px',letterSpacing:'0.1em',textTransform:'uppercase',color:'#605d5d'}},'Répartition')
            ),
            h('p',{style:{margin:'0 0 10px',fontSize:'11px',color:'#605d5d'}},acts.some(a=>a.hr)?'Min. dans chaque zone de FC.':'Donnée manquante — aucune FC.'),
            h('div',{style:{height:'160px'}},h('canvas',{ref:zoneRef})),
            h('div',{style:{display:'flex',flexDirection:'column',marginTop:'10px'}},
              zm.map((z,i)=>h('div',{key:i,style:{display:'flex',flexWrap:'wrap',alignItems:'baseline',gap:'4px 8px',padding:'4px 0',borderBottom:'1px solid #d7d3d3'}},
                h('span',{style:{flexShrink:0,width:'10px',height:'10px',background:z.color,border:'1px solid #d7d3d3'}}),
                h('span',{style:{flex:'1 0 auto',fontSize:'11px',fontWeight:'600'}},z.label),
                h('span',{style:{fontSize:'11px',fontVariantNumeric:'tabular-nums'}},fmtH(z.min)),
                h('span',{style:{fontSize:'11px',color:'#605d5d',fontVariantNumeric:'tabular-nums'}},Math.round((z.min/zmTotal)*100)+' %')
              ))
            )
          ),
          h('div',{style:{gridColumn:'1',gridRow:'2',minWidth:0,padding:'28px 32px 32px',borderRight:'2px solid #201e1d'}},
            h('div',{style:{display:'flex',alignItems:'baseline',justifyContent:'space-between',gap:'16px',marginBottom:'8px'}},
              h('h2',{style:{margin:0,fontSize:'16px',fontWeight:'800',letterSpacing:'-0.01em'}},'Charge quotidienne'),
              h('span',{style:{fontSize:'11px',letterSpacing:'0.1em',textTransform:'uppercase',color:'#605d5d'}},range===365?'1 an':range===180?'6 mois':range===90?'3 mois':'1 mois')
            ),
            h('p',{style:{margin:'0 0 14px',fontSize:'12px',color:'#605d5d',maxWidth:'62ch'}},!acts.length?'Donnée manquante — aucune activité importée.':"Minutes d'activité par jour. Les week-ends sont en gris."),
            h('div',{style:{height:'252px'}},h('canvas',{ref:dailyRef}))
          )
        );
        })(),
        h('section',{style:{padding:'28px 32px 48px'}},
          h('div',{style:{display:'flex',alignItems:'baseline',justifyContent:'space-between',gap:'16px',marginBottom:'20px'}},
            h('h2',{style:{margin:0,fontSize:'16px',fontWeight:'800',letterSpacing:'-0.01em'}},'Séances de la sélection'),
            h('span',{style:{fontSize:'11px',letterSpacing:'0.1em',textTransform:'uppercase',color:'#605d5d'}},(expanded?Math.min(40,acts.length):Math.min(8,acts.length))+' / '+acts.length)
          ),
          h('table',{style:{width:'100%',borderCollapse:'collapse',fontSize:'14px'}},
            h('thead',null,
              h('tr',{style:{borderTop:'2px solid #201e1d',borderBottom:'2px solid #201e1d'}},
                ['Date','Sport','Nom','Distance','Temps','D+','Allure / Vitesse'].map((col,i)=>
                  h('th',{key:i,style:{padding:i===0?'10px 12px 10px 0':'10px 12px',textAlign:i>2?'right':'left',fontSize:'11px',fontWeight:'600',letterSpacing:'0.1em',textTransform:'uppercase',color:'#605d5d'}},col)
                )
              )
            ),
            h('tbody',null,
              rows.flatMap((row,ri) => {
                const isOpen = openRowId === row.id;
                const items = [
                  h('tr',{
                    key:'row-'+ri,
                    id:'act-row-'+row.id,
                    style:{borderBottom: isOpen?'0':'1px solid #d7d3d3', cursor:'pointer', background: isOpen?'#fdf1ee':'transparent'},
                    onClick:() => toggleRow(row.act),
                    onMouseEnter:e=>{ if(!isOpen) e.currentTarget.style.background='#fdf1ee'; },
                    onMouseLeave:e=>{ if(!isOpen) e.currentTarget.style.background='transparent'; },
                  },
                    h('td',{style:{padding:'12px 12px 12px 0',color:'#605d5d',whiteSpace:'nowrap'}},
                      h('span',{style:{display:'inline-block',marginRight:'6px',fontSize:'9px',color:'#bab6b6',transition:'transform 0.15s',transform:isOpen?'rotate(90deg)':'rotate(0deg)',verticalAlign:'middle'}},'\u25b6'),
                      row.date
                    ),
                    h('td',{style:{padding:'12px',fontWeight:'600',whiteSpace:'nowrap'}},row.sport),
                    h('td',{style:{padding:'12px',color:'#201e1d',maxWidth:'220px',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},row.name),
                    h('td',{style:{padding:'12px',textAlign:'right',fontVariantNumeric:'tabular-nums',whiteSpace:'nowrap'}},row.dist),
                    h('td',{style:{padding:'12px',textAlign:'right',fontVariantNumeric:'tabular-nums',whiteSpace:'nowrap'}},row.time),
                    h('td',{style:{padding:'12px',textAlign:'right',fontVariantNumeric:'tabular-nums',whiteSpace:'nowrap',color: row.elev===null?'#bab6b6':'inherit'}}, row.elev===null?'—':row.elev),
                    h('td',{style:{padding:'12px 0 12px 12px',textAlign:'right',fontVariantNumeric:'tabular-nums',whiteSpace:'nowrap'}},row.pace)
                  )
                ];
                if (isOpen) items.push(h(RowDetail,{key:'detail-'+ri,act:row.act,id:row.id}));
                return items;
              })
            )
          ),
          h('div',{style:{display:'flex',alignItems:'center',gap:'16px',marginTop:'24px'}},
            h('button',{type:'button',onClick:()=>setExpanded(v=>!v),style:{minWidth:'200px',padding:'12px 16px',border:'2px solid #201e1d',background:'transparent',color:'#201e1d',fontFamily:'inherit',fontSize:'12px',fontWeight:'600',letterSpacing:'0.08em',textTransform:'uppercase',textAlign:'left',cursor:'pointer'},onMouseEnter:e=>{e.currentTarget.style.background='#ffe0d9';e.currentTarget.style.borderColor='#ec3013';},onMouseLeave:e=>{e.currentTarget.style.background='transparent';e.currentTarget.style.borderColor='#201e1d';}},expanded?'Réduire la liste':'Voir plus de séances'),
            h('span',{style:{fontSize:'12px',color:'#605d5d'}},acts.length?'Trié du plus récent au plus ancien.':'Donnée manquante — aucune activité importée.')
          )
        )
      ),

      // ── PROFIL ────────────────────────────────────────────────────────────
      tab==='profil'&&h('div',null,
        h('header',{style:{display:'flex',alignItems:'flex-end',justifyContent:'space-between',flexWrap:'wrap',gap:'24px',minHeight:'108px',boxSizing:'border-box',padding:'24px 32px',borderBottom:'2px solid #201e1d'}},
          h('div',{style:{display:'flex',flexDirection:'column',gap:'4px'}},
            h('span',{style:{fontSize:'11px',fontWeight:'600',letterSpacing:'0.14em',textTransform:'uppercase',color:'#ec3013'}},'Profil'),
            h('h1',{style:{margin:0,fontSize:'30px',fontWeight:'800',letterSpacing:'-0.02em',lineHeight:'1'}},profile.name||'Donnée manquante')
          ),
          h('div',{style:{display:'flex',flexDirection:'column',gap:'4px'}},
            h('span',{style:{fontSize:'11px',fontWeight:'600',letterSpacing:'0.12em',textTransform:'uppercase',color:'#605d5d'}},'Objectif'),
            h('span',{style:{fontSize:'14px',fontWeight:'600'}},race.type+' · '+(raceDateObj?raceDateObj.toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'}):'date à définir')),
            h('span',{style:{fontSize:'12px',color:'#605d5d'}},daysToRace===null?'Aucune date renseignée.':daysToRace>=0?'Dans '+daysToRace+' jours · '+Math.round(daysToRace/7)+' semaines restantes.':'Course passée il y a '+Math.abs(daysToRace)+' jours.')
          )
        ),
        h('section',{style:{display:'grid',gridTemplateColumns:'1fr 3fr',borderBottom:'2px solid #201e1d'}},
          h('div',{style:{minWidth:0,padding:'24px 32px 28px',borderRight:'2px solid #201e1d'}},
            h('h2',{style:{margin:'0 0 4px',fontSize:'15px',fontWeight:'800',letterSpacing:'-0.01em'}},'Identité'),
            h('p',{style:{margin:'0 0 18px',fontSize:'12px',color:'#605d5d'}},'Ces données servent aux zones, à la charge et aux estimations.'),
            h('div',{style:{display:'grid',gridTemplateColumns:'1fr',gap:'16px 18px'}},
              h('div',{style:{display:'flex',flexDirection:'column',gap:'7px'}},
                h('label',{style:{fontSize:'10px',fontWeight:'600',letterSpacing:'0.1em',textTransform:'uppercase',color:'#605d5d'}},'Nom'),
                h('input',{type:'text',value:profile.name,onChange:e=>setProfile(p=>({...p,name:e.target.value})),style:{width:'100%',padding:'10px 12px',border:'2px solid #201e1d',background:'#ffffff',color:'#201e1d',fontFamily:'inherit',fontSize:'14px',fontWeight:'600'}})
              ),
              h('div',{style:{display:'flex',flexDirection:'column',gap:'7px'}},
                h('label',{style:{fontSize:'10px',fontWeight:'600',letterSpacing:'0.1em',textTransform:'uppercase',color:'#605d5d'}},'Genre'),
                h('select',{value:profile.gender,onChange:e=>setProfile(p=>({...p,gender:e.target.value})),style:{width:'100%',padding:'10px 12px',border:'2px solid #201e1d',background:'#ffffff',color:'#201e1d',fontFamily:'inherit',fontSize:'14px',fontWeight:'600',cursor:'pointer'}},
                  ['Femme','Homme','Non précisé'].map(g=>h('option',{key:g,value:g},g))
                )
              ),
              [{k:'age',label:'Âge (ans)',step:1},{k:'height',label:'Taille (cm)',step:1},{k:'weight',label:'Poids cycliste (kg)',step:0.1},{k:'bikeMass',label:'Poids vélo (kg)',step:0.1},{k:'fcMax',label:'FC max (bpm)',step:1},{k:'fcRest',label:'FC repos (bpm)',step:1},{k:'lthr',label:'LTHR — FC seuil lactate (bpm)',step:1},{k:'ftp',label:'FTP vélo (W)',step:1},{k:'thresholdPace',label:'Allure seuil course (min/km)',step:0.01}].map(f=>
                h('div',{key:f.k,style:{display:'flex',flexDirection:'column',gap:'7px'}},
                  h('div',{style:{display:'flex',alignItems:'baseline',justifyContent:'space-between',gap:'8px'}},
                    h('label',{style:{fontSize:'10px',fontWeight:'600',letterSpacing:'0.1em',textTransform:'uppercase',color:'#605d5d'}},f.label),
                    f.k==='thresholdPace'&&thresholdPaceEstimated&&h('button',{type:'button',onClick:()=>setProfile(p=>({...p,thresholdPace:thresholdPaceEstimated})),
                      style:{padding:'2px 8px',border:'2px solid #ec3013',background:'transparent',color:'#ec3013',fontFamily:'inherit',fontSize:'10px',fontWeight:'700',letterSpacing:'0.06em',textTransform:'uppercase',cursor:'pointer',whiteSpace:'nowrap'},
                      onMouseEnter:e=>{e.currentTarget.style.background='#fdf1ee';},onMouseLeave:e=>{e.currentTarget.style.background='transparent';},
                    },'Est. '+thresholdPaceEstimated+' \'\u2192'),
                    f.k==='ftp'&&ftpEstimated&&h('button',{type:'button',onClick:()=>setProfile(p=>({...p,ftp:ftpEstimated})),
                      style:{padding:'2px 8px',border:'2px solid #ec3013',background:'transparent',color:'#ec3013',fontFamily:'inherit',fontSize:'10px',fontWeight:'700',letterSpacing:'0.06em',textTransform:'uppercase',cursor:'pointer',whiteSpace:'nowrap'},
                      onMouseEnter:e=>{e.currentTarget.style.background='#fdf1ee';},onMouseLeave:e=>{e.currentTarget.style.background='transparent';},
                    },'Est. '+ftpEstimated+' W \u2192')
                  ),
                  h('input',{type:'number',step:f.step,value:profile[f.k]??'',onChange:e=>{const v=e.target.value;setProfile(p=>({...p,[f.k]:v===''?'':Number(v)}));},style:{width:'100%',padding:'10px 12px',border:'2px solid #201e1d',background:'#ffffff',color:'#201e1d',fontFamily:'inherit',fontSize:'14px',fontWeight:'600',fontVariantNumeric:'tabular-nums'}}),
                  f.k==='thresholdPace'&&thresholdPaceEstimated&&h('p',{style:{margin:'4px 0 0',fontSize:'11px',color:'#605d5d'}},
                    cvModel&&cvModel.method==='cv_model'
                      ? 'Modèle vitesse critique (CV) · '+cvModel.nPts+' distances · r²\u202f=\u202f'+cvModel.r2+' · confiance\u202f: '+cvModel.conf+(cvModel.dPrime?' · D\u2032\u202f=\u202f'+cvModel.dPrime+'\u202fm':'')
                      : cvModel&&cvModel.method==='best5k' ? 'Meilleure allure 5 km × 0.95 (données insuffisantes pour le modèle CV)'
                      : 'Estimation Riegel depuis allure moyenne (pas de streams disponibles)'
                  ),
                  f.k==='ftp'&&ftpEstimated&&h('p',{style:{margin:'4px 0 0',fontSize:'11px',color:'#605d5d'}},
                    cpModel&&cpModel.method==='cp_model'
                      ? 'Modèle puissance critique (CP) · '+cpModel.nPts+' durées · r²\u202f=\u202f'+cpModel.r2+' · confiance\u202f: '+cpModel.conf+(cpModel.wPrime?' · W\u2032\u202f=\u202f'+cpModel.wPrime+'\u202fkJ':'')
                      : cpModel&&cpModel.method==='best20' ? 'Meilleur effort 20 min × 0.95 (données insuffisantes pour le modèle CP)'
                      : 'Estimation vitesse moyenne (pas de streams disponibles) · masse '+((Number(profile.weight)||0)+(Number(profile.bikeMass)||0)).toFixed(1)+' kg'
                  )
                )
              )
            ),
            h('p',{style:{margin:'18px 0 0',fontSize:'12px',color:'#605d5d'}},'IMC '+(bmi??'donnée manquante')+' · W/kg FTP '+(wkg??'donnée manquante')+' · réserve cardiaque '+(p.fcMax&&p.fcRest?p.fcMax-p.fcRest+' bpm':'donnée manquante')+'.'+(p.weight&&p.bikeMass?' Masse système : '+(Number(p.weight)+Number(p.bikeMass)).toFixed(1)+' kg.':''))
          ),
          h('div',{style:{minWidth:0,padding:'24px 32px 28px'}},
            h('h2',{style:{margin:'0 0 4px',fontSize:'15px',fontWeight:'800',letterSpacing:'-0.01em'}},'Course visée'),
            h('p',{style:{margin:'0 0 16px',fontSize:'12px',color:'#605d5d'}},'Le type de course pré-remplit les champs à compléter.'),
            h('label',{style:{display:'block',fontSize:'10px',fontWeight:'600',letterSpacing:'0.12em',textTransform:'uppercase',color:'#605d5d'}},'Type de course'),
            h('select',{value:race.type,onChange:e=>{const t=e.target.value;setRace(r=>({...r,type:t,values:defaultValues(t)}));},style:{width:'100%',marginTop:'8px',padding:'11px 12px',border:'2px solid #201e1d',background:'#ffffff',color:'#201e1d',fontFamily:'inherit',fontSize:'13px',fontWeight:'600',cursor:'pointer'}},
              Object.keys(RACE_CATALOG).map(rt=>h('option',{key:rt,value:rt},rt))
            ),
            h('label',{style:{display:'block',marginTop:'16px',fontSize:'10px',fontWeight:'600',letterSpacing:'0.12em',textTransform:'uppercase',color:'#605d5d'}},'Date'),
            h('input',{type:'date',value:race.date,onChange:e=>setRace(r=>({...r,date:e.target.value})),style:{width:'100%',marginTop:'8px',padding:'10px 12px',border:'2px solid #201e1d',background:'#ffffff',color:'#201e1d',fontFamily:'inherit',fontSize:'13px',fontWeight:'600'}}),
            h('div',{style:{display:'grid',gridTemplateColumns:'repeat(auto-fit, minmax(140px, 1fr))',gap:'16px 20px',marginTop:'20px'}},
              spec.fields.map(f=>h('div',{key:f.k,style:{display:'flex',flexDirection:'column',gap:'7px'}},
                h('label',{style:{fontSize:'10px',fontWeight:'600',letterSpacing:'0.1em',textTransform:'uppercase',color:'#605d5d'}},f.label),
                h('input',{type:'number',step:f.step||1,value:race.values[f.k]??'',onChange:e=>{const v=e.target.value;setRace(r=>({...r,values:{...r.values,[f.k]:v===''?'':Number(v)}}));},style:{width:'100%',padding:'10px 12px',border:'2px solid #201e1d',background:'#ffffff',color:'#201e1d',fontFamily:'inherit',fontSize:'14px',fontWeight:'600',fontVariantNumeric:'tabular-nums'}})
              ))
            ),
            h('div',{style:{display:'flex',flexWrap:'wrap',alignItems:'center',gap:'16px',marginTop:'22px',paddingTop:'18px',borderTop:'2px solid #201e1d'}},
              h('div',null,
                h('span',{style:{display:'block',fontSize:'10px',fontWeight:'600',letterSpacing:'0.1em',textTransform:'uppercase',color:'#605d5d'}},'Estimation'),
                h('div',{style:{display:'flex',alignItems:'baseline',gap:'6px',marginTop:'4px'}},
                  h('span',{style:{fontSize:'30px',fontWeight:'800',letterSpacing:'-0.03em',lineHeight:'0.9'}},data.length?ready:'—'),
                  h('span',{style:{fontSize:'13px',fontWeight:'600',color:'#605d5d'}},'% prêt')
                )
              ),
              h('div',{style:{paddingLeft:'20px',borderLeft:'2px solid #201e1d'}},
                h('span',{style:{display:'block',fontSize:'10px',fontWeight:'600',letterSpacing:'0.1em',textTransform:'uppercase',color:'#605d5d'}},'Temps projeté'),
                h('span',{style:{display:'block',marginTop:'4px',fontSize:'24px',fontWeight:'800',letterSpacing:'-0.02em'}},projDisplay),
                projResult&&projResult.segments
                  ? h('div',{style:{marginTop:'8px',display:'flex',flexDirection:'column',gap:'3px'}},
                      [
                        projResult.segments.swim && { label:'Nat.', res: projResult.segments.swim },
                        projResult.segments.bike && { label:'Vélo', res: projResult.segments.bike },
                        projResult.segments.run  && { label:'Course', res: projResult.segments.run },
                      ].filter(Boolean).map(({label, res}) => {
                        const clk = res && res.refId != null ? () => openActivity(res.refId) : null;
                        return h('div',{key:label,onClick:clk||undefined,title:clk?'Analyser cette activité':undefined,style:{display:'flex',alignItems:'baseline',gap:'8px',cursor:clk?'pointer':'default'}},
                          h('span',{style:{fontSize:'10px',fontWeight:'700',letterSpacing:'0.1em',textTransform:'uppercase',color:'#ec3013',minWidth:'42px'}},label),
                          h('span',{style:{fontSize:'13px',fontWeight:'800',letterSpacing:'-0.01em'}},fmtProjected(res.minutes)),
                          h('span',{style:{fontSize:'11px',color:'#605d5d'}},res.refDist ? '\u00b7 d\'après ' + fmtNum(res.refDist,1) + ' km' : '')
                        );
                      }),
                      projResult.transitions && h('div',{key:'trans',style:{display:'flex',alignItems:'baseline',gap:'8px',opacity:0.6}},
                        h('span',{style:{fontSize:'10px',fontWeight:'700',letterSpacing:'0.1em',textTransform:'uppercase',color:'#605d5d',minWidth:'42px'}},'T1+T2'),
                        h('span',{style:{fontSize:'13px',fontWeight:'800',letterSpacing:'-0.01em'}},'+'+projResult.transitions+' min')
                      ),
                      h('div',{style:{marginTop:'4px',paddingTop:'4px',borderTop:'1px solid #d7d3d3',fontSize:'11px',color:'#605d5d'}},'Estimation par segment · total ' + fmtProjected(projResult.minutes))
                    )
                  : projResult&&h('span',{style:{display:'block',marginTop:'4px',fontSize:'11px',color:projRefClick?'#ec3013':'#605d5d',cursor:projRefClick?'pointer':'default'},onClick:projRefClick||undefined,title:projRefClick?'Analyser cette activité':undefined},projNote)
              )
            )
          )
        )
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
