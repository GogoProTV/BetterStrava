// ── helpers ──────────────────────────────────────────────────────────────────
function weekStart(d) {
  const x = new Date(d);
  const day = (x.getDay() + 6) % 7;
  x.setDate(x.getDate() - day);
  x.setHours(0, 0, 0, 0);
  return x;
}
function sum(list, key) { return list.reduce((s, a) => s + (a[key] || 0), 0); }
function fmtNum(v, dec) { return Number(v).toLocaleString('fr-FR', { minimumFractionDigits: dec, maximumFractionDigits: dec }); }
function fmtPace(min) {
  if (!isFinite(min) || min <= 0) return '—';
  const total = Math.round(min * 60);
  return Math.floor(total / 60) + "'" + String(total % 60).padStart(2, '0') + '"';
}
function fmtH(min) { const h = Math.floor(min / 60); return h + 'h' + String(Math.round(min % 60)).padStart(2, '0'); }
function btnStyle(active) {
  return {
    padding: '9px 14px', border: '2px solid ' + (active ? '#ec3013' : '#201e1d'),
    background: active ? '#ec3013' : 'transparent', color: active ? '#ffffff' : '#201e1d',
    fontFamily: 'inherit', fontSize: '12px', fontWeight: '600', letterSpacing: '0.08em',
    textTransform: 'uppercase', textAlign: 'left', cursor: 'pointer',

}
function navStyle(active, sub) {
  return {
    display: 'flex', alignItems: 'center', gap: '10px', width: '100%',
    padding: sub ? '11px 24px 11px 38px' : '15px 24px',
    border: '0', borderBottom: sub ? '1px solid #d7d3d3' : '2px solid #201e1d',
    background: active ? '#ec3013' : 'transparent', color: active ? '#ffffff' : '#201e1d',

    letterSpacing: '0.08em', textTransform: 'uppercase', textAlign: 'left', cursor: 'pointer',

}
function deltaChip(pct, betterHigh) {
  if (pct === null || !isFinite(pct)) return { text: '—', style: { padding: '3px 8px', fontSize: '12px', fontWeight: '600', background: '#eae9e9', color: '#605d5d' }, arrow: '', arrowStyle: { fontSize: '13px', color: '#605d5d' } };
  const good = betterHigh ? pct > 0 : pct < 0;
  const flat = pct === 0;
  const bad = !good && !flat;
  return {
    text: bad ? '' : flat ? '—' : '+' + pct + '%',
    style: { padding: bad ? '0' : '3px 8px', fontSize: '12px', fontWeight: '600', letterSpacing: '0.04em', background: flat ? '#eae9e9' : good ? '#ffe0d9' : 'transparent', color: flat ? '#605d5d' : good ? '#ae1800' : 'transparent' },
    arrow: good ? '▲' : '',
    arrowStyle: { fontSize: '13px', lineHeight: '1', color: good ? '#ec3013' : 'transparent' },
  };
}

// ── activity mapping ─────────────────────────────────────────────────────────
function mapActivity(a) {
  const map = {
    Run: 'Course', VirtualRun: 'Course', TrailRun: 'Trail',
    Ride: 'Vélo', VirtualRide: 'Vélo', GravelRide: 'Vélo', MountainBikeRide: 'Vélo', EBikeRide: 'Vélo',
    Swim: 'Natation',
  };
  const sport = map[a.sport_type || a.type];
  if (!sport) return null;
  const dist = (a.distance || 0) / 1000;
  const time = Math.round((a.moving_time || a.elapsed_time || 0) / 60);
  if (!time) return null;
  return {
    id: a.id,
    date: new Date(a.start_date_local || a.start_date),
    name: a.name || null, sport, dist: Math.round(dist * 10) / 10, time,
    elev: Math.round(a.total_elevation_gain || 0),
    pace: dist > 0 ? time / dist : null,
    power: a.average_watts ? Math.round(a.average_watts) : null,
    maxPower: a.max_watts ? Math.round(a.max_watts) : null,
    secs: a.moving_time || a.elapsed_time || 0,
    hr: a.average_heartrate ? Math.round(a.average_heartrate) : null,
    trainingLoad: a.suffer_score || Math.round(time * 0.85),
    planned: false,
  };
}

function defaultValues(type) {
  const out = {};
  (RACE_CATALOG[type] || { fields: [] }).fields.forEach(f => { out[f.k] = f.v; });
  return out;
}

// ── Strava API ────────────────────────────────────────────────────────────────
const BASE = '/api';
const STRAVA_CLIENT_ID = '274766';
const STRAVA_REDIRECT = 'https://better-strava.vercel.app/';

async function resolveClientId() {
  if (STRAVA_CLIENT_ID) return STRAVA_CLIENT_ID;
  try { const cfg = await fetch(BASE + '/strava-config').then(r => r.json()); if (cfg && cfg.client_id) return String(cfg.client_id); } catch (e) {}
  return '';
}
function stravaApi(path, token) {
  return fetch(BASE + '/strava-api?path=' + encodeURIComponent(path), { headers: { authorization: 'Bearer ' + token } }).then(r => r.json());
}
async function freshToken(token) {
  const exp = Number(localStorage.getItem('strava_expires_at') || 0);
  const refresh = localStorage.getItem('strava_refresh_token');
  if (!refresh || !exp || exp * 1000 - Date.now() > 5 * 60000) return token;
  try {
    const res = await fetch(BASE + '/exchange-token?refresh_token=' + encodeURIComponent(refresh)).then(r => r.json());
    if (res && res.access_token) {
      localStorage.setItem('strava_token', res.access_token);
      if (res.refresh_token) localStorage.setItem('strava_refresh_token', res.refresh_token);
      if (res.expires_at) localStorage.setItem('strava_expires_at', String(res.expires_at));
      return res.access_token;
    }
  } catch (e) {}
  return token;
}

// ── crosshair plugin ─────────────────────────────────────────────────────────
const crosshairPlugin = {
  id: 'crosshair',
  afterEvent(chart, args) {
    const e = args.event;
    chart._cx = (e.type === 'mousemove' && e.x >= chart.chartArea.left && e.x <= chart.chartArea.right) ? e.x : null;
    if (e.type === 'mouseout') chart._cx = null;
  },
  afterDatasetsDraw(chart) {
    if (chart._cx == null) return;
    const { ctx, chartArea } = chart;
    ctx.save(); ctx.beginPath();
    ctx.moveTo(chart._cx, chartArea.top); ctx.lineTo(chart._cx, chartArea.bottom);
    ctx.lineWidth = 1; ctx.strokeStyle = '#201e1d'; ctx.stroke(); ctx.restore();
  },
};

// ── zone minutes ─────────────────────────────────────────────────────────────
function zoneMinutes(list, fcMax) {
  const max = Number(fcMax) || 190;
  const defs = [
    { label: 'Z1 · récup', hi: 0.6, color: '#ffe0d9', min: 0 },
    { label: 'Z2 · endurance', hi: 0.7, color: '#ffb3a3', min: 0 },
    { label: 'Z3 · tempo', hi: 0.8, color: '#f97a60', min: 0 },
    { label: 'Z4 · seuil', hi: 0.9, color: '#ec3013', min: 0 },
    { label: 'Z5 · VMA', hi: 1.2, color: '#ae1800', min: 0 },
  ];
  list.forEach(a => {
    if (!a.hr) return;
    const ratio = a.hr / max;
    const z = defs.find(d => ratio <= d.hi) || defs[4];
    z.min += a.time;
  });
  return defs;
}

// ── Estimation de puissance vélo (modèle physique) ───────────────────────────
// P = P_roulement + P_aero + P_gravité + P_inertie(≈0 en régime établi)
// Crr = 0.008 (asphalte), CdA = 0.35 m² (position route classique)
// rho_air = 1.225 kg/m³, eta = 0.97 (rendement transmission)
const CRR = 0.008;
const CDA = 0.35;
const RHO = 1.225;
const ETA = 0.97;
const G   = 9.81;

function estimatePower(v_kmh, slope_pct, totalMassKg) {
  if (!v_kmh || v_kmh <= 0 || !totalMassKg || totalMassKg <= 0) return null;
  const v = v_kmh / 3.6; // m/s
  const grade = (slope_pct || 0) / 100;
  const P_roll  = CRR * totalMassKg * G * v;
  const P_aero  = 0.5 * CDA * RHO * v * v * v;
  const P_grav  = totalMassKg * G * grade * v;
  return Math.max(0, Math.round((P_roll + P_aero + P_grav) / ETA));
}

// Puissance estimée moyenne pour une liste d'activités vélo
function bikeActsEstimatedPower(acts, totalMassKg) {
  const rides = acts.filter(a => a.sport === 'Vélo' && a.dist && a.time);
  if (!rides.length || !totalMassKg) return null;
  const pList = rides.map(a => {
    const v = a.dist / (a.time / 60); // km/h moyen
    const slope = a.elev && a.dist ? (a.elev / (a.dist * 1000)) * 100 : 0;
    return estimatePower(v, slope, totalMassKg);
  }).filter(v => v !== null);
  if (!pList.length) return null;
  return Math.round(pList.reduce((s, v) => s + v, 0) / pList.length);
}

// ── Calculateur de temps projeté ────────────────────────────────────────────
// Modèle Riegel : t2 = t1 × (d2/d1)^1.06  (exposant fatigue standard)
// Correction dénivelé Minetti : coût énergétique en fonction de la pente
// eq_dist = dist × (1 + D+ × 0.01)  (approximation : +1% par tranche de 100m/10km)

function projectRaceTime(activities, raceType, raceDist, raceElev, raceElevNeg) {
  // Distances de référence par sport
  const runSports = ['Course', 'Trail'];
  const bikeSports = ['Vélo'];
  const swimSports = ['Natation'];

  let refSport = runSports;
  if (raceType === 'Cyclosportive' || raceType === 'Contre-la-montre vélo') refSport = bikeSports;
  if (raceType === 'Natation eau libre') refSport = swimSports;

  const candidates = activities.filter(a =>
    refSport.includes(a.sport) && a.dist >= 1 && a.time > 0 && a.pace
  );
  if (!candidates.length || !raceDist) return null;

  // Trouver la sortie avec la meilleure allure sur une distance ≥ 60% de la cible
  // ou la plus longue dispo si pas assez
  const minDist = Math.min(raceDist * 0.6, 10);
  const usable = candidates.filter(a => a.dist >= minDist);
  const pool = usable.length ? usable : candidates;
  // Choisir la sortie la plus rapide (meilleure allure = min pace) avec dist raisonnable
  pool.sort((a, b) => {
    // Pondérer par la distance pour ne pas extrapoler depuis 1 km
    const scoreA = a.pace / Math.log(a.dist + 1);
    const scoreB = b.pace / Math.log(b.dist + 1);
    return scoreA - scoreB;
  });
  const ref = pool[0];

  // Correction dénivelé : coût énergétique Minetti simplifié
  // Temps équivalent plat = temps_reel × (1 - facteur_gain_elev)
  // On utilise : chaque 100m D+ sur 10 km ≈ +2 min/km d'équivalent
  const refElevFactor = ref.elev && ref.dist
    ? 1 + (ref.elev / (ref.dist * 1000)) * 4.5   // pente positive
    : 1;
  const refElevNegFactor = 1; // descente neutre sur sorties mixtes
  const refPaceFlat = ref.pace / refElevFactor;

  // Cible : distance équivalente plat
  const raceElevFactor = raceElev && raceDist
    ? 1 + (raceElev / (raceDist * 1000)) * 4.5
    : 1;
  const raceElevNegFactor = raceElevNeg && raceDist
    ? Math.max(0.85, 1 - (raceElevNeg / (raceDist * 1000)) * 1.5)
    : 1;
  const raceEqDist = raceDist * raceElevFactor * raceElevNegFactor;
  const refEqDist  = ref.dist  * refElevFactor;

  // Riegel : t2 = t1 × (d2/d1)^1.06
  const riegelExp = 1.06;
  const projPaceFlat = refPaceFlat * Math.pow(raceEqDist / refEqDist, riegelExp - 1);
  const projMinutes  = projPaceFlat * raceEqDist;

  return {
    minutes: Math.round(projMinutes),
    refName: ref.name || ref.sport,
    refDist: ref.dist,
    refPace: ref.pace,
    refDate: ref.date,
  };
}
function App() {
  const [tab, setTab] = useState('programme');
  const [athleteOpen, setAthleteOpen] = useState(false);
  const [athleteSection, setAthleteSection] = useState('Condition physique');
  const [view, setView] = useState(8);
  const [sport, setSport] = useState('Tous');
  const [dropdownOpen, setDropdownOpen] = useState(false);
  const [range, setRange] = useState(180);
  const [showElev, setShowElev] = useState(false);
  const [expanded, setExpanded] = useState(false);
  const [powRange, setPowRange] = useState(90);
  const [powCompare, setPowCompare] = useState(365);
  const [paceRange, setPaceRange] = useState(90);
  const [paceCompare, setPaceCompare] = useState(365);
  const [hrRange, setHrRange] = useState(90);
  const [hrCompare, setHrCompare] = useState(365);
  const [fitRange, setFitRange] = useState(90);
  const [status, setStatus] = useState('idle');
  const [error, setError] = useState('');
  const [data, setData] = useState([]);
  const [profile, setProfile] = useState({ name: '', gender: 'Non précisé', age: '', height: '', weight: '', fcMax: '', fcRest: '', ftp: '', bikeMass: '' });
  const [race, setRace] = useState({ type: 'Marathon', date: '2026-09-12', values: defaultValues('Marathon') });

  // ── Accordéon inline ─────────────────────────────────────────────────────
  const [openRowId, setOpenRowId] = useState(null);
  const [rowStreams, setRowStreams] = useState({}); // id → streams | 'loading' | { error: msg }
  const rowChartInsts = useRef({});

  const lineRef = useRef(null); const barRef = useRef(null); const dailyRef = useRef(null);
  const zoneRef = useRef(null); const powerRef = useRef(null); const paceRef = useRef(null);
  const hrRef = useRef(null); const fitRef = useRef(null);
  const charts = useRef({});

  function destroyChart(key) { if (charts.current[key]) { charts.current[key].destroy(); charts.current[key] = null; } }
  function upsert(key, ref, cfg) { if (!ref.current) return; destroyChart(key); charts.current[key] = new Chart(ref.current, cfg); }

  function applyAthlete(a) {
    setProfile(p => ({
      ...p,
      name: [a.firstname, a.lastname].filter(Boolean).join(' ') || p.name,
      gender: a.sex === 'F' ? 'Femme' : a.sex === 'M' ? 'Homme' : p.gender,
      weight: a.weight || p.weight, ftp: a.ftp || p.ftp,
    }));
  }

  // ── Strava OAuth ─────────────────────────────────────────────────────────
  const connect = useCallback(async () => {
    setStatus('loading'); setError('');
    const id = await resolveClientId();
    if (!id) { setStatus('error'); setError('Identifiant client Strava indisponible côté serveur.'); return; }
    window.location.href = 'https://www.strava.com/oauth/authorize?client_id=' + encodeURIComponent(id) +
      '&response_type=code&redirect_uri=' + encodeURIComponent(STRAVA_REDIRECT) +
      '&approval_prompt=auto&scope=activity:read_all,profile:read_all';
  }, []);

  const disconnect = useCallback(() => {
    localStorage.removeItem('strava_token'); localStorage.removeItem('strava_refresh_token'); localStorage.removeItem('strava_expires_at');
    setData([]); setStatus('idle'); setError('');
  }, []);

  // ── Init Strava ───────────────────────────────────────────────────────────
  useEffect(() => {
    async function init() {
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');
      let token = localStorage.getItem('strava_token');
      if (code) {
        setStatus('loading');
        try {
          const raw = await fetch(BASE + '/exchange-token?code=' + encodeURIComponent(code));
          const res = await raw.json();
          if (!res.access_token) {
            const detail = JSON.stringify(res);
            throw new Error('Strava: ' + detail);
          }
          token = res.access_token;
          localStorage.setItem('strava_token', token);
          if (res.refresh_token) localStorage.setItem('strava_refresh_token', res.refresh_token);
          if (res.expires_at) localStorage.setItem('strava_expires_at', String(res.expires_at));
          if (res.athlete) applyAthlete(res.athlete);
          window.history.replaceState({}, '', window.location.pathname);
        } catch (e) { setStatus('error'); setError(e.message); return; }
      }
      if (!token) { setStatus('idle'); return; }
      setStatus('loading'); setError('');
      try {
        token = await freshToken(token);
        const athlete = await stravaApi('/athlete', token);
        if (athlete && athlete.errors) throw new Error('Session Strava expirée — reconnecte-toi.');
        if (athlete) applyAthlete(athlete);
        const acts = [];
        for (let page = 1; page <= 8; page++) {
          const batch = await stravaApi('/athlete/activities?per_page=200&page=' + page, token);
          if (!Array.isArray(batch)) throw new Error(batch && batch.message ? batch.message : 'Réponse Strava inattendue');
          acts.push(...batch);
          if (batch.length < 200) break;
        }
        const mapped = acts.map(a => mapActivity(a)).filter(Boolean).sort((x, y) => y.date - x.date);
        setData(mapped); setStatus(mapped.length ? 'ready' : 'empty');
      } catch (e) { setStatus('error'); setError(e.message); }
    }
    init();
    async function loadLocal() {
      try {
        const res = await fetch('donnees-strava.json', { cache: 'no-store' });
        if (!res.ok) return;
        const raw = await res.json();
        const list = Array.isArray(raw) ? raw : (raw.activities || []);
        if (!list.length) return;
        if (raw.athlete) applyAthlete(raw.athlete);
        const mapped = list.map(a => mapActivity(a)).filter(Boolean).sort((x, y) => y.date - x.date);
        setData(prev => prev.length ? prev : mapped);
      } catch (e) {}
    }
    loadLocal();
  }, []);

  // ── Toggle accordéon + chargement streams ────────────────────────────────
  async function toggleRow(act) {
    const id = act.id;
    if (openRowId === id) {
      setOpenRowId(null);
      if (rowChartInsts.current[id]) { rowChartInsts.current[id].destroy(); delete rowChartInsts.current[id]; }
      return;
    }
    setOpenRowId(id);
    if (rowStreams[id] && rowStreams[id] !== 'loading') return;
    setRowStreams(prev => ({ ...prev, [id]: 'loading' }));
    const token = localStorage.getItem('strava_token');
    if (!token) {
      setRowStreams(prev => ({ ...prev, [id]: { error: 'Connecte Strava pour charger les données seconde par seconde.' } }));
      return;
    }
    try {
      const tk = await freshToken(token);
      const keys = 'heartrate,altitude,velocity_smooth,distance,time';
      const res = await stravaApi('/activities/' + id + '/streams?keys=' + encodeURIComponent(keys) + '&key_by_type=true', tk);
      if (!res || res.errors) throw new Error((res && res.message) ? res.message : 'Streams indisponibles');
      setRowStreams(prev => ({ ...prev, [id]: res }));
    } catch (e) {
      setRowStreams(prev => ({ ...prev, [id]: { error: 'Donnée manquante — ' + e.message } }));
    }
  }

  // ── Dessiner le graphique accordéon ──────────────────────────────────────
  function drawRowChart(id, act, streamsData, canvasEl, serieVis) {
    if (!canvasEl) return;
    if (rowChartInsts.current[id]) { rowChartInsts.current[id].destroy(); delete rowChartInsts.current[id]; }
    chartDefaults();
    const isBike = act.sport === 'Vélo';
    const vis = serieVis || { fc:true, alt:true, vel:true, pow:true };
    const timeData = (streamsData.time && streamsData.time.data) || [];
    const hrData   = (streamsData.heartrate && streamsData.heartrate.data) || [];
    const altData  = (streamsData.altitude && streamsData.altitude.data) || [];
    const velData  = (streamsData.velocity_smooth && streamsData.velocity_smooth.data) || [];
    const distData = (streamsData.distance && streamsData.distance.data) || [];
    const estPowData = (streamsData._estPow && streamsData._estPow.data) || [];
    const N = Math.max(1, Math.floor(timeData.length / 800));
    const thin = arr => arr.filter((_, i) => i % N === 0);
    const thinDist = thin(distData);
    const thinTime = thin(timeData);
    const usesDist = thinDist.length === thinTime.length && thinDist.length > 0;
    const xLabels = usesDist ? thinDist.map(d => (d / 1000).toFixed(2)) : thinTime.map(t => (t / 60).toFixed(1));
    // Échelle altitude : min du tracé → min+1000 (fixe pour comparaison inter-activités)
    const altMin = altData.length ? Math.floor(Math.min(...altData) / 10) * 10 : 0;
    const altMax = altMin + 1000;
    const datasets = [];
    if (altData.length && vis.alt) datasets.push({ label: 'Altitude (m)', data: thin(altData), borderColor: '#201e1d', borderWidth: 1.5, backgroundColor: 'rgba(32,30,29,0.08)', fill: true, tension: 0.3, pointRadius: 0, pointHoverRadius: 4, yAxisID: 'yAlt', spanGaps: true });
    if (velData.length && vis.vel) {
      const conv = isBike ? v => v > 0 ? Math.round(v * 3.6 * 10) / 10 : null : v => v > 0 ? Math.round((1000 / 60 / v) * 100) / 100 : null;
      datasets.push({ label: isBike ? 'Vitesse (km/h)' : 'Allure (min/km)', data: thin(velData).map(conv), borderColor: '#3d3a3a', borderWidth: 1.5, backgroundColor: 'transparent', fill: false, tension: 0.3, pointRadius: 0, pointHoverRadius: 4, yAxisID: 'yPace', spanGaps: true });
    }
    const scales = { x: { grid: { display: false }, ticks: { maxRotation: 0, autoSkipPadding: 40 }, title: { display: true, text: usesDist ? 'Distance (km)' : 'Temps (min)', color: '#605d5d' } } };
    if (altData.length && vis.alt) scales.yAlt = { position: 'right', min: altMin, max: altMax, grid: { display: false }, border: { display: false }, title: { display: true, text: 'Altitude (m)', color: '#201e1d' } };
    if (velData.length && vis.vel) {
      scales.yPace = { position: 'left', reverse: !isBike, grid: { color: 'rgba(32,30,29,0.1)', drawTicks: false }, border: { display: false }, title: { display: true, text: isBike ? 'Vitesse (km/h)' : 'Allure (min/km)', color: '#3d3a3a' }, ticks: !isBike ? { callback: v => { const m = Math.floor(v); const s = Math.round((v - m) * 60); return m + "'" + String(s).padStart(2,'0') + '"'; } } : {} };
    }
    rowChartInsts.current[id] = new Chart(canvasEl, {
      type: 'line', plugins: [crosshairPlugin],
      data: { labels: xLabels, datasets },
      options: { responsive: true, maintainAspectRatio: false, animation: { duration: 0 }, interaction: { mode: 'index', intersect: false, axis: 'x' }, hover: { animationDuration: 0 }, plugins: { legend: { display: false }, tooltip: { enabled: true, animation: false, backgroundColor: '#201e1d', cornerRadius: 0, padding: 10, displayColors: true, callbacks: { label: c => { const v = c.parsed.y; if (v === null) return null; if (c.dataset.yAxisID==='yPow') return c.dataset.label+' · '+v+' W'; if (c.dataset.yAxisID==='yHr') return c.dataset.label+' · '+v+' bpm'; return c.dataset.label+' · '+v; } } } }, scales },
    });
  }

  }

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
