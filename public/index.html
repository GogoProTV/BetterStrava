document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

font-weight: 800; letter-spacing: -0.01em;\">Temps par zone cardiaque<\u002Fh2>\n                <span style=\"font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: #605d5d;\">Répartition<\u002Fspan>\n              <\u002Fdiv>\n              <p style=\"margin: 0 0 14px; font-size: 12px; color: #605d5d; max-width: 42ch;\">{{ zoneNote }}<\u002Fp>\n              <div style=\"height: 190px;\"><canvas ref=\"{{ zoneRef }}\"><\u002Fcanvas><\u002Fdiv>\n              <div style=\"display: flex; flex-direction: column; margin-top: 16px;\">\n                <sc-for list=\"{{ zones }}\" as=\"z\" hint-placeholder-count=\"5\">\n                  <div style=\"display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; padding: 6px 0; border-bottom: 1px solid #d7d3d3;\">\n                    <span style=\"{{ z.swatch }}\"><\u002Fspan>\n                    <span style=\"flex: 1 0 auto; font-size: 12px; font-weight: 600;\">{{ z.label }}<\u002Fspan>\n                    <span style=\"font-size: 12px; font-variant-numeric: tabular-nums;\">{{ z.time }}<\u002Fspan>\n                    <span style=\"font-size: 12px; color: #605d5d; font-variant-numeric: tabular-nums;\">{{ z.pct }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n        <\u002Fsection>\n\n        <section style=\"padding: 28px 32px 48px;\">\n          <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 20px;\">\n            <h2 style=\"margin: 0; font-size: 16px; font-weight: 800; letter-spacing: -0.01em;\">Séances de la sélection<\u002Fh2>\n            <span style=\"font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: #605d5d;\">{{ tableNote }}<\u002Fspan>\n          <\u002Fdiv>\n          <sc-raw-table style=\"width: 100%; border-collapse: collapse; font-size: 14px;\">\n            <sc-raw-thead>\n              <sc-raw-tr style=\"borde                <sc-raw-td style=\"padding: 12px; text-align: right; font-variant-numeric: tabular-nums;\">{{ row.dist }}<\u002Fsc-raw-td>\n                  <sc-raw-td style=\"padding: 12px; text-align: right; font-variant-numeric: tabular-nums;\">{{ row.time }}<\u002Fsc-raw-td>\n                  <sc-raw-td style=\"padding: 12px; text-align: right; font-variant-numeric: tabular-nums;\">{{ row.elev }}<\u002Fsc-raw-td>\n                  <sc-raw-td style=\"padding: 12px; text-align: right; font-variant-numeric: tabular-nums;\">{{ row.pace }}<\u002Fsc-raw-td>\n                  <sc-raw-td style=\"padding: 12px 0 12px 12px; text-align: right; font-variant-numeric: tabular-nums; color: #605d5d;\">{{ row.power }}<\u002Fsc-raw-td>\n                <\u002Fsc-raw-tr>\n              <\u002Fsc-for>\n            <\u002Fsc-raw-tbody>\n          <\u002Fsc-raw-table>\n          <div style=\"display: flex; align-items: center; gap: 16px; margin-top: 24px;\">\n            <button type=\"button\" sc-camel-on-click=\"{{ toggleRows }}\" style=\"min-width: 200px; padding: 12px 16px; border: 2px solid #201e1d; background: transparent; color: #201e1d; font-family: inherit; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; text-align: left; cursor: pointer;\" style-hover=\"background: #ffe0d9; border-color: #ec3013;\">{{ toggleLabel }}<\u002Fbutton>\n            <span style=\"font-size: 12px; color: #605d5d;\">{{ rowCountNote }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsection>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fmain>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;units&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Kilomètres&quot;,&quot;Miles&quot;],&quot;default&quot;:&quot;Kilomètres&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Données&quot;}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.lineRef = React.createRef();\n    this.barRef = React.createRef();\n    this.dailyRef = React.createRef();\n    this.zoneRef = React.createRef();\n    this.charts = {};\n    this.state = { tab: 'programme', athleteOpen: false, athleteSection: 'Condition physique', nWeeks: 6, sport: 'Tous', range: 180, metric: 'km', expanded: false };\n    this.data = this.buildData();\n    this.planned = this.buildPlanned();\n    this.raceCatalog = this.buildRaceCatalog();\n    const first = 'Marathon';\n    this.state.race = { type: first, date: '2026-09-12', values: this.defaultValues(first) };\n    this.state.view = 8;\n    this.state.profile = { name: 'C. Marchand', gender: 'Femme', age: 34, height: 172, weight: 61, fcMax: 191, fcRest: 48, ftp: 268 };\n  }\n\n  buildRaceCatalog() {\n    const tri = (swim, bike, bikeD, run, runD) => ({\n      fields: [\n        { k: 'swim', label: 'Natation (km)', v: swim, step: 0.1 },\n        { k: 'bike', label: 'Vélo (km)', v: bike },\n        { k: 'bikeElev', label: 'D+ vélo (m)', v: bikeD, step: 10 },\n        { k: 'run', label: 'Course (km)', v: run, step: 0.1 },\n        { k: 'runElev', label: 'D+ course (m)', v: runD, step: 10 },\n      ],\n    });\n    const run = (dist, elev, step) => ({\n      fields: [\n        { k: 'run', label: 'Distance (km)', v: dist, step: step || 0.1 },\n        { k: 'runElev', label: 'Dénivelé D+ (m)', v: elev, step: 10 },\n        { k: 'runElevNeg', label: 'Dénivelé D− (m)', v: elev, step: 10 },\n      ],\n    });\n    const bike = (dist, elev) => ({\n      fields: [\n        { k: 'bike', label: 'Distance (km)', v: dist },\n        { k: 'bikeElev', label: 'Dénivelé D+ (m)', v: elev, step: 10 },\n      ],\n    });\n    return {\n      'Triathlon XS': tri(0.4, 10, 60, 2.5, 20),\n      'Triathlon S': tri(0.75, 20, 150, 5, 40),\n      'Triathlon M': tri(1.5, 40, 350, 10, 70),\n      'Triathlon L': tri(3, 80, 900, 20, 150),\n      'Triathlon 70.3': tri(1.9, 90, 800, 21.1, 160),\n      'Ironman': tri(3.8, 180, 1600, 42.2, 300),\n      'Marathon': run(42.195, 250),\n      'Semi-marathon': run(21.097, 120),\n      '10 km': run(10, 50),\n      'Trail court (moins de 25 km)': run(21, 1100),\n      'Trail long (25–50 km)': run(42, 2400),\n      'Ultra-trail (plus de 80 km)': run(105, 6000, 1),\n      'Cyclosportive': bike(140, 2600),\n      'Contre-la-montre vélo': bike(40, 250),\n      'Natation eau libre': { fields: [{ k: 'swim', label: 'Distance (km)', v: 5, step: 0.1 }, { k: 'swimTemp', label: 'Température (°C)', v: 18 }] },\n    };\n  }\n\n  defaultValues(type) {\n    const out = {};\n    (this.raceCatalog[type] || { fields: [] }).fields.forEach(f => { out[f.k] = f.v; });\n    return out;\n  }\n\n  rng(seed) {\n    let a = seed;\n    return () => {\n      a |= 0; a = (a + 0x6d2b79f5) | 0;\n      let t = Math.imul(a ^ (a >>> 15), 1 | a);\n      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;\n      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;\n    };\n  }\n\n  buildData() {\n    const r = this.rng(20260826);\n    const today = new Date(); today.setHours(12, 0, 0, 0);\n    const out = [];\n    for (let d = 820; d >= 0; d--) {\n      const date = new Date(today.getTime() - d * 86400000);\n      const month = date.getMonth();\n      const season = 0.62 + 0.38 * Math.sin(((month - 2) / 12) * Math.PI * 2);\n      const trend = 0.82 + (820 - d) / 820 * 0.32;\n      if (r() > 0.52 * season * trend) continue;\n      const pick = r();\n      let sport, dist, pace, elev, power = null, hr;\n      if (pick < 0.44) {\n        sport = 'Course'; dist = 6 + r() * 12; elev = 15 + r() * 220;\n        pace = 4.25 + r() * 1.15 + elev / dist / 220 - (820 - d) / 820 * 0.18;\n        hr = 142 + r() * 26;\n      } else if (pick < 0.62) {\n        sport = 'Trail'; dist = 9 + r() * 21; elev = 320 + r() * 1050;\n        pace = 5.6 + r() * 1.9 + elev / dist / 160; hr = 138 + r() * 24;\n      } else if (pick < 0.9) {\n        sport = 'Vélo'; dist = 28 + r() * 92; elev = 180 + r() * 1250;\n        const speed = 25 + r() * 9 - elev / dist / 12;\n        pace = 60 / Math.max(14, speed);\n        power = 148 + r() * 82 + (820 - d) / 820 * 12; hr = 128 + r() * 22;\n      } else {\n        sport = 'Natation'; dist = 1 + r() * 2.2; elev = 0; pace = 17 + r() * 4; hr = 130 + r() * 16;\n      }\n      const time = dist * pace;\n      const load = time / 60 * (hr - 110) / 30;\n      const fatigue = Math.max(1, Math.min(5, Math.round(1 + load * 1.15)));\n      out.push({\n        date, sport,\n        dist: Math.round(dist * 10) / 10,\n        time: Math.round(time),\n        elev: Math.round(elev),\n        pace, power: power ? Math.round(power) : null,\n        hr: Math.round(hr), fatigue, planned: false,\n      });\n    }\n    return out.sort((a, b) => b.date - a.date);\n  }\n\n  buildPlanned() {\n    const r = this.rng(776611);\n    const today = new Date(); today.setHours(12, 0, 0, 0);\n    const plans = [\n      { sport: 'Course', label: 'Seuil 5×1000', min: 62, f: 4 },\n      { sport: 'Vélo', label: 'Endurance', min: 165, f: 2 },\n      { sport: 'Course', label: 'Footing', min: 48, f: 1 },\n      { sport: 'Trail', label: 'Côtes D+', min: 130, f: 5 },\n      { sport: 'Natation', label: 'Technique', min: 45, f: 2 },\n      { sport: 'Vélo', label: 'Intervalles PMA', min: 90, f: 4 },\n      { sport: 'Course', label: 'Sortie longue', min: 105, f: 3 },\n    ];\n    const out = [];\n    for (let d = 1; d <= 21; d++) {\n      if (r() > 0.66) continue;\n      const p = plans[Math.floor(r() * plans.length)];\n      const date = new Date(today.getTime() + d * 86400000);\n      out.push({ date, sport: p.sport, label: p.label, time: p.min, dist: 0, elev: 0, fatigue: p.f, planned: true });\n    }\n    return out;\n  }\n\n  weekStart(d) { const x = new Date(d); const day = (x.getDay() + 6) % 7; x.setDate(x.getDate() - day); x.setHours(0, 0, 0, 0); return x; }\n  sum(list, key) { return list.reduce((s, a) => s + (a[key] || 0), 0); }\n  fmtNum(v, dec) { return v.toLocaleString('fr-FR', { minimumFractionDigits: dec, maximumFractionDigits: dec }); }\n  fmtPace(min) {\n    if (!isFinite(min) || min <= 0) return '—';\n    const total = Math.round(min * 60);\n    return Math.floor(total / 60) + \"'\" + String(total % 60).padStart(2, '0') + '\"';\n  }\n  fmtH(min) { const h = Math.floor(min / 60); return h + 'h' + String(Math.round(min % 60)).padStart(2, '0'); }\n\n  workoutLabel(a) {\n    const sets = {\n      Course: ['Footing Z1', 'Long Z2', '20 min seuil', '6 × 30/30', '5 × 1000 Z5'],\n      Trail: ['Marche Z1', 'Long Z2', 'Côtes 8 × 1', '2 × 15 seuil', 'D+ 1000 Z4'],\n      'Vélo': ['Récup Z1', 'End. Z2', '2 × 20 seuil', '6 × 30/30 PMA', '5 × 3 min PMA'],\n      Natation: ['Tech. 1,5 km', '10 × 100 Z2', '8 × 100 seuil', '16 × 50 Z4', '10 × 50 sprint'],\n    };\n    const list = sets[a.sport] || sets.Course;\n    return list[Math.max(1, Math.min(5, a.fatigue || 2)) - 1];\n  }\n\n  fatigueColor(f) { return ['#ffe0d9', '#ffb3a3', '#f97a60', '#ec3013', '#ae1800'][Math.max(1, Math.min(5, f)) - 1]; }\n  fatigueInk(f) { return f >= 4 ? '#ffffff' : '#201e1d'; }\n\n  btnStyle(active) {\n    return 'padding: 9px 14px; border: 2px solid ' + (active ? '#ec3013' : '#201e1d') +\n      '; background: ' + (active ? '#ec3013' : 'transparent') + '; color: ' + (active ? '#ffffff' : '#201e1d') +\n      '; font-family: inherit; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; text-align: left; cursor: pointer;';\n  }\n\n  navStyle(active, sub) {\n    return 'display: flex; align-items: center; gap: 10px; width: 100%; padding: ' + (sub ? '11px 24px 11px 38px' : '15px 24px') +\n      '; border: 0; border-bottom: ' + (sub ? '1px solid #d7d3d3' : '2px solid #201e1d') +\n      '; background: ' + (active ? '#ec3013' : 'transparent') + '; color: ' + (active ? '#ffffff' : '#201e1d') +\n      '; font-family: inherit; font-size: ' + (sub ? '12px' : '13px') + '; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; text-align: left; cursor: pointer;';\n  }\n\n  deltaChip(pct, betterHigh) {\n    if (pct === null || !isFinite(pct)) return { text: '—', style: 'padding: 3px 8px; font-size: 12px; font-weight: 600; background: #eae9e9; color: #605d5d;', arrow: '→', arrowStyle: 'font-size: 15px; color: #605d5d;' };\n    const good = betterHigh ? pct > 0 : pct < 0;\n    const flat = pct === 0;\n    return {\n      text: (pct > 0 ? '+' : '') + pct + '%',\n      style: 'padding: 3px 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; background: ' + (flat ? '#eae9e9' : good ? '#ffe0d9' : '#eae9e9') + '; color: ' + (flat ? '#605d5d' : good ? '#ae1800' : '#444141') + ';',\n      arrow: flat ? '→' : pct > 0 ? '▲' : '▼',\n      arrowStyle: 'font-size: 13px; line-height: 1; color: ' + (flat ? '#605d5d' : good ? '#ec3013' : '#605d5d') + ';',\n    };\n  }\n\n  // ---- Activités tab helpers (unchanged behaviour) ----\n  filtered(rangeDays, sport) {\n    const cutoff = Date.now() - rangeDays * 86400000;\n    return this.data.filter(a => a.date.getTime() >= cutoff && (sport === 'Tous' || a.sport === sport));\n  }\n  window(offset) {\n    const { range, sport } = this.state;\n    const end = Date.now() - offset * range * 86400000;\n    const start = end - range * 86400000;\n    return this.data.filter(a => a.date.getTime() >= start && a.date.getTime() < end && (sport === 'Tous' || a.sport === sport));\n  }\n\n  componentDidMount() { this.draw(); }\n  componentDidUpdate() { this.draw(); }\n  componentWillUnmount() { clearTimeout(this._t); Object.values(this.charts).forEach(c => c && c.destroy()); }\n\n  draw() {\n    if (this.state.tab !== 'activites') return;\n    if (!window.Chart) { clearTimeout(this._t); this._t = setTimeout(() => this.draw(), 120); return; }\n    const C = window.Chart;\n    C.defaults.font.family = 'Archivo, system-ui, sans-serif';\n    C.defaults.font.size = 11;\n    C.defaults.color = '#605d5d';\n    const grid = { color: 'rgba(32,30,29,0.12)', drawTicks: false };\n    const base = {\n      responsive: true, maintainAspectRatio: false, animation: { duration: 240 },\n      plugins: { legend: { display: false }, tooltip: { backgroundColor: '#201e1d', cornerRadius: 0, padding: 10, displayColors: false } },\n    };\n    const acts = this.filtered(this.state.range, this.state.sport);\n\n    const byWeek = this.state.range <= 90;\n    const buckets = new Map();\n    const keyOf = d => byWeek ? this.weekStart(d).getTime() : new Date(d.getFullYear(), d.getMonth(), 1).getTime();\n    if (byWeek) {\n      const nWeeks = Math.ceil(this.state.range / 7);\n      for (let i = nWeeks - 1; i >= 0; i--) buckets.set(keyOf(new Date(Date.now() - i * 7 * 86400000)), { km: 0, h: 0, elev: 0 });\n    } else {\n      const nMonths = Math.max(3, Math.round(this.state.range / 30));\n      for (let i = nMonths - 1; i >= 0; i--) { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - i); buckets.set(keyOf(d), { km: 0, h: 0, elev: 0 }); }\n    }\n    acts.forEach(a => { const w = buckets.get(keyOf(a.date)); if (w) { w.km += a.dist; w.h += a.time / 60; w.elev += a.elev; } });\n    const metric = this.state.metric;\n    const labels = [...buckets.keys()].map(k => new Date(k).toLocaleDateString('fr-FR', byWeek ? { day: 'numeric', month: 'short' } : { month: 'short', year: '2-digit' }));\n    const vals = [...buckets.values()].map(w => Math.round((metric === 'km' ? w.km : metric === 'h' ? w.h : w.elev) * 10) / 10);\n    this.upsert('line', this.lineRef, {\n      type: 'line',\n      data: { labels, datasets: [{ data: vals, borderColor: '#ec3013', borderWidth: 2, backgroundColor: 'rgba(236,48,19,0.08)', fill: true, tension: 0.25, pointRadius: 3.5, pointBackgroundColor: '#ec3013', pointBorderColor: '#f3f2f2', pointBorderWidth: 1.5, pointHoverRadius: 6 }] },\n      options: {\n        ...base,\n        scales: {\n          x: { grid: { display: false }, ticks: { maxRotation: 0, autoSkipPadding: 18 }, title: { display: true, text: byWeek ? 'Semaines' : 'Mois', —') + ' kg · FTP ' + (p.ftp || '—') + ' W',\n        derived: 'IMC ' + (bmi ?? '—') + ' · rapport poids-puissance ' + (wkg ?? '—') + ' W/kg · réserve cardiaque ' +\n          (p.fcMax && p.fcRest ? p.fcMax - p.fcRest + ' bpm' : '—') + '.',\n      },\n      genders: ['Femme', 'Homme', 'Non précisé'],\n      profileFields,\n      profileStats: seasonStats,\n      onProfileName: e => setP('name', e.target.value),\n      onProfileGender: e => setP('gender', e.target.value),\n      navProgramme: this.navStyle(tab === 'programme'),\n      navAthlete: this.navStyle(tab === 'athlete'),\n      navActivites: this.navStyle(tab === 'activites'),\n      caretStyle: 'font-size: 12px; line-height: 1; transform: rotate(' + (athleteOpen ? '180deg' : '0deg') + ');',\n      athleteOpen,\n      athleteItems: athleteSections.map(s => ({\n        label: s,\n        style: this.navStyle(tab === 'athlete' && athleteSection === s, true),\n        key: s,\n        onSelect: () => this.setState({ tab: 'athlete', athleteSection: s }),\n      })),\n      athleteTitle: athleteSection,\n      goProgramme: () => this.setState({ tab: 'programme' }),\n      goActivites: () => this.setState({ tab: 'activites' }),\n      toggleAthlete: () => this.setState(s => ({ athleteOpen: !s.athleteOpen, tab: 'athlete' })),\n\n      weeks: this.buildWeeks(),\n\n      goalKpis: [\n        { label: 'Objectif', value: race.type, unit: '', delta: raceDateObj ? raceDateObj.toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: '2-digit' }) : '—', note: daysToRace === null ? '' : 'J−' + daysToRace, good: null, big: false },\n        { label: 'Temps projeté', value: '3h42', unit: '', delta: '−4 %', note: 'vs 2025', good: true },\n        { label: 'Prêt · Readiness', value: String(ready), unit: '%', delta: ready >= 75 ? 'En bonne voie' : 'À consolider', note: race.type, good: ready >= 75 },\n        { label: 'Semaines restantes', value: String(weeksLeft), unit: 'sem.', delta: weeksDone + ' faites', note: 'sur ' + plan, good: null },\n      ].map((k, i) => ({\n        label: k.label, value: k.value, unit: k.unit, delta: k.delta, deltaNote: k.note,\n        valueStyle: 'font-size: ' + (k.big === false ? (String(k.value).length > 16 ? '16px' : '20px') : '24px') + '; font-weight: 800; letter-spacing: -0.02em; line-height: 1.05;',\n        deltaStyle: 'padding: 3px 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; background: ' +\n          (k.good ? '#ffe0d9' : '#eae9e9') + '; color: ' + (k.good ? '#ae1800' : '#605d5d') + ';',\n        cellStyle: 'min-width: 0; padding: 24px 24px 28px;' + (i < 3 ? ' border-right: 2px solid #201e1d;' : ''),\n      })),\n      viewOptions: [{ label: 'Saison', value: 'saison' }, { label: '4 sem.', value: 4 }, { label: '8 sem.', value: 8 }].map(o => ({\n        label: o.label, style: this.btnStyle(this.state.view === o.value), onSelect: () => this.setState({ view: o.value }),\n      })),\n      raceTypes: Object.keys(this.raceCatalog),\n      raceType: race.type,\n      raceDate: race.date,\n      raceFields,\n      onRaceType: e => { const t = e.target.value; this.setState(s => ({ race: { ...s.race, type: t, values: this.defaultValues(t) } })); },\n      onRaceDate: e => { const d = e.target.value; this.setState(s => ({ race: { ...s.race, date: d } })); },\n      raceCountdown: daysToRace === null ? 'Aucune date renseignée.' : daysToRace >= 0\n        ? 'Dans ' + daysToRace + ' jours · ' + Math.round(daysToRace / 7) + ' semaines de préparation restantes.'\n        : 'Course passée il y a ' + Math.abs(daysToRace) + ' jours.',\n      raceSummary: spec.fields.map(f => f.label.replace(/ \\(.*\\)/, '') + ' : ' + (race.values[f.k] === '' ? '—' : race.values[f.k])).join(' · '),\n      topSports,\n      goal: {\n        name: race.type,\n        date: raceDateObj ? raceDateObj.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' }) : 'date à définir',\n        ready: ready,\n        projected: '3h42',\n        delta: goalChip.text, deltaStyle: goalChip.style,\n        barStyle: 'position: absolute; left: 0; top: 0; bottom: 0; width: ' + ready + '%; background: #ec3013;',\n        weeksDone, weeksLeft,\n        note: 'Estimation basée sur les ' + Math.round(load90) + ' h des 90 derniers jours (' + (loadPrev > 0 ? (load90 >= loadPrev ? '+' : '') + Math.round(((load90 - loadPrev) / loadPrev) * 100) + ' % vs la même période en 2025' : 'pas de référence 2025') + '), la régularité hebdomadaire et la charge des ' + weeksLeft + ' semaines restantes.',\n      },\n\n      lineRef: this.lineRef, barRef: this.barRef, dailyRef: this.dailyRef,\n      kpis, rows,\n      zoneRef: this.zoneRef,\n      showEfforts: sport !== 'Tous',\n      zonePlacement: 'grid-column: 2; min-width: 0; padding: 28px 32px 32px; grid-row: ' + (sport !== 'Tous' ? '2;' : '1 / span 2;'),\n      zones: (() => {\n        const zm = this.zoneMinutes(acts);\n        const total = zm.reduce((s, z) => s + z.min, 0) || 1;\n        return zm.map(z => ({\n          label: z.label,\n          time: this.fmtH(z.min),\n          pct: Math.round((z.min / total) * 100) + ' %',\n          swatch: 'flex: 0 0 auto; width: 12px; height: 12px; background: ' + z.color + '; border: 1px solid #d7d3d3;',\n        }));\n      })(),\n      effortSlots: (sport === 'Vélo'\n        ? ['5 km', '10 km', '20 km', '50 km']\n        : ['400 m', '1 km', '5 km', '10 km', '20 km']).map(l => ({ label: l })),\n      zoneNote: 'Minutes passées dans chaque zone de fréquence cardiaque sur la période affichée, calculées à partir d\\'une FC max de ' + (this.state.profile.fcMax || 190) + ' bpm.',\n      dailyRangeLabel: range >= 365 ? '12 mois' : range >= 180 ? '6 mois' : range + ' jours',\n      volumeTitle: range <= 90 ? 'Volume par semaine' : 'Volume par mois',\n      volumeAxisLabel: range <= 90 ? 'Abscisse en semaines' : 'Abscisse en mois',\n      sportSplitTitle: range <= 90 ? 'Heures par sport et par semaine' : 'Heures par sport et par mois',\n      dailyNote: 'Minutes d\\'activité par jour sur la période affichée : ' + new Set(this.filtered(range, sport).map(a => a.date.toDateString())).size + ' jours actifs, ' + Math.round(this.sum(this.filtered(range, sport), 'time') / 60) + ' h cumulées. Les week-ends sont en gris.',\n      sportOptions: mkOptions([\n        { label: 'Tous', value: 'Tous' }, { label: 'Course', value: 'Course' }, { label: 'Trail', value: 'Trail' },\n        { label: 'Vélo', value: 'Vélo' }, { label: 'Natation', value: 'Natation' },\n      ], 'sport'),\n      rangeOptions: mkOptions([{ label: '30 j', value: 30 }, { label: '90 j', value: 90 }, { label: '6 mois', value: 180 }, { label: '12 mois', value: 365 }], 'range'),\n      metricOptions: mkOptions([{ label: 'Distance', value: 'km' }, { label: 'Heures', value: 'h' }, { label: 'D+', value: 'elev' }], 'metric'),\n      selectionLabel: acts.length + ' séances · ' + (sport === 'Tous' ? 'tous sports' : sport),\n      selectionSub: this.fmtNum(Math.round(this.sum(acts, 'dist') * conv), 0) + ' ' + unit + ' · ' + Math.round(this.sum(acts, 'time') / 60) + ' h · +' + this.fmtNum(this.sum(acts, 'elev'), 0) + ' m',\n      tableNote: (expanded ? Math.min(40, acts.length) : Math.min(8, acts.length)) + ' / ' + acts.length,\n      rowCountNote: 'Trié du plus récent au plus ancien.',\n      toggleLabel: expanded ? 'Réduire la liste' : 'Voir plus de séances',\n      toggleRows: () => this.setState(s => ({ expanded: !s.expanded })),\n      exportCsv: this.exportCsv,\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
