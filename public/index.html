<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Analyse d'entraînement</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #f3f2f2; color: #201e1d; font-family: "Archivo", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: #ae1800; text-decoration: none; border-bottom: 2px solid #ec3013; }
  a:hover { color: #ec3013; }
  ::selection { background: #ffc4b8; }
  button:focus-visible, [tabindex]:focus-visible { outline: 2px solid #ec3013; outline-offset: 2px; }
</style>
</head>
<body>
<div id="root" style="display: flex; align-items: flex-start; min-height: 100vh; background: #f3f2f2;"></div>

<script>
// ═══════════════════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════════════════
function weekStart(d) {
  const x = new Date(d);
  const day = (x.getDay() + 6) % 7;
  x.setDate(x.getDate() - day);
  x.setHours(0, 0, 0, 0);
  return x;
}
function sum(list, key) { return list.reduce((s, a) => s + (a[key] || 0), 0); }
function fmtNum(v, dec) { return Number(v).toLocaleString('fr-FR', { minimumFractionDigits: dec ?? 0, maximumFractionDigits: dec ?? 0 }); }
function fmtPace(min) {
  if (!isFinite(min) || min <= 0) return '—';
  const total = Math.round(min * 60);
  return Math.floor(total / 60) + "'" + String(total % 60).padStart(2, '0') + '"';
}
function fmtH(min) { const h = Math.floor(min / 60); return h + 'h' + String(Math.round(min % 60)).padStart(2, '0'); }
function fatigueColor(f) { return ['#ffe0d9','#ffb3a3','#f97a60','#ec3013','#ae1800'][Math.max(1, Math.min(5, f)) - 1]; }
function fatigueInk(f) { return f >= 4 ? '#ffffff' : '#201e1d'; }

function btnStyle(active) {
  return 'padding: 9px 14px; border: 2px solid ' + (active ? '#ec3013' : '#201e1d') +
    '; background: ' + (active ? '#ec3013' : 'transparent') + '; color: ' + (active ? '#ffffff' : '#201e1d') +
    '; font-family: inherit; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; text-align: left; cursor: pointer;';
}
function navStyle(active, sub) {
  return 'display: flex; align-items: center; gap: 10px; width: 100%; padding: ' + (sub ? '11px 24px 11px 38px' : '15px 24px') +
    '; border: 0; border-bottom: ' + (sub ? '1px solid #d7d3d3' : '2px solid #201e1d') +
    '; background: ' + (active ? '#ec3013' : 'transparent') + '; color: ' + (active ? '#ffffff' : '#201e1d') +
    '; font-family: inherit; font-size: ' + (sub ? '12px' : '13px') + '; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; text-align: left; cursor: pointer;';
}
function deltaChip(pct, betterHigh) {
  if (pct === null || !isFinite(pct)) return { text: '—', style: 'padding: 3px 8px; font-size: 12px; font-weight: 600; background: #eae9e9; color: #605d5d;', arrow: '→', arrowStyle: 'font-size: 15px; color: #605d5d;' };
  const good = betterHigh ? pct > 0 : pct < 0;
  const flat = pct === 0;
  return {
    text: (pct > 0 ? '+' : '') + pct + '%',
    style: 'padding: 3px 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; background: ' + (flat ? '#eae9e9' : good ? '#ffe0d9' : '#eae9e9') + '; color: ' + (flat ? '#605d5d' : good ? '#ae1800' : '#444141') + ';',
    arrow: flat ? '→' : pct > 0 ? '▲' : '▼',
    arrowStyle: 'font-size: 13px; line-height: 1; color: ' + (flat ? '#605d5d' : good ? '#ec3013' : '#605d5d') + ';',
  };
}

// ═══════════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════════
const state = {
  tab: 'programme',
  athleteOpen: false,
  athleteSection: 'Condition physique',
  sport: 'Tous',
  range: 180,
  metric: 'km',
  expanded: false,
  view: 8,
  status: 'idle', // idle | loading | ready | empty | error
  error: '',
  profile: { name: '', gender: 'Non précisé', age: '', height: '', weight: '', fcMax: '', fcRest: '', ftp: '' },
  race: { type: 'Marathon', date: '2026-09-12', values: {} },
};

const raceCatalog = buildRaceCatalog();
state.race.values = defaultValues('Marathon');

let data = [];
let charts = {};
let lineRef = null, dailyRef = null, zoneRef = null;
let drawTimer = null;

function buildRaceCatalog() {
  const tri = (swim, bike, bikeD, run, runD) => ({ fields: [
    { k: 'swim', label: 'Natation (km)', v: swim, step: 0.1 },
    { k: 'bike', label: 'Vélo (km)', v: bike },
    { k: 'bikeElev', label: 'D+ vélo (m)', v: bikeD, step: 10 },
    { k: 'run', label: 'Course (km)', v: run, step: 0.1 },
    { k: 'runElev', label: 'D+ course (m)', v: runD, step: 10 },
  ]});
  const run = (dist, elev, step) => ({ fields: [
    { k: 'run', label: 'Distance (km)', v: dist, step: step || 0.1 },
    { k: 'runElev', label: 'Dénivelé D+ (m)', v: elev, step: 10 },
    { k: 'runElevNeg', label: 'Dénivelé D− (m)', v: elev, step: 10 },
  ]});
  const bike = (dist, elev) => ({ fields: [
    { k: 'bike', label: 'Distance (km)', v: dist },
    { k: 'bikeElev', label: 'Dénivelé D+ (m)', v: elev, step: 10 },
  ]});
  return {
    'Triathlon XS': tri(0.4, 10, 60, 2.5, 20),
    'Triathlon S': tri(0.75, 20, 150, 5, 40),
    'Triathlon M': tri(1.5, 40, 350, 10, 70),
    'Triathlon L': tri(3, 80, 900, 20, 150),
    'Triathlon 70.3': tri(1.9, 90, 800, 21.1, 160),
    'Ironman': tri(3.8, 180, 1600, 42.2, 300),
    'Marathon': run(42.195, 250),
    'Semi-marathon': run(21.097, 120),
    '10 km': run(10, 50),
    'Trail court (moins de 25 km)': run(21, 1100),
    'Trail long (25–50 km)': run(42, 2400),
    'Ultra-trail (plus de 80 km)': run(105, 6000, 1),
    'Cyclosportive': bike(140, 2600),
    'Contre-la-montre vélo': bike(40, 250),
    'Natation eau libre': { fields: [{ k: 'swim', label: 'Distance (km)', v: 5, step: 0.1 }, { k: 'swimTemp', label: 'Température (°C)', v: 18 }] },
  };
}
function defaultValues(type) {
  const out = {};
  (raceCatalog[type] || { fields: [] }).fields.forEach(f => { out[f.k] = f.v; });
  return out;
}

// ═══════════════════════════════════════════════════════════════════
// STRAVA
// ═══════════════════════════════════════════════════════════════════
async function resolveClientId() {
  try {
    const cfg = await fetch('/.netlify/functions/strava-config').then(r => r.json());
    if (cfg && cfg.client_id) return String(cfg.client_id);
  } catch (e) {}
  return '';
}

function storeToken(res) {
  localStorage.setItem('strava_token', res.access_token);
  if (res.refresh_token) localStorage.setItem('strava_refresh_token', res.refresh_token);
  if (res.expires_at) localStorage.setItem('strava_expires_at', String(res.expires_at));
  return res.access_token;
}

async function freshToken(token) {
  const exp = Number(localStorage.getItem('strava_expires_at') || 0);
  const refresh = localStorage.getItem('strava_refresh_token');
  if (!refresh || !exp || exp * 1000 - Date.now() > 5 * 60000) return token;
  try {
    const res = await fetch('/.netlify/functions/exchange-token?refresh_token=' + encodeURIComponent(refresh)).then(r => r.json());
    if (res && res.access_token) return storeToken(res);
  } catch (e) {}
  return token;
}

function api(path, token) {
  return fetch('/.netlify/functions/strava-api?path=' + encodeURIComponent(path), {
    headers: { authorization: 'Bearer ' + token },
  }).then(r => r.json());
}

async function connect() {
  setState({ status: 'loading', error: '' });
  const id = await resolveClientId();
  if (!id) { setState({ status: 'error', error: 'Client ID Strava indisponible.' }); return; }
  const redirect = window.location.origin + window.location.pathname;
  window.location.href = 'https://www.strava.com/oauth/authorize?client_id=' + encodeURIComponent(id) +
    '&response_type=code&redirect_uri=' + encodeURIComponent(redirect) +
    '&approval_prompt=auto&scope=activity:read_all,profile:read_all';
}

function disconnect() {
  localStorage.removeItem('strava_token');
  localStorage.removeItem('strava_refresh_token');
  localStorage.removeItem('strava_expires_at');
  data = [];
  setState({ status: 'idle', error: '' });
}

function applyAthlete(a) {
  if (!a) return;
  setState(s => ({
    profile: {
      ...s.profile,
      name: [a.firstname, a.lastname].filter(Boolean).join(' ') || s.profile.name,
      gender: a.sex === 'F' ? 'Femme' : a.sex === 'M' ? 'Homme' : s.profile.gender,
      weight: a.weight || s.profile.weight,
      ftp: a.ftp || s.profile.ftp,
    },
  }));
}

function mapActivity(a) {
  const map = {
    Run: 'Course', VirtualRun: 'Course', TrailRun: 'Trail',
    Ride: 'Vélo', VirtualRide: 'Vélo', GravelRide: 'Vélo', MountainBikeRide: 'Vélo', EBikeRide: 'Vélo',
    Swim: 'Natation',
  };
  const sport = map[a.sport_type || a.type];
  if (!sport) return null;
  const dist = (a.distance || 0) / 1000;
  const time = Math.round((a.moving_time || a.elapsed_time || 0) / 60);
  if (!time) return null;
  const effort = a.suffer_score;
  return {
    date: new Date(a.start_date_local || a.start_date),
    name: a.name || null,
    sport,
    dist: Math.round(dist * 10) / 10,
    time,
    elev: Math.round(a.total_elevation_gain || 0),
    pace: dist > 0 ? time / dist : null,
    power: a.average_watts ? Math.round(a.average_watts) : null,
    hr: a.average_heartrate ? Math.round(a.average_heartrate) : null,
    fatigue: effort ? Math.max(1, Math.min(5, Math.ceil(effort / 40))) : null,
    planned: false,
  };
}

async function initStrava() {
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  let token = localStorage.getItem('strava_token');
  if (code) {
    setState({ status: 'loading' });
    try {
      const res = await fetch('/.netlify/functions/exchange-token?code=' + encodeURIComponent(code)).then(r => r.json());
      if (!res.access_token) throw new Error(res.message || res.error || 'Échange du code impossible');
      token = storeToken(res);
      if (res.athlete) applyAthlete(res.athlete);
      window.history.replaceState({}, '', window.location.pathname);
    } catch (e) {
      setState({ status: 'error', error: e.message });
      return;
    }
  }
  if (!token) { setState({ status: 'idle' }); return; }
  setState({ status: 'loading', error: '' });
  try {
    token = await freshToken(token);
    const athlete = await api('/athlete', token);
    if (athlete && athlete.errors) throw new Error('Session Strava expirée — reconnecte-toi.');
    if (athlete) applyAthlete(athlete);
    const acts = [];
    for (let page = 1; page <= 8; page++) {
      const batch = await api('/athlete/activities?per_page=200&page=' + page, token);
      if (!Array.isArray(batch)) throw new Error(batch && batch.message ? batch.message : 'Réponse Strava inattendue');
      acts.push(...batch);
      if (batch.length < 200) break;
    }
    data = acts.map(mapActivity).filter(a => a).sort((x, y) => y.date - x.date);
    setState({ status: data.length ? 'ready' : 'empty' });
  } catch (e) {
    setState({ status: 'error', error: e.message });
  }
}

// ═══════════════════════════════════════════════════════════════════
// COMPUTED VALUES
// ═══════════════════════════════════════════════════════════════════
function filtered(rangeDays, sport) {
  const cutoff = Date.now() - rangeDays * 86400000;
  return data.filter(a => a.date.getTime() >= cutoff && (sport === 'Tous' || a.sport === sport));
}

function windowData(offset) {
  const { range, sport } = state;
  const end = Date.now() - offset * range * 86400000;
  const start = end - range * 86400000;
  return data.filter(a => a.date.getTime() >= start && a.date.getTime() < end && (sport === 'Tous' || a.sport === sport));
}

function zoneMinutes(list) {
  const max = Number(state.profile.fcMax) || 190;
  const defs = [
    { label: 'Z1 · récup', hi: 0.6, color: '#ffe0d9' },
    { label: 'Z2 · endurance', hi: 0.7, color: '#ffb3a3' },
    { label: 'Z3 · tempo', hi: 0.8, color: '#f97a60' },
    { label: 'Z4 · seuil', hi: 0.9, color: '#ec3013' },
    { label: 'Z5 · VMA', hi: 1.2, color: '#ae1800' },
  ].map(d => ({ ...d, min: 0 }));
  list.forEach(a => {
    if (!a.hr) return;
    const ratio = a.hr / max;
    const z = defs.find(d => ratio <= d.hi) || defs[4];
    z.min += a.time;
  });
  return defs;
}

function buildWeeks() {
  const thisWeek = weekStart(new Date());
  const oldest = data.length ? weekStart(data[data.length - 1].date) : thisWeek;
  const allWeeks = Math.max(1, Math.round((thisWeek.getTime() - oldest.getTime()) / (7 * 86400000)) + 1);
  const n = state.view === 'saison' ? allWeeks : Math.min(allWeeks, state.view);
  const starts = [];
  // semaine en cours en premier (index 0), puis vers le passé
  for (let i = 0; i < n; i++) starts.push(new Date(thisWeek.getTime() - i * 7 * 86400000));
  const dows = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'];
  const today = new Date(); today.setHours(0, 0, 0, 0);

  const agg = s => {
    const end = s.getTime() + 7 * 86400000;
    const list = data.filter(a => a.date.getTime() >= s.getTime() && a.date.getTime() < end);
    const done = list.filter(a => !a.planned);
    return { list, done, min: sum(done, 'time'), km: sum(done, 'dist'), elev: sum(done, 'elev'), n: done.length };
  };

  return starts.map((s, idx) => {
    const cur = agg(s);
    const prev = agg(new Date(s.getTime() - 7 * 86400000));
    const isFuture = s.getTime() > today.getTime();
    const isCurrent = s.getTime() === thisWeek.getTime();
    const pct = (a, b) => (b > 0 ? Math.round(((a - b) / b) * 100) : null);

    const days = dows.map((dow, i) => {
      const d = new Date(s.getTime() + i * 86400000);
      const sessions = cur.list.filter(a => a.date.toDateString() === d.toDateString()).map(a => {
        const c = fatigueColor(a.fatigue || 3);
        const short = { Course: 'Course', Trail: 'Trail', 'Vélo': 'Vélo', Natation: 'Nat.' };
        const fi = a.fatigue;
        return {
          sport: short[a.sport] || a.sport,
          time: fmtH(a.time),
          workout: a.name || 'Donnée manquante',
          detail: a.dist ? fmtNum(a.dist, 1) + ' km' : '',
          ifLabel: fi ? 'IF ' + fi : '',
          ifStyle: fi ? 'align-self: flex-start; margin-top: 4px; padding: 1px 5px; font-size: 10px; font-weight: 800; letter-spacing: 0.06em; background: rgba(255,255,255,0.35); border: 1px solid currentColor;' : 'display:none;',
          title: a.sport + ' · fatigue ' + (fi || '?') + '/5',
          style: 'flex: 1 1 0; min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: center; padding: 6px 3px; border: 2px solid ' + c + '; background: ' + c + '; color: ' + fatigueInk(a.fatigue || 3) + ';',
        };
      });
      const isToday = d.toDateString() === today.toDateString();
      return {
        dow, num: d.getDate(), sessions, empty: sessions.length === 0,
        numStyle: 'font-size: 12px; font-weight: 800; ' + (isToday ? 'padding: 1px 6px; background: #201e1d; color: #ffffff;' : 'color: #201e1d;'),
        cellStyle: 'min-width: 0; padding: 12px 6px 14px;' + (i < 6 ? ' border-right: 1px solid #d7d3d3;' : '') +
          (d.getDay() === 0 || d.getDay() === 6 ? ' background: #eae9e9;' : ''),
      };
    });

    const mkStat = (label, value, p, betterHigh) => {
      const chip = deltaChip(p, betterHigh);
      return { label, value, delta: chip.text, deltaStyle: chip.style, arrow: chip.arrow, arrowStyle: chip.arrowStyle };
    };

    const rated = cur.done.filter(a => a.fatigue);
    const avgF = rated.length ? rated.reduce((s2, a) => s2 + a.fatigue, 0) / rated.length : 0;
    const fLabels = ['Donnée manquante', 'Facile', 'Modérée', 'Soutenue', 'Dure', 'Très dure'];

    return {
      titleStyle: 'font-size: ' + (isCurrent ? '17px' : '15px') + '; font-weight: 800; letter-spacing: -0.01em; color: ' + (isCurrent ? '#ae1800' : '#201e1d') + ';',
      title: isCurrent ? 'Semaine en cours' : 'Semaine du ' + s.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long' }) + (s.getFullYear() !== new Date().getFullYear() ? ' ' + s.getFullYear() : ''),
      span: s.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' }) + ' → ' + new Date(s.getTime() + 6 * 86400000).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' }),
      tag: isFuture ? 'Planifiée' : isCurrent ? 'En cours' : cur.min >= prev.min ? 'Charge en hausse' : 'Charge en baisse',
      tagStyle: 'padding: 3px 8px; font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; background: ' +
        (isFuture ? '#eae9e9' : isCurrent ? '#201e1d' : cur.min >= prev.min ? '#ffe0d9' : '#eae9e9') + '; color: ' +
        (isCurrent ? '#ffffff' : isFuture ? '#605d5d' : cur.min >= prev.min ? '#ae1800' : '#444141') + ';',
      blockNote: cur.n + (cur.n > 1 ? ' séances réalisées' : ' séance réalisée'),
      rowStyle: isCurrent
        ? 'border-top: 2px solid #ec3013; border-bottom: 2px solid #ec3013; border-left: 6px solid #ec3013; background: #fdf1ee;'
        : 'border-bottom: 2px solid #201e1d;',
      days,
      stats: [
        mkStat('Temps', cur.min ? fmtH(cur.min) : 'Donnée manquante', pct(cur.min, prev.min), true),
        mkStat('Distance', cur.km ? fmtNum(Math.round(cur.km), 0) + ' km' : 'Donnée manquante', pct(cur.km, prev.km), true),
        mkStat('D+', cur.elev ? '+' + fmtNum(Math.round(cur.elev), 0) + ' m' : 'Donnée manquante', pct(cur.elev, prev.elev), true),
        mkStat('Séances', String(cur.n), pct(cur.n, prev.n), true),
      ],
      fatigueDots: [1,2,3,4,5].map(i => ({
        style: 'width: 14px; height: 14px; background: ' + (i <= Math.round(avgF) ? fatigueColor(Math.round(avgF)) : '#eae9e9') + '; border: 1px solid #d7d3d3;',
      })),
      fatigueLabel: fLabels[Math.round(avgF)] || 'Donnée manquante',
    };
  });
}

function computeVals() {
  const { tab, athleteOpen, athleteSection, sport, range, metric, expanded } = state;
  const now = Date.now();
  const cur90 = data.filter(a => a.date.getTime() >= now - 90 * 86400000);
  const prev90 = data.filter(a => a.date.getTime() >= now - 455 * 86400000 && a.date.getTime() < now - 365 * 86400000);
  const race = state.race;
  const spec = raceCatalog[race.type] || { fields: [] };
  const raceDateObj = race.date ? new Date(race.date + 'T12:00:00') : null;
  const daysToRace = raceDateObj ? Math.round((raceDateObj.getTime() - now) / 86400000) : null;
  const weeksLeft = Math.max(0, Math.round(((raceDateObj ? raceDateObj.getTime() : now) - now) / (7 * 86400000)));
  const plan = 24;
  const weeksDone = Math.max(0, plan - weeksLeft);
  const load90 = sum(cur90, 'time') / 60, loadPrev = sum(prev90, 'time') / 60;
  const ready = Math.max(0, Math.min(99, Math.round(52 + (weeksDone / plan) * 34 + (loadPrev > 0 ? Math.min(12, ((load90 - loadPrev) / loadPrev) * 30) : 0))));
  const p = state.profile;
  const setP = (k, v) => setState(s => ({ profile: { ...s.profile, [k]: v } }));
  const bmi = p.height > 0 && p.weight > 0 ? Math.round((p.weight / Math.pow(p.height / 100, 2)) * 10) / 10 : null;
  const wkg = p.weight > 0 && p.ftp > 0 ? Math.round((p.ftp / p.weight) * 100) / 100 : null;
  const curW = windowData(0), prevW = windowData(1);
  const acts = filtered(range, sport);

  const mkOptions = (list, key) => list.map(o => ({
    label: o.label, style: btnStyle(state[key] === o.value),
    onSelect: () => setState({ [key]: o.value }),
  }));

  const kpiDef = [
    { label: 'Distance', unit: 'km', get: l => sum(l, 'dist'), dec: 0 },
    { label: 'Temps · Time', unit: 'h', get: l => sum(l, 'time') / 60, dec: 0 },
    { label: 'Dénivelé · Elevation', unit: 'm', get: l => sum(l, 'elev'), dec: 0 },
    sport === 'Vélo'
      ? { label: 'Puissance moy.', unit: 'W', get: l => { const pp = l.filter(a => a.power); return pp.length ? sum(pp, 'power') / pp.length : 0; }, dec: 0 }
      : sport === 'Tous'
        ? { label: 'Vitesse moy.', unit: 'km/h', get: l => { const d2 = sum(l, 'dist'), t2 = sum(l, 'time') / 60; return t2 ? d2 / t2 : 0; }, dec: 1, speed: true }
        : { label: 'Allure moy.', unit: '/km', get: l => { const d2 = sum(l, 'dist'), t2 = sum(l, 'time'); return d2 ? t2 / d2 : 0; }, dec: 2, pace: true },
  ];
  const kpis = kpiDef.map((k, i) => {
    const c = k.get(curW), pv = k.get(prevW);
    const pctv = pv > 0 ? Math.round(((c - pv) / pv) * 100) : null;
    const chip = deltaChip(pctv, !k.pace);
    const txt = !curW.length || !isFinite(c) || c === 0
      ? 'Donnée manquante'
      : k.pace ? fmtPace(c) : fmtNum(k.speed ? Math.round(c * 10) / 10 : Math.round(c), k.speed ? 1 : 0);
    return {
      label: k.label, unit: txt === 'Donnée manquante' ? '' : k.unit,
      value: txt,
      delta: chip.text, deltaNote: 'vs période précédente', deltaStyle: chip.style,
      valueStyle: 'font-size: ' + (txt.length > 10 ? '15px' : txt.length > 5 ? '30px' : '38px') + '; font-weight: 800; letter-spacing: -0.03em; line-height: 0.95;',
      cellStyle: 'min-width: 0; padding: 24px 24px 28px;' + (i < 3 ? ' border-right: 2px solid #201e1d;' : ''),
    };
  });

  const rows = acts.slice(0, expanded ? 40 : 8).map(a => ({
    date: a.date.toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: '2-digit' }),
    sport: a.sport,
    dist: fmtNum(a.dist, 1) + ' km',
    time: Math.floor(a.time / 60) + 'h' + String(a.time % 60).padStart(2, '0'),
    elev: a.elev ? '+' + fmtNum(a.elev, 0) + ' m' : 'Donnée manquante',
    pace: !a.pace ? 'Donnée manquante' : a.sport === 'Natation' ? fmtPace(a.pace / 10) + '/100m' : fmtPace(a.pace) + '/km',
    power: a.power ? a.power + ' W' : 'Donnée manquante',
  }));

  const goalKpis = [
    { label: 'Objectif', value: race.type, unit: '', delta: raceDateObj ? raceDateObj.toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: '2-digit' }) : '—', note: daysToRace === null ? '' : 'J−' + daysToRace, good: null },
    { label: 'Temps projeté', value: 'Donnée manquante', unit: '', delta: '—', note: 'à calculer', good: null },
    { label: 'Prêt · Readiness', value: data.length ? String(ready) : 'Donnée manquante', unit: data.length ? '%' : '', delta: data.length ? (ready >= 75 ? 'En bonne voie' : 'À consolider') : '—', note: race.type, good: data.length ? ready >= 75 : null },
    { label: 'Semaines restantes', value: String(weeksLeft), unit: 'sem.', delta: weeksDone + ' faites', note: 'sur ' + plan, good: null },
  ].map((k, i) => ({
    label: k.label, value: k.value, unit: k.unit, delta: k.delta, deltaNote: k.note,
    valueStyle: 'font-size: ' + (String(k.value).length > 16 ? '16px' : '20px') + '; font-weight: 800; letter-spacing: -0.02em; line-height: 1.05;',
    deltaStyle: 'padding: 3px 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; background: ' +
      (k.good ? '#ffe0d9' : '#eae9e9') + '; color: ' + (k.good ? '#ae1800' : '#605d5d') + ';',
    cellStyle: 'min-width: 0; padding: 24px 24px 28px;' + (i < 3 ? ' border-right: 2px solid #201e1d;' : ''),
  }));

  const zm = zoneMinutes(acts);
  const totalZone = zm.reduce((s, z) => s + z.min, 0) || 1;
  const raceFields = spec.fields.map(f => ({
    label: f.label, step: f.step || 1, value: race.values[f.k] ?? '',
    onInput: e => { const v = e.target.value; setState(s => ({ race: { ...s.race, values: { ...s.race.values, [f.k]: v === '' ? '' : Number(v) } } })); },
  }));
  const profileFields = [
    { k: 'age', label: 'Âge (ans)', step: 1 },
    { k: 'height', label: 'Taille (cm)', step: 1 },
    { k: 'weight', label: 'Poids (kg)', step: 0.1 },
    { k: 'fcMax', label: 'FC max (bpm)', step: 1 },
    { k: 'fcRest', label: 'FC repos (bpm)', step: 1 },
    { k: 'ftp', label: 'FTP vélo (W)', step: 1 },
  ].map(f => ({
    label: f.label, step: f.step, value: p[f.k] ?? '',
    onInput: e => { const v = e.target.value; setP(f.k, v === '' ? '' : Number(v)); },
  }));

  return {
    tab, athleteOpen, athleteSection, sport, range, metric, expanded,
    isProgramme: tab === 'programme', isAthlete: tab === 'athlete', isActivites: tab === 'activites', isProfil: tab === 'profil',
    weeks: data.length ? buildWeeks() : [],
    noData: !data.length,
    legendStyle: 'display: ' + (data.length ? 'flex' : 'none') + '; flex-wrap: wrap; align-items: flex-end; gap: 40px; padding: 22px 32px 44px;',
    noDataMsg: state.status === 'loading' ? 'Import des activités Strava…'
      : state.status === 'error' ? 'Erreur Strava : ' + state.error
      : state.status === 'empty' ? 'Aucune activité trouvée sur ce compte Strava.'
      : 'Donnée manquante — connecte ton compte Strava dans le panneau de gauche pour remplir cette page.',
    goalKpis,
    viewOptions: [{ label: 'Saison', value: 'saison' }, { label: '4 sem.', value: 4 }, { label: '8 sem.', value: 8 }].map(o => ({
      label: o.label, style: btnStyle(state.view === o.value), onSelect: () => setState({ view: o.value }),
    })),
    kpis, rows, acts,
    selectionLabel: acts.length ? acts.length + ' séances · ' + (sport === 'Tous' ? 'tous sports' : sport) : 'Donnée manquante',
    selectionSub: acts.length
      ? fmtNum(Math.round(sum(acts, 'dist')), 0) + ' km · ' + Math.round(sum(acts, 'time') / 60) + ' h · +' + fmtNum(sum(acts, 'elev'), 0) + ' m'
      : state.status === 'loading' ? 'Import Strava en cours…' : 'Connecte Strava pour importer tes activités.',
    sportOptions: mkOptions([
      { label: 'Tous', value: 'Tous' }, { label: 'Course', value: 'Course' }, { label: 'Trail', value: 'Trail' },
      { label: 'Vélo', value: 'Vélo' }, { label: 'Natation', value: 'Natation' },
    ], 'sport'),
    rangeOptions: mkOptions([{ label: '30 j', value: 30 }, { label: '90 j', value: 90 }, { label: '6 mois', value: 180 }, { label: '12 mois', value: 365 }], 'range'),
    metricOptions: mkOptions([{ label: 'Distance', value: 'km' }, { label: 'Heures', value: 'h' }, { label: 'D+', value: 'elev' }], 'metric'),
    tableNote: (expanded ? Math.min(40, acts.length) : Math.min(8, acts.length)) + ' / ' + acts.length,
    rowCountNote: acts.length ? 'Trié du plus récent au plus ancien.' : 'Donnée manquante — aucune activité importée.',
    toggleLabel: expanded ? 'Réduire la liste' : 'Voir plus de séances',
    toggleRows: () => setState(s => ({ expanded: !s.expanded })),
    showEfforts: sport !== 'Tous',
    effortSlots: (sport === 'Vélo' ? ['5 km','10 km','20 km','50 km'] : ['400 m','1 km','5 km','10 km','20 km']).map(l => ({ label: l })),
    zones: zm.map(z => ({
      label: z.label, time: fmtH(z.min), pct: Math.round((z.min / totalZone) * 100) + ' %',
      swatch: 'flex: 0 0 auto; width: 12px; height: 12px; background: ' + z.color + '; border: 1px solid #d7d3d3;',
    })),
    zoneNote: acts.some(a => a.hr) ? 'Minutes passées dans chaque zone de fréquence cardiaque, calculées à partir d\'une FC max de ' + (Number(state.profile.fcMax) || 190) + ' bpm.' : 'Donnée manquante — aucune fréquence cardiaque sur les activités importées.',
    zonePlacement: 'grid-column: 2; min-width: 0; padding: 28px 32px 32px; grid-row: ' + (sport !== 'Tous' ? '2;' : '1 / span 2;'),
    dailyRangeLabel: range >= 365 ? '12 mois' : range >= 180 ? '6 mois' : range + ' jours',
    volumeTitle: range <= 90 ? 'Volume par semaine' : 'Volume par mois',
    volumeAxisLabel: range <= 90 ? 'Abscisse en semaines' : 'Abscisse en mois',
    dailyNote: !acts.length ? 'Donnée manquante — aucune activité importée sur la période.' : 'Minutes d\'activité par jour : ' + new Set(acts.map(a => a.date.toDateString())).size + ' jours actifs, ' + Math.round(sum(acts, 'time') / 60) + ' h cumulées. Week-ends en gris.',
    stravaStatus: state.status === 'loading' ? 'Import des activités…'
      : state.status === 'ready' ? data.length + ' activités importées'
      : state.status === 'empty' ? 'Aucune activité trouvée.'
      : state.status === 'error' ? 'Erreur : ' + state.error
      : 'Non connecté — aucune donnée.',
    stravaBtnLabel: state.status === 'ready' ? 'Déconnecter' : state.status === 'loading' ? 'Chargement…' : 'Connecter Strava',
    stravaAction: state.status === 'ready' ? disconnect : connect,
    stravaBtnStyle: 'display: flex; align-items: center; width: 100%; padding: 11px 14px; border: 2px solid #201e1d; background: transparent; color: #201e1d; font-family: inherit; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; text-align: left; cursor: pointer;',
    exportStyle: 'display: flex; align-items: center; width: 100%; padding: 12px 14px; border: 2px solid ' +
      (data.length ? '#ec3013' : '#bab6b6') + '; background: ' + (data.length ? '#ec3013' : 'transparent') +
      '; color: ' + (data.length ? '#ffffff' : '#bab6b6') + '; font-family: inherit; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; text-align: left; cursor: ' + (data.length ? 'pointer' : 'not-allowed') + ';',
    exportCsv: () => {
      if (!data.length) return;
      const aa = filtered(range, sport);
      const head = 'date,sport,distance_km,duree_min,denivele_m,allure_min_km,puissance_w,fc_moy,fatigue\n';
      const body = aa.map(a => [a.date.toISOString().slice(0,10),a.sport,a.dist,a.time,a.elev,a.pace?Math.round(a.pace*100)/100:'',a.power||'',a.hr||'',a.fatigue||''].join(',')).join('\n');
      const url = URL.createObjectURL(new Blob([head+body],{type:'text/csv'}));
      const link = document.createElement('a'); link.href=url; link.download='analyse-entrainement.csv'; link.click(); URL.revokeObjectURL(url);
    },
    profile: {
      name: p.name || 'Donnée manquante',
      sub: p.height||p.weight||p.ftp ? [p.height?p.height+' cm':null,p.weight?p.weight+' kg':null,p.ftp?'FTP '+p.ftp+' W':null].filter(Boolean).join(' · ') : 'Donnée manquante',
      derived: 'IMC '+(bmi??'donnée manquante')+' · rapport poids-puissance '+(wkg??'donnée manquante')+' W/kg · réserve cardiaque '+(p.fcMax&&p.fcRest?p.fcMax-p.fcRest+' bpm':'donnée manquante')+'.',
    },
    genders: ['Femme','Homme','Non précisé'],
    profileFields,
    onProfileName: e => setP('name', e.target.value),
    onProfileGender: e => setP('gender', e.target.value),

    navAthlete: navStyle(tab==='athlete'),
    navActivites: navStyle(tab==='activites'),
    caretStyle: 'font-size: 12px; line-height: 1; transform: rotate('+(athleteOpen?'180deg':'0deg')+');',
    athleteItems: ['Condition physique','Puissance','Allure','Comparaison 2025'].map(s => ({

      onSelect: () => setState({ tab:'athlete', athleteSection:s }),
    })),
    athleteTitle: athleteSection,
    goProgramme: () => setState({ tab:'programme' }),
    goActivites: () => setState({ tab:'activites' }),
    toggleAthlete: () => setState(s => ({ athleteOpen:!s.athleteOpen, tab:'athlete' })),
    goProfil: () => setState({ tab:'profil' }),
    profileCardStyle: 'display: block; width: 100%; padding: 16px 24px 18px; border: 0; border-top: 2px solid #201e1d; background: '+(tab==='profil'?'#ffe0d9':'transparent')+'; font-family: inherit; text-align: left; cursor: pointer;',
    raceTypes: Object.keys(raceCatalog),
    raceType: race.type,
    raceDate: race.date,
    raceFields,
    onRaceType: e => { const t = e.target.value; setState(s => ({ race: {...s.race, type:t, values:defaultValues(t)} })); },
    onRaceDate: e => { const d = e.target.value; setState(s => ({ race: {...s.race, date:d} })); },
    raceCountdown: daysToRace===null ? 'Aucune date renseignée.' : daysToRace>=0
      ? 'Dans '+daysToRace+' jours · '+Math.round(daysToRace/7)+' semaines de préparation restantes.'
      : 'Course passée il y a '+Math.abs(daysToRace)+' jours.',
    raceSummary: spec.fields.map(f => f.label.replace(/ \(.*\)/,'')+' : '+(race.values[f.k]===''?'—':race.values[f.k])).join(' · '),
    goal: {
      date: raceDateObj ? raceDateObj.toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'}) : 'date à définir',
      ready, projected: 'Donnée manquante',
    },
  };
}

// ═══════════════════════════════════════════════════════════════════
// CHARTS
// ═══════════════════════════════════════════════════════════════════
function upsert(key, canvas, cfg) {
  if (!canvas) return;
  if (charts[key]) charts[key].destroy();
  charts[key] = new window.Chart(canvas, cfg);
}

function drawCharts(v) {
  if (v.tab !== 'activites') return;
  if (!window.Chart) { clearTimeout(drawTimer); drawTimer = setTimeout(() => drawCharts(v), 120); return; }
  const C = window.Chart;
  C.defaults.font.family = 'Archivo, system-ui, sans-serif';
  C.defaults.font.size = 11;
  C.defaults.color = '#605d5d';
  const grid = { color: 'rgba(32,30,29,0.12)', drawTicks: false };
  const base = {
    responsive: true, maintainAspectRatio: false, animation: { duration: 240 },
    plugins: { legend: { display: false }, tooltip: { backgroundColor: '#201e1d', cornerRadius: 0, padding: 10, displayColors: false } },
  };
  const acts = v.acts;
  const byWeek = v.range <= 90;
  const buckets = new Map();
  const keyOf = d => byWeek ? weekStart(d).getTime() : new Date(d.getFullYear(), d.getMonth(), 1).getTime();
  if (byWeek) {
    const nW = Math.ceil(v.range / 7);
    for (let i = nW-1; i >= 0; i--) buckets.set(keyOf(new Date(Date.now()-i*7*86400000)), {km:0,h:0,elev:0});
  } else {
    const nM = Math.max(3, Math.round(v.range/30));
    for (let i = nM-1; i >= 0; i--) { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth()-i); buckets.set(keyOf(d),{km:0,h:0,elev:0}); }
  }
  acts.forEach(a => { const w=buckets.get(keyOf(a.date)); if(w){w.km+=a.dist;w.h+=a.time/60;w.elev+=a.elev;} });
  const metric = v.metric;
  const labels = [...buckets.keys()].map(k => new Date(k).toLocaleDateString('fr-FR', byWeek?{day:'numeric',month:'short'}:{month:'short',year:'2-digit'}));
  const vals = [...buckets.values()].map(w => Math.round((metric==='km'?w.km:metric==='h'?w.h:w.elev)*10)/10);

  upsert('line', lineRef, {
    type:'line',
    data:{labels,datasets:[{data:vals,borderColor:'#ec3013',borderWidth:2,backgroundColor:'rgba(236,48,19,0.08)',fill:true,tension:0.25,pointRadius:3.5,pointBackgroundColor:'#ec3013',pointBorderColor:'#f3f2f2',pointBorderWidth:1.5,pointHoverRadius:6}]},
    options:{...base,scales:{
      x:{grid:{display:false},ticks:{maxRotation:0,autoSkipPadding:18},title:{display:true,text:byWeek?'Semaines':'Mois',color:'#605d5d'}},
      y:{grid,border:{display:false},beginAtZero:true,title:{display:true,text:metric==='km'?'Distance (km)':metric==='h'?'Heures':'Dénivelé D+ (m)',color:'#605d5d'}},
    }},
  });

  const days=[];
  const ds=new Date(); ds.setHours(0,0,0,0);
  for(let i=v.range-1;i>=0;i--) days.push(new Date(ds.getTime()-i*86400000));
  const perDay=new Map();
  data.forEach(a=>{
    if(v.sport!=='Tous'&&a.sport!==v.sport) return;
    const k=a.date.toDateString();
    perDay.set(k,(perDay.get(k)||0)+a.time);
  });
  upsert('daily', dailyRef, {
    type:'bar',
    data:{
      labels:days.map(d=>d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'})),
      datasets:[{
        data:days.map(d=>Math.round(perDay.get(d.toDateString())||0)),
        backgroundColor:days.map(d=>(d.getDay()===0||d.getDay()===6?'#605d5d':'#ec3013')),
        borderWidth:0,barPercentage:1,categoryPercentage:0.82,
      }],
    },
    options:{...base,
      plugins:{...base.plugins,tooltip:{...base.plugins.tooltip,callbacks:{label:c=>c.parsed.y+' min'}}},
      scales:{
        x:{grid:{display:false},ticks:{maxRotation:0,autoSkip:true,autoSkipPadding:28},title:{display:true,text:'Jours',color:'#605d5d'}},
        y:{grid,border:{display:false},beginAtZero:true,title:{display:true,text:'Minutes / jour',color:'#605d5d'}},
      },
    },
  });

  const zm = zoneMinutes(acts);
  upsert('zone', zoneRef, {
    type:'doughnut',
    data:{labels:zm.map(z=>z.label),datasets:[{data:zm.map(z=>z.min),backgroundColor:zm.map(z=>z.color),borderColor:'#f3f2f2',borderWidth:2}]},
    options:{...base,cutout:'46%',plugins:{
      legend:{display:false},
      tooltip:{...base.plugins.tooltip,displayColors:true,callbacks:{label:c=>c.label+' · '+Math.round(c.parsed/60)+' h ('+Math.round((c.parsed/zm.reduce((s,z)=>s+z.min,0))*100)+' %)'}},
    }},
  });
}

// RENDER
// ═══════════════════════════════════════════════════════════════════
function setState(updater) {
  if (typeof updater === 'function') {
    const next = updater(state);
    Object.assign(state, next);
  } else {
    Object.assign(state, updater);
  }
  render();
}

function el(tag, attrs, ...children) {
  const e = document.createElement(tag);
  if (attrs) {
    for (const [k, v] of Object.entries(attrs)) {
      if (k === 'style' && typeof v === 'string') e.style.cssText = v;
      else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2).toLowerCase(), v);
      else if (k === 'ref') v(e);
      else if (v !== null && v !== undefined && v !== false) e.setAttribute(k, v);
    }
  }
  for (const c of children.flat()) {
    if (c == null || c === false) continue;
    e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  return e;
}

      el('button', { type: 'button', style: v.stravaBtnStyle, onMouseenter: e => { e.currentTarget.style.background='#ffe0d9'; e.currentTarget.style.borderColor='#ec3013'; }, onMouseleave: e => { e.currentTarget.style.background='transparent'; e.currentTarget.style.borderColor='#201e1d'; }, onClick: v.stravaAction }, v.stravaBtnLabel),
    ),
    el('div', { style: 'padding: 8px 24px 20px;' },
      el('button', { type: 'button', style: v.exportStyle, onClick: v.exportCsv, onMouseenter: e => { if(data.length){e.currentTarget.style.background='#dd2b0f';} }, onMouseleave: e => { if(data.length){e.currentTarget.style.background='#ec3013';} } }, 'Exporter CSV'),
    ),
    // profile card
    el('button', { type: 'button', style: v.profileCardStyle, onMouseenter: e => { if(v.tab!=='profil') e.currentTarget.style.background='#ffe0d9'; }, onMouseleave: e => { if(v.tab!=='profil') e.currentTarget.style.background='transparent'; }, onClick: v.goProfil },
      el('span', { style: 'display: block; font-size: 10px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #605d5d;' }, 'Athlète · voir le profil'),

function renderProgramme(v) {
  return el('div', null,
    // header
    el('header', { style: 'display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 24px; padding: 24px 32px; border-bottom: 2px solid #201e1d;' },
      el('div', { style: 'display: flex; flex-direction: column; gap: 4px;' },
        el('span', { style: 'font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #ec3013;' }, 'Programme'),
        el('h1', { style: 'margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.02em; line-height: 1;' }, 'Calendrier par semaine'),
      ),

        ),
        el('label', { style: 'display: block; margin-top: 16px; font-size: 10px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #605d5d;' }, 'Date'),
        el('input', { type:'date', value: v.raceDate, style: 'width: 100%; margin-top: 8px; padding: 10px 12px; border: 2px solid #201e1d; border-radius: 0; background: #ffffff; color: #201e1d; font-family: inherit; font-size: 13px; font-weight: 600;', onChange: v.onRaceDate }),
        el('p', { style: 'margin: 14px 0 0; font-size: 12px; color: #605d5d;' }, v.raceCountdown),
        el('div', { style: 'display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; margin: 22px 0 16px; padding-top: 18px; border-top: 2px solid #201e1d;' },
          el('h3', { style: 'margin: 0; font-size: 13px; font-weight: 800; letter-spacing: 0.02em; text-transform: uppercase;' }, v.raceType),
          el('span', { style: 'font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: #605d5d;' }, 'Distances et dénivelés'),
        ),
        el('div', { style: 'display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 16px 20px;' },
          ...v.raceFields.map(f =>
            el('div', { style: 'display: flex; flex-direction: column; gap: 7px;' },
              el('label', { style: 'font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #605d5d;' }, f.label),
              el('input', { type:'number', step: f.step, value: f.value, style: 'width: 100%; padding: 10px 12px; border: 2px solid #201e1d; border-radius: 0; background: #ffffff; color: #201e1d; font-family: inherit; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums;', onFocus: e => e.target.style.borderColor='#ec3013', onBlur: e => e.target.style.borderColor='#201e1d', onChange: f.onInput }),
            )
          ),
        ),
        el('div', { style: 'display: flex; flex-wrap: wrap; align-items: center; gap: 16px; margin-top: 22px; padding-top: 18px; border-top: 2px solid #201e1d;' },
          el('div', null,
            el('span', { style: 'display: block; font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #605d5d;' }, 'Estimation'),
            el('div', { style: 'display: flex; align-items: baseline; gap: 6px; margin-top: 4px;' },
              el('span', { style: 'font-size: 30px; font-weight: 800; letter-spacing: -0.03em; line-height: 0.9;' }, String(v.goal.ready)),
              el('span', { style: 'font-size: 13px; font-weight: 600; color: #605d5d;' }, '% prêt'),
            ),
          ),
          el('div', { style: 'padding-left: 20px; border-left: 2px solid #201e1d;' },
            el('span', { style: 'display: block; font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #605d5d;' }, 'Temps projeté'),
            el('span', { style: 'display: block; margin-top: 4px; font-size: 24px; font-weight: 800; letter-spacing: -0.02em;' }, v.goal.projected),
          ),
          el('p', { style: 'margin: 0; flex: 1 1 260px; font-size: 12px; color: #605d5d;' }, v.raceSummary),
        ),
      ),
    ),
  );
}

function render() {
  const v = computeVals();
  lineRef = null; dailyRef = null; zoneRef = null;

  const main = el('div', null,
    v.isProgramme ? renderProgramme(v) : null,
    v.isAthlete ? renderAthlete(v) : null,
    v.isActivites ? renderActivites(v) : null,
    v.isProfil ? renderProfil(v) : null,
  );

  const root = document.getElementById('root');
  root.innerHTML = '';
  root.appendChild(renderSidebar(v));
  const mainWrap = el('main', { style: 'flex: 1; min-width: 0;' });
  mainWrap.appendChild(main);
  root.appendChild(mainWrap);

  if (v.isActivites) {
    requestAnimationFrame(() => drawCharts(v));
  }
}

// ═══════════════════════════════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════════════════════════════
document.addEventListener('DOMContentLoaded', () => {
  render();
  initStrava();
});
</script>
</body>
</html>
