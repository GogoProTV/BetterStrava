const { createElement: h, useState, useEffect, useRef, useCallback } = React;

// ── helpers ─────────────────────────────────────────────────────────────────
function weekStart(d) {
  const x = new Date(d);
  const day = (x.getDay() + 6) % 7;
  x.setDate(x.getDate() - day);
  x.setHours(0, 0, 0, 0);
  return x;
}
function sum(list, key) { return list.reduce((s, a) => s + (a[key] || 0), 0); }
function fmtNum(v, dec) { return Number(v).toLocaleString('fr-FR', { minimumFractionDigits: dec, maximumFractionDigits: dec }); }
function fmtPace(min) {
  if (!isFinite(min) || min <= 0) return '—';
  const total = Math.round(min * 60);
  return Math.floor(total / 60) + "'" + String(total % 60).padStart(2, '0') + '"';
}
function fmtH(min) { const h = Math.floor(min / 60); return h + 'h' + String(Math.round(min % 60)).padStart(2, '0'); }
function fatigueColor(f) { return ['#ffe0d9', '#ffb3a3', '#f97a60', '#ec3013', '#ae1800'][Math.max(1, Math.min(5, f)) - 1]; }
function fatigueInk(f) { return f >= 4 ? '#ffffff' : '#201e1d'; }
function btnStyle(active) {
  return {
    padding: '9px 14px', border: '2px solid ' + (active ? '#ec3013' : '#201e1d'),
    background: active ? '#ec3013' : 'transparent', color: active ? '#ffffff' : '#201e1d',
    fontFamily: 'inherit', fontSize: '12px', fontWeight: '600', letterSpacing: '0.08em',
    textTransform: 'uppercase', textAlign: 'left', cursor: 'pointer',
  };
}
function navStyle(active, sub) {
  return {
    display: 'flex', alignItems: 'center', gap: '10px', width: '100%',
    padding: sub ? '11px 24px 11px 38px' : '15px 24px',
    border: '0', borderBottom: sub ? '1px solid #d7d3d3' : '2px solid #201e1d',
    background: active ? '#ec3013' : 'transparent', color: active ? '#ffffff' : '#201e1d',
    fontFamily: 'inherit', fontSize: sub ? '12px' : '13px', fontWeight: '600',
    letterSpacing: '0.08em', textTransform: 'uppercase', textAlign: 'left', cursor: 'pointer',
  };
}
function deltaChip(pct, betterHigh) {
  if (pct === null || !isFinite(pct)) return { text: '—', style: { padding: '3px 8px', fontSize: '12px', fontWeight: '600', background: '#eae9e9', color: '#605d5d' }, arrow: '→', arrowStyle: { fontSize: '15px', color: '#605d5d' } };
  const good = betterHigh ? pct > 0 : pct < 0;
  const flat = pct === 0;
  return {
    text: (pct > 0 ? '+' : '') + pct + '%',
    style: { padding: '3px 8px', fontSize: '12px', fontWeight: '600', letterSpacing: '0.04em', background: flat ? '#eae9e9' : good ? '#ffe0d9' : '#eae9e9', color: flat ? '#605d5d' : good ? '#ae1800' : '#444141' },
    arrow: flat ? '→' : pct > 0 ? '▲' : '▼',
    arrowStyle: { fontSize: '13px', lineHeight: '1', color: flat ? '#605d5d' : good ? '#ec3013' : '#605d5d' },
  };
}

// ── activity mapping ─────────────────────────────────────────────────────────
function mapActivity(a) {
  const map = {
    Run: 'Course', VirtualRun: 'Course', TrailRun: 'Trail',
    Ride: 'Vélo', VirtualRide: 'Vélo', GravelRide: 'Vélo', MountainBikeRide: 'Vélo', EBikeRide: 'Vélo',
    Swim: 'Natation',
  };
  const sport = map[a.sport_type || a.type];
  if (!sport) return null;
  const dist = (a.distance || 0) / 1000;
  const time = Math.round((a.moving_time || a.elapsed_time || 0) / 60);
  if (!time) return null;
  const effort = a.suffer_score;
  return {
    date: new Date(a.start_date_local || a.start_date),
    name: a.name || null, sport, dist: Math.round(dist * 10) / 10, time,
    elev: Math.round(a.total_elevation_gain || 0),
    pace: dist > 0 ? time / dist : null,
    power: a.average_watts ? Math.round(a.average_watts) : null,
    maxPower: a.max_watts ? Math.round(a.max_watts) : null,
    secs: a.moving_time || a.elapsed_time || 0,
    hr: a.average_heartrate ? Math.round(a.average_heartrate) : null,
    fatigue: effort ? Math.max(1, Math.min(5, Math.ceil(effort / 40))) : null,
    trainingLoad: effort || Math.round(time * 0.85),
    planned: false,
  };
}

  'Ultra-trail (plus de 80 km)': { fields: [{k:'run',label:'Distance (km)',v:105,step:1},{k:'runElev',label:'Dénivelé D+ (m)',v:6000,step:10},{k:'runElevNeg',label:'Dénivelé D− (m)',v:6000,step:10}]},
  'Cyclosportive':{ fields: [{k:'bike',label:'Distance (km)',v:140},{k:'bikeElev',label:'Dénivelé D+ (m)',v:2600,step:10}]},
  'Contre-la-montre vélo': { fields: [{k:'bike',label:'Distance (km)',v:40},{k:'bikeElev',label:'Dénivelé D+ (m)',v:250,step:10}]},
  'Natation eau libre': { fields: [{k:'swim',label:'Distance (km)',v:5,step:0.1},{k:'swimTemp',label:'Température (°C)',v:18}]},

function defaultValues(type) {
  const out = {};
  (RACE_CATALOG[type] || { fields: [] }).fields.forEach(f => { out[f.k] = f.v; });
  return out;
}

// ── Strava API ────────────────────────────────────────────────────────────────
const BASE = '/.netlify/functions';

async function resolveClientId() {
  try {
    const cfg = await fetch(BASE + '/strava-config').then(r => r.json());
    if (cfg && cfg.client_id) return String(cfg.client_id);
  } catch (e) {}
  return '';
}

function stravaApi(path, token) {
  return fetch(BASE + '/strava-api?path=' + encodeURIComponent(path), {
    headers: { authorization: 'Bearer ' + token },
  }).then(r => r.json());
}

async function freshToken(token) {
  const exp = Number(localStorage.getItem('strava_expires_at') || 0);
  const refresh = localStorage.getItem('strava_refresh_token');
  if (!refresh || !exp || exp * 1000 - Date.now() > 5 * 60000) return token;
  try {
    const res = await fetch(BASE + '/exchange-token?refresh_token=' + encodeURIComponent(refresh)).then(r => r.json());
    if (res && res.access_token) {
      localStorage.setItem('strava_token', res.access_token);
      if (res.refresh_token) localStorage.setItem('strava_refresh_token', res.refresh_token);
      if (res.expires_at) localStorage.setItem('strava_expires_at', String(res.expires_at));
      return res.access_token;
    }
  } catch (e) {}
  return token;
}

// ── crosshair plugin ─────────────────────────────────────────────────────────
const crosshairPlugin = {
  id: 'crosshair',
  afterEvent(chart, args) {
    const e = args.event;
    chart._cx = (e.type === 'mousemove' && e.x >= chart.chartArea.left && e.x <= chart.chartArea.right) ? e.x : null;
    if (e.type === 'mouseout') chart._cx = null;
  },
  afterDatasetsDraw(chart) {
    if (chart._cx == null) return;
    const { ctx, chartArea } = chart;
    ctx.save(); ctx.beginPath();
    ctx.moveTo(chart._cx, chartArea.top); ctx.lineTo(chart._cx, chartArea.bottom);
    ctx.lineWidth = 1; ctx.strokeStyle = '#201e1d'; ctx.stroke(); ctx.restore();
  },
};

function chartDefaults() {
  Chart.defaults.font.family = 'Archivo, system-ui, sans-serif';
  Chart.defaults.font.size = 11;
  Chart.defaults.color = '#605d5d';
}

// ── zone minutes ─────────────────────────────────────────────────────────────
function zoneMinutes(list, fcMax) {
  const max = Number(fcMax) || 190;
  const defs = [
    { label: 'Z1 · récup', hi: 0.6, color: '#ffe0d9', min: 0 },
    { label: 'Z2 · endurance', hi: 0.7, color: '#ffb3a3', min: 0 },
    { label: 'Z3 · tempo', hi: 0.8, color: '#f97a60', min: 0 },
    { label: 'Z4 · seuil', hi: 0.9, color: '#ec3013', min: 0 },
    { label: 'Z5 · VMA', hi: 1.2, color: '#ae1800', min: 0 },
  ];
  list.forEach(a => {
    if (!a.hr) return;
    const ratio = a.hr / max;
    const z = defs.find(d => ratio <= d.hi) || defs[4];
    z.min += a.time;
  });
  return defs;
}

// ── fitness series ───────────────────────────────────────────────────────────
function fitnessSeries(data, days) {
  const end = new Date(); end.setHours(0, 0, 0, 0);
  const warmup = 42;
  const startCalc = new Date(end.getTime() - (days + warmup) * 86400000);
  const daily = new Map();
  data.forEach(a => {
    if (a.date < startCalc) return;
    const k = new Date(a.date); k.setHours(0, 0, 0, 0);
    const key = k.getTime();
    daily.set(key, (daily.get(key) || 0) + (a.trainingLoad || 0));
  });
  let ctl = 0, atl = 0;
  const out = [];
  for (let t = startCalc.getTime(); t <= end.getTime(); t += 86400000) {
    const load = daily.get(t) || 0;
    ctl = ctl + (load - ctl) / 42;
    atl = atl + (load - atl) / 7;
    out.push({ t, ctl: Math.round(ctl * 10) / 10, atl: Math.round(atl * 10) / 10, tsb: Math.round((ctl - atl) * 10) / 10 });
  }
  return out.slice(warmup);
}

// ── Main App ─────────────────────────────────────────────────────────────────
function App() {
  const [tab, setTab] = useState('programme');
  const [athleteOpen, setAthleteOpen] = useState(false);
  const [athleteSection, setAthleteSection] = useState('Condition physique');
  const [view, setView] = useState(8);
  const [sport, setSport] = useState('Tous');
  const [range, setRange] = useState(180);
  const [showElev, setShowElev] = useState(false);
  const [expanded, setExpanded] = useState(false);
  const [powRange, setPowRange] = useState(90);
  const [powCompare, setPowCompare] = useState(365);
  const [paceRange, setPaceRange] = useState(90);
  const [paceCompare, setPaceCompare] = useState(365);
  const [hrRange, setHrRange] = useState(90);
  const [hrCompare, setHrCompare] = useState(365);
  const [fitRange, setFitRange] = useState(90);
  const [status, setStatus] = useState('idle');
  const [error, setError] = useState('');
  const [data, setData] = useState([]);
  const [profile, setProfile] = useState({ name: '', gender: 'Non précisé', age: '', height: '', weight: '', fcMax: '', fcRest: '', ftp: '' });
  const [race, setRace] = useState({ type: 'Marathon', date: '2026-09-12', values: defaultValues('Marathon') });

  const lineRef = useRef(null);
  const barRef = useRef(null);
  const dailyRef = useRef(null);
  const zoneRef = useRef(null);
  const powerRef = useRef(null);
  const paceRef = useRef(null);
  const hrRef = useRef(null);
  const fitRef = useRef(null);
  const charts = useRef({});

  function destroyChart(key) {
    if (charts.current[key]) { charts.current[key].destroy(); charts.current[key] = null; }
  }
  function upsert(key, ref, cfg) {
    if (!ref.current) return;
    destroyChart(key);
    charts.current[key] = new Chart(ref.current, cfg);
  }

  function applyAthlete(a) {
    setProfile(p => ({
      ...p,
      name: [a.firstname, a.lastname].filter(Boolean).join(' ') || p.name,
      gender: a.sex === 'F' ? 'Femme' : a.sex === 'M' ? 'Homme' : p.gender,
      weight: a.weight || p.weight,
      ftp: a.ftp || p.ftp,
    }));
  }

  // ── Strava OAuth ───────────────────────────────────────────────────────────
  const connect = useCallback(async () => {
    setStatus('loading'); setError('');
    const id = await resolveClientId();
    if (!id) { setStatus('error'); setError('Identifiant client Strava indisponible côté serveur.'); return; }
    const redirect = window.location.origin + window.location.pathname;
    window.location.href = 'https://www.strava.com/oauth/authorize?client_id=' + encodeURIComponent(id) +
      '&response_type=code&redirect_uri=' + encodeURIComponent(redirect) +
      '&approval_prompt=auto&scope=activity:read_all,profile:read_all';
  }, []);

  const disconnect = useCallback(() => {
    localStorage.removeItem('strava_token');
    localStorage.removeItem('strava_refresh_token');
    localStorage.removeItem('strava_expires_at');
    setData([]); setStatus('idle'); setError('');
  }, []);

  // ── Init Strava (OAuth callback + token refresh) ───────────────────────────
  useEffect(() => {
    async function init() {
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');
      let token = localStorage.getItem('strava_token');
      if (code) {
        setStatus('loading');
        try {
          const res = await fetch(BASE + '/exchange-token?code=' + encodeURIComponent(code)).then(r => r.json());
          if (!res.access_token) throw new Error(res.message || res.error || 'Échange du code impossible');
          token = res.access_token;
          localStorage.setItem('strava_token', token);
          if (res.refresh_token) localStorage.setItem('strava_refresh_token', res.refresh_token);
          if (res.expires_at) localStorage.setItem('strava_expires_at', String(res.expires_at));
          if (res.athlete) applyAthlete(res.athlete);
          window.history.replaceState({}, '', window.location.pathname);
        } catch (e) { setStatus('error'); setError(e.message); return; }
      }
      if (!token) { setStatus('idle'); return; }
      setStatus('loading'); setError('');
      try {
        token = await freshToken(token);
        const athlete = await stravaApi('/athlete', token);
        if (athlete && athlete.errors) throw new Error('Session Strava expirée — reconnecte-toi.');
        if (athlete) applyAthlete(athlete);
        const acts = [];
        for (let page = 1; page <= 8; page++) {
          const batch = await stravaApi('/athlete/activities?per_page=200&page=' + page, token);
          if (!Array.isArray(batch)) throw new Error(batch && batch.message ? batch.message : 'Réponse Strava inattendue');
          acts.push(...batch);
          if (batch.length < 200) break;
        }
        const mapped = acts.map(a => mapActivity(a)).filter(Boolean).sort((x, y) => y.date - x.date);
        setData(mapped); setStatus(mapped.length ? 'ready' : 'empty');
      } catch (e) { setStatus('error'); setError(e.message); }
    }
    init();
    // Try local file if no Strava
    async function loadLocal() {
      try {
        const res = await fetch('donnees-strava.json', { cache: 'no-store' });
        if (!res.ok) return;
        const raw = await res.json();
        const list = Array.isArray(raw) ? raw : (raw.activities || []);
        if (!list.length) return;
        if (raw.athlete) applyAthlete(raw.athlete);
        const mapped = list.map(a => mapActivity(a)).filter(Boolean).sort((x, y) => y.date - x.date);
        setData(prev => prev.length ? prev : mapped);
      } catch (e) {}
    }
    loadLocal();
  }, []);

  // ── Export CSV ─────────────────────────────────────────────────────────────
  function exportCsv() {
    const acts = filtered(data, range, sport);
    const head = 'date,sport,distance_km,duree_min,denivele_m,allure_min_km,puissance_w,fc_moy,fatigue\n';
    const body = acts.map(a => [a.date.toISOString().slice(0, 10), a.sport, a.dist, a.time, a.elev, Math.round(a.pace * 100) / 100, a.power || '', a.hr, a.fatigue].join(',')).join('\n');
    const url = URL.createObjectURL(new Blob([head + body], { type: 'text/csv' }));
    const link = document.createElement('a');
    link.href = url; link.download = 'analyse-entrainement.csv'; link.click();
    URL.revokeObjectURL(url);
  }

  // ── Charts ─────────────────────────────────────────────────────────────────
  function filtered(d, rangeDays, sp) {
    const cutoff = Date.now() - rangeDays * 86400000;
    return d.filter(a => a.date.getTime() >= cutoff && (sp === 'Tous' || a.sport === sp));
  }

  function window2(d, offset, rangeDays, sp) {
    const end = Date.now() - offset * rangeDays * 86400000;
    const start = end - rangeDays * 86400000;
    return d.filter(a => a.date.getTime() >= start && a.date.getTime() < end && (sp === 'Tous' || a.sport === sp));
  }

  const POWER_DURATIONS = [
    { s: 5, l: '5 s' }, { s: 15, l: '15 s' }, { s: 30, l: '30 s' }, { s: 60, l: '1 min' },
    { s: 120, l: '2 min' }, { s: 300, l: '5 min' }, { s: 600, l: '10 min' }, { s: 1200, l: '20 min' },
    { s: 1800, l: '30 min' }, { s: 3600, l: '1 h' }, { s: 5400, l: '1 h 30' }, { s: 10800, l: '3 h' },
  ];

  function powerCurve(days, offset) {
    const end = Date.now() - (offset || 0) * days * 86400000;
    const start = end - days * 86400000;
    const rides = data.filter(a => a.sport === 'Vélo' && a.power && a.secs && a.date.getTime() >= start && a.date.getTime() < end);
    return POWER_DURATIONS.map(d => {
      let best = null;
      rides.forEach(a => {
        if (a.secs < d.s) { if (d.s <= 60 && a.maxPower) best = Math.max(best || 0, a.maxPower); return; }
        best = Math.max(best || 0, a.power);
        if (d.s <= 60 && a.maxPower) best = Math.max(best, a.maxPower);
      });
      return best;
    });
  }

  const PACE_DISTANCES = [
    { d: 1, l: '1 km' }, { d: 2, l: '2 km' }, { d: 5, l: '5 km' }, { d: 10, l: '10 km' },
    { d: 15, l: '15 km' }, { d: 21.1, l: 'Semi' }, { d: 30, l: '30 km' }, { d: 42.2, l: 'Marathon' },
  ];
  const HR_BINS = [
    { min: 100, max: 120, l: '100-120' }, { min: 120, max: 130, l: '120-130' }, { min: 130, max: 140, l: '130-140' },
    { min: 140, max: 150, l: '140-150' }, { min: 150, max: 160, l: '150-160' }, { min: 160, max: 170, l: '160-170' },
    { min: 170, max: 180, l: '170-180' }, { min: 180, max: 200, l: '180+' },
  ];

  function paceCurve(days, offset) {
    const end = Date.now() - (offset || 0) * days * 86400000;

            h('input', { type: 'date', value: race.date, onChange: e => setRace(r => ({ ...r, date: e.target.value })), style: { width: '100%', marginTop: '8px', padding: '10px 12px', border: '2px solid #201e1d', background: '#ffffff', color: '#201e1d', fontFamily: 'inherit', fontSize: '13px', fontWeight: '600' } }),
            h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(140px, 1fr))', gap: '16px 20px', marginTop: '20px' } },
              spec.fields.map(f =>
                h('div', { key: f.k, style: { display: 'flex', flexDirection: 'column', gap: '7px' } },
                  h('label', { style: { fontSize: '10px', fontWeight: '600', letterSpacing: '0.1em', textTransform: 'uppercase', color: '#605d5d' } }, f.label),
                  h('input', { type: 'number', step: f.step || 1, value: race.values[f.k] ?? '', onChange: e => { const v = e.target.value; setRace(r => ({ ...r, values: { ...r.values, [f.k]: v === '' ? '' : Number(v) } })); }, style: { width: '100%', padding: '10px 12px', border: '2px solid #201e1d', background: '#ffffff', color: '#201e1d', fontFamily: 'inherit', fontSize: '14px', fontWeight: '600', fontVariantNumeric: 'tabular-nums' } })
                )
              )
            ),
            h('div', { style: { display: 'flex', flexWrap: 'wrap', alignItems: 'center', gap: '16px', marginTop: '22px', paddingTop: '18px', borderTop: '2px solid #201e1d' } },
              h('div', null,
                h('span', { style: { display: 'block', fontSize: '10px', fontWeight: '600', letterSpacing: '0.1em', textTransform: 'uppercase', color: '#605d5d' } }, 'Estimation'),
                h('div', { style: { display: 'flex', alignItems: 'baseline', gap: '6px', marginTop: '4px' } },
                  h('span', { style: { fontSize: '30px', fontWeight: '800', letterSpacing: '-0.03em', lineHeight: '0.9' } }, data.length ? ready : '—'),
                  h('span', { style: { fontSize: '13px', fontWeight: '600', color: '#605d5d' } }, '% prêt')
                )
              ),
              h('div', { style: { paddingLeft: '20px', borderLeft: '2px solid #201e1d' } },
                h('span', { style: { display: 'block', fontSize: '10px', fontWeight: '600', letterSpacing: '0.1em', textTransform: 'uppercase', color: '#605d5d' } }, 'Temps projeté'),
                h('span', { style: { display: 'block', marginTop: '4px', fontSize: '24px', fontWeight: '800', letterSpacing: '-0.02em' } }, 'Donnée manquante')
              )
            )
          )
        ),
        h('section', { style: { display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', borderBottom: '2px solid #201e1d' } },
          seasonStats.map((s, i) =>
            h('div', { key: i, style: s.cellStyle },
              h('span', { style: { display: 'block', fontSize: '11px', fontWeight: '600', letterSpacing: '0.12em', textTransform: 'uppercase', color: '#605d5d' } }, s.label),
              h('div', { style: { display: 'flex', flexWrap: 'wrap', alignItems: 'baseline', gap: '8px', marginTop: '8px' } },
                h('span', { style: { fontSize: '28px', fontWeight: '800', letterSpacing: '-0.02em', lineHeight: '1' } }, s.value),
                s.unit && h('span', { style: { fontSize: '13px', fontWeight: '600', color: '#605d5d' } }, s.unit)
              ),
              h('div', { style: { display: 'flex', alignItems: 'center', gap: '6px', marginTop: '6px' } },
                h('span', { style: s.arrowStyle }, s.arrow),
                h('span', { style: s.deltaStyle }, s.delta)
              )
            )
          )
        )
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
